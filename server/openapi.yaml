        recovery_identity_proof_signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
        proof_signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Current session device signature over this request with proof_signature omitted}
        previous_recovery_signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Required only when rotating an existing Recovery descriptor; omitted on initial setup}
