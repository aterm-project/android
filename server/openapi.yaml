        vault_id,key_epoch,sealed_sha256}. An existing deposit for the Vault,
        epoch and key is never overwritten. Malformed, unknown, foreign,
        deleting and left Vaults all return the same 404.
      x-implementation-status: implemented
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: key_epoch, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,17}$'}}
