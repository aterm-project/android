  /admin/overview:
    get:
      summary: Read-only instance-wide administrative overview
      description: >-
        Requires the caller's current active authenticated session and a
        normalized account username in ATERMIUS_ADMIN_USERNAMES. Configuration
        entries use the account username normalizer (trim and lowercase); any
        malformed entry fails closed by making the complete allowlist empty.
        If that allowlist is empty, instance-admin access is disabled and every
        authenticated caller receives 403 INSTANCE_ADMIN_REQUIRED. Counts
        are instance-wide aggregates. stored_bytes is completed blob payload
        size in all nonpurged Vaults; reserved_upload_bytes is the expected
        size of open unexpired upload reservations; vault_quota_bytes sums
        quotas of active and deleting Vaults. In the restricted PostgreSQL
        runtime, the counts come from one repeatable-read PG snapshot and the
        current session, account, device and administrator allowlist are
        rechecked in that transaction. Relay routes are unavailable in that
        runtime, so the overview reports Relay disabled with empty CIDR and
        port lists; max_connections_per_user remains the configured limit.
        SQLite mode reports the effective durable Relay selection after
        deployment-limit intersection. This response contains no Vault names,
        usernames, record contents, SSH data, ciphertext, or client payloads.
        This endpoint is read-only; quota changes are exposed separately.
      responses:
        '200':
          description: Aggregate instance counters and effective Relay policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOverview'}
        '401': {description: AUTH_REQUIRED for missing, invalid, expired, or revoked session}
        '403': {description: INSTANCE_ADMIN_REQUIRED for authenticated caller outside the allowlist}
  /admin/push-health:
    get:
      summary: Read aggregate mobile push provider, queue, and delivery health
      description: >-
        Implemented for SQLite and restricted PostgreSQL. Requires the
        caller's current active authenticated session and current
        instance-admin allowlist. Returns exactly the fixed provider rows
        apns and fcm_v1. configured means only that this responding process
        loaded that provider adapter; it does not report provider connectivity
        or worker liveness. registered_endpoints counts all currently stored
        endpoint registrations for each provider, including registrations
        whose account or device is inactive. Queue counts include every
        stored endpoint/outbox relationship regardless of account/device
        status and local adapter configuration. due counts unfinished,
        non-dead-letter rows whose next_attempt_at is no later than the
        database snapshot time and whose lease is absent or expired; an
        expired lease is therefore due. leased counts unfinished,
        non-dead-letter rows with an active lease. retry_waiting counts
        unfinished, non-dead-letter rows scheduled after the snapshot time.
        dead_lettered counts unfinished rows marked dead-lettered. generated_at
        and all scheduling/lease comparisons use the same database clock
        sample. delivery_window covers the seven UTC calendar dates ending on
        generated_at's UTC date, including the current partial date. Each
        delivery_results object counts provider adapter results persisted by
        all nodes for those dates; accepted means the adapter returned success,
        not device receipt or synchronization. Daily buckets older than 30
        days are pruned on delivery. The response contains aggregate counts
        only and never exposes identifiers, provider tokens, payloads,
        provider errors, response bodies, or provider project details. This
        endpoint is read-only and does not indicate provider connectivity or
        change delivery behavior.
      x-implementation-status: implemented
      responses:
        '200':
          description: Fixed provider-level registration, queue, and rolling UTC-day result snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPushHealth'}
        '401': {description: AUTH_REQUIRED for missing, invalid, expired, or revoked session}
        '403': {description: INSTANCE_ADMIN_REQUIRED for authenticated caller outside the allowlist}
  /admin/metrics:
    get:
      summary: Read privacy-safe Prometheus instance aggregates
      description: >-
        Accepts either the caller's current active authenticated session and
        current instance-admin allowlist, or the dedicated high-entropy
        Prometheus scrape credential configured by an administrator. That
        credential is accepted only by this GET endpoint. Returns Prometheus
        text exposition format 0.0.4 with fixed low-cardinality aggregate
        gauges and one process-local mobile push result counter. Labels are
        restricted to fixed account lifecycle, Vault lifecycle, object-delete
        queue states (pending, retry_wait, or quarantined), and the six
        provider/outcome pairs for atermius_mobile_push_send_results_total
        (provider apns or fcm_v1; outcome accepted, invalid_token, or
        retryable_failure). The push counter records results returned by the
        provider adapter in this serving process, resets on process restart,
        and remains local to each PostgreSQL serving node; Prometheus can
        aggregate separately scraped targets. accepted means the adapter
        returned success and does not prove device receipt or sync. Retryable
        failures combine retryable provider responses and send timeouts; raw
        provider errors are never exported. The object-delete gauge counts durable rows without
        exposing queue IDs, storage IDs, storage keys, or Vault identifiers.
        atermius_backup_last_success_timestamp_seconds is an unlabeled Unix
        timestamp for the last locally recorded successful encrypted archive
        creation; zero means this data directory has no recorded local
        success. It does not prove off-host replication or restore
        verification, and a restored data directory starts at zero because
        the private status sidecar is not archived. The endpoint never emits
        account, device, Vault, host, request, or other caller-controlled
        labels or identifiers. The response is not cached.
      responses:
        '200':
          description: Prometheus text exposition containing fixed aggregate gauges and a process-local provider result counter
          content:
            text/plain; version=0.0.4:
              schema: {type: string}
        '401': {description: AUTH_REQUIRED for missing, invalid, expired, or revoked session}
        '403': {description: INSTANCE_ADMIN_REQUIRED for authenticated caller outside the allowlist}
  /admin/metrics-credential:
    get:
      summary: Read dedicated Prometheus scrape credential status
      description: >-
        Requires the caller's current active authenticated session and current
        instance-admin allowlist. Returns only whether a credential is active
        and its last creation or rotation time; it never returns the secret or
        stored keyed verifier. The credential itself is accepted only by
        GET /api/v1/admin/metrics.
      responses:
        '200':
          description: Credential status without secret material
          content:
            application/json:
              schema:
                type: object
                required: [active, updated_at]
                properties:
                  active: {type: boolean}
                  updated_at: {type: [string, 'null'], format: date-time}
        '401': {description: AUTH_REQUIRED for missing, invalid, expired, or revoked session}
        '403': {description: INSTANCE_ADMIN_REQUIRED for authenticated caller outside the allowlist}
    post:
      summary: Create or rotate the Prometheus scrape credential
      description: >-
        Requires the caller's current active authenticated session and current
        instance-admin allowlist. Creates a new 256-bit credential or rotates
        the existing one atomically, immediately invalidating the prior value.
        The secret is returned exactly once in this response; only a keyed
        HMAC-SHA-256 verifier is stored. No request body is accepted. Audit
        events contain only the administrator and action metadata.
      responses:
        '200':
          description: Newly generated credential shown once
          content:
            application/json:
              schema:
                type: object
                required: [credential, created_at]
                properties:
                  credential: {type: string, pattern: '^atm_[A-Za-z0-9_-]{43}$'}
                  created_at: {type: string, format: date-time}
        '401': {description: AUTH_REQUIRED for missing, invalid, expired, or revoked session}
        '403': {description: INSTANCE_ADMIN_REQUIRED for authenticated caller outside the allowlist}
        '400': {description: INVALID_REQUEST when a non-empty request body is supplied}
    delete:
      summary: Revoke the Prometheus scrape credential
      description: >-
        Requires the caller's current active authenticated session and current
        instance-admin allowlist. Revocation immediately disables the
        credential. Repeating the operation is an idempotent success. No
        request body is accepted.
      responses:
        '200':
          description: Credential revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean, const: true}
        '401': {description: AUTH_REQUIRED for missing, invalid, expired, or revoked session}
        '403': {description: INSTANCE_ADMIN_REQUIRED for authenticated caller outside the allowlist}
        '400': {description: INVALID_REQUEST when a non-empty request body is supplied}
  /admin/relay-policy:
    get:
      summary: Read the durable administrator-selected SSH Relay policy
      description: >-
        Requires the caller's current active authenticated session and the
        current instance-admin allowlist. The selected policy is durably
        versioned; deployment limits are read-only environment-derived upper
        bounds. A new PUT selection must use canonical CIDRs wholly contained
        by configured deployment CIDRs and exact ports from the deployment
        list. A previously stored selection can remain visible if the operator
        later narrows those limits; authorization intersects it with the
        current limits. Relay is effective only
        while the immutable deployment gate (enabled flag, public origin, and
        valid non-empty allowlists) is available. A previously saved enabled
        selection remains stored while that gate is unavailable, but cannot
        issue tickets or keep an active connection alive. Deployment limits
        may also be tightened independently after a policy is saved; the saved
        selection remains visible, while ticket issuance and active connections
        use only its intersection with the current limits. The overview reports
        effective policy. When no policy row exists, this response reports
        revision 0 and the current deployment flag and allowlists as the
        default without writing a row.
      responses:
        '200':
          description: Persisted policy, immutable deployment limits, and revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayPolicy'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
    put:
      summary: Replace the durable administrator-selected SSH Relay policy
      description: >-
        Requires the caller's current active authenticated session and the
        current instance-admin allowlist. The exact request body carries the
        revision observed by the caller. A changed update increments revision,
        writes an instance audit event atomically, and invalidates every unused
        Relay ticket. An unchanged update is idempotent and creates no audit
        event. Existing Relay sessions recheck the updated policy during their
        authorization polling and close if disabled or outside the new target
        allowlist. This endpoint cannot widen deployment CIDR or port limits.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayPolicyRequest'}
      responses:
        '200':
          description: Persisted policy, immutable deployment limits, and revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayPolicy'}
        '400': {description: 'INVALID_RELAY_POLICY_REQUEST for malformed, duplicate, noncanonical, or out-of-range fields'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '409': {description: RELAY_POLICY_CONFLICT when expected_revision is stale}
        '422': {description: 'RELAY_POLICY_UNAVAILABLE when the deployment gate is incomplete, or RELAY_POLICY_OUTSIDE_LIMITS when a selected target exceeds its immutable ceiling'}
  /admin/relay-policy/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        description: Account UUID selected by an authenticated instance administrator; ticket requests cannot select their authorization identity.
        schema: {type: string, format: uuid}
    get:
      summary: Read an account's SSH Relay policy
      description: >-
        Requires the caller's current active authenticated session and the
        current instance-admin allowlist. If no account policy row exists,
        the account inherits the current instance policy. `effective_policy`
        is the intersection of deployment, instance, and account policy. The
        revision is a monotonic compare-and-set generation; after a reset it
        remains nonzero while the policy row is absent and `inherited` is true.
      responses:
        '200':
          description: Account policy override, effective intersection, and CAS revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayUserPolicy'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_USER_NOT_FOUND}
    put:
      summary: Set an account's SSH Relay policy restriction
      description: >-
        Requires the caller's current active authenticated session and the
        current instance-admin allowlist. A changed update must carry the
        current account-policy revision and current instance-policy revision.
        Both revisions are checked inside the write transaction, so a policy
        change racing the request returns a conflict before account state,
        audit records, or tickets are changed. A changed update can only narrow
        the effective instance CIDR/port policy, writes an HMAC-resource instance audit event,
        and revokes the target account's unused tickets atomically. Unchanged
        updates are idempotent. Active sockets recheck this account policy
        during the existing authorization polling and close when no longer
        allowed. A ticket's authorization identity always comes from its live
        bearer session, never from a request-supplied user ID.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayUserPolicyRequest'}
      responses:
        '200':
          description: Account policy override, effective intersection, and CAS revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayUserPolicy'}
        '400': {description: INVALID_RELAY_USER_POLICY_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_USER_NOT_FOUND}
        '409': {description: RELAY_USER_POLICY_CONFLICT when expected_revision or expected_instance_policy_revision is stale}
        '422': {description: RELAY_USER_POLICY_UNAVAILABLE or RELAY_USER_POLICY_OUTSIDE_LIMITS}
    delete:
      summary: Clear an account's SSH Relay policy override
      description: >-
        Requires the caller's current active authenticated session and the
        current instance-admin allowlist. The request body must carry the
        account-policy revision observed by the caller. Clearing deletes the
        override row so the account inherits the current instance policy and
        follows later instance policy changes. A separate revision watermark
        increments on reset, so stale requests cannot pass through a delete
        and recreate cycle. A changed reset writes an
        HMAC-resource instance audit event and revokes the target account's
        unused tickets atomically. Resetting a policy that is already inherited
        is idempotent and creates no audit event. Active sockets continue only
        when the inherited effective policy still allows their fixed target.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayUserPolicyResetRequest'}
      responses:
        '200':
          description: Inherited account policy, effective intersection, and CAS revisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayUserPolicy'}
        '400': {description: INVALID_RELAY_USER_POLICY_RESET_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_USER_NOT_FOUND}
        '409': {description: RELAY_USER_POLICY_CONFLICT when expected_revision is stale}
  /admin/relay-groups:
    get:
      summary: List server-managed SSH Relay access groups
      description: >-
        Requires the caller's current active authenticated session and the
        current instance-admin allowlist. These administrative groups are
        server-owned access-control metadata, separate from encrypted,
        client-owned Vault workspace/group records. Each group's name,
        membership set and Relay policy have independent CAS revisions.
      responses:
        '200':
          description: Bounded access-group summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupList'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
    post:
      summary: Create a server-managed SSH Relay access group
      description: >-
        Creates an empty group with name revision 1, membership revision 0 and
        inherited Relay policy revision 0. Names are trimmed and normalized
        with Unicode NFKC, contain 1 to 80 Unicode code points and no more than
        320 UTF-8 bytes, and reject control characters. The derived unique
        name key applies Unicode lowercase after NFKC; this is not full Unicode
        case folding. A changed create is audited in the same transaction.
        No client-owned encrypted Vault group is read or modified.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayGroupCreateRequest'}
      responses:
        '201':
          description: Created group detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupDetail'}
        '400': {description: INVALID_RELAY_GROUP_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '409': {description: RELAY_GROUP_NAME_TAKEN}
        '503': {description: RELAY_GROUP_CAPACITY_REACHED}
  /admin/relay-groups/{group_id}:
    parameters:
      - name: group_id
        in: path
        required: true
        description: Server-managed Relay group UUID; this is not a client-owned Vault group ID.
        schema: {type: string, format: uuid}
    get:
      summary: Read a server-managed SSH Relay access group
      responses:
        '200':
          description: Group metadata, current members and inherited/effective policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupDetail'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
    put:
      summary: Rename a server-managed SSH Relay access group
      description: >-
        Uses the group's independent name revision. A no-op is idempotent and
        does not write audit metadata or alter membership/policy revisions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayGroupRenameRequest'}
      responses:
        '200':
          description: Updated group detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupDetail'}
        '400': {description: INVALID_RELAY_GROUP_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
        '409': {description: RELAY_GROUP_CONFLICT for stale name revision; RELAY_GROUP_NAME_TAKEN for duplicate normalized name key}
    delete:
      summary: Delete a server-managed SSH Relay access group
      description: >-
        Requires a JSON body carrying current name, membership and policy
        revisions, so a deletion from a stale detail view cannot silently
        discard concurrent administration changes. The
        physical delete cascades group metadata and policy rows. It advances
        authorization revisions for every former member, removes their unused
        Relay tickets, and closes their existing Relay sockets on the next
        authorization poll. One audit event identifies only the HMAC-scoped
        group resource and actor; it omits group names and member identifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayGroupDeleteRequest'}
      responses:
        '204': {description: Group deleted}
        '400': {description: INVALID_RELAY_GROUP_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
        '409': {description: RELAY_GROUP_CONFLICT, RELAY_GROUP_MEMBERSHIP_CONFLICT or RELAY_GROUP_POLICY_CONFLICT when any supplied revision is stale}
  /admin/relay-groups/{group_id}/members:
    parameters:
      - name: group_id
        in: path
        required: true
        description: Server-managed Relay group UUID.
        schema: {type: string, format: uuid}
    put:
      summary: Replace the members of a server-managed SSH Relay access group
      description: >-
        Performs a full-set compare-and-set over active account UUIDs. The
        membership revision is independent of group-name and policy revisions.
        Duplicate, unknown, inactive-new, malformed, or over-limit account
        IDs are rejected. Existing disabled members can be retained unchanged
        or removed. A changed membership set advances per-account Relay
        authorization revisions for the union of old and new members, removes
        their unused tickets, and closes existing Relay sockets within the
        authorization polling interval. The audit event includes no member
        identifiers or usernames. Membership changes never read or modify
        client-owned encrypted Vault groups.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayGroupMembersRequest'}
      responses:
        '200':
          description: Updated group detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupDetail'}
        '400': {description: INVALID_RELAY_GROUP_MEMBERS_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
        '409': {description: RELAY_GROUP_MEMBERSHIP_CONFLICT for stale membership revision}
  /admin/relay-groups/{group_id}/relay-policy:
    parameters:
      - name: group_id
        in: path
        required: true
        description: Server-managed Relay group UUID.
        schema: {type: string, format: uuid}
    get:
      summary: Read a group's SSH Relay policy
      description: >-
        A missing override means inheritance from the current instance policy.
        A group assigned to a user narrows that user's policy; when multiple
        groups apply, enabled flags are ANDed and allowed CIDR networks and
        ports are intersected. The resulting policy is also intersected with
        any per-user administrator restriction and current deployment limits.
      responses:
        '200':
          description: Group policy selection and effective intersection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupPolicy'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
    put:
      summary: Set a group's SSH Relay restriction
      description: >-
        Both group-policy and instance-policy revisions are checked in one
        write transaction. A successful change advances the policy watermark,
        removes unused tickets and advances active authorization revisions for
        all current group members. Group policy can only narrow current
        instance effective CIDR and exact-port limits. No-op requests do not
        increment revisions or emit audit events.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayGroupPolicyRequest'}
      responses:
        '200':
          description: Updated group detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupDetail'}
        '400': {description: INVALID_RELAY_GROUP_POLICY_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
        '409': {description: RELAY_GROUP_POLICY_CONFLICT for stale group or instance policy revision}
        '422': {description: RELAY_GROUP_POLICY_UNAVAILABLE or RELAY_GROUP_POLICY_OUTSIDE_LIMITS}
    delete:
      summary: Reset a group's SSH Relay policy to inheritance
      description: >-
        Accepts the current group-policy revision, deletes the override row, and
        increments its independent policy watermark. Changed resets advance
        current members' authorization revisions, revoke their unused tickets,
        close their existing Relay sockets on the next poll, and write one
        privacy-scoped audit event. Reset while already inherited is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRelayGroupPolicyResetRequest'}
      responses:
        '200':
          description: Inherited group policy detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRelayGroupDetail'}
        '400': {description: INVALID_RELAY_GROUP_POLICY_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: RELAY_GROUP_NOT_FOUND}
        '409': {description: RELAY_GROUP_POLICY_CONFLICT for stale group policy revision}
  /admin/backup-status:
    get:
      summary: Read the latest server-recorded backup attempt status
      description: >-
        Requires the caller's current active authenticated session and a
        normalized account username in ATERMIUS_ADMIN_USERNAMES. SQLite reports
        the latest `backup` CLI or allowlisted admin-job attempt recorded on
        this data directory. PostgreSQL reports the latest terminal encrypted
        backup job from its shared instance-admin ledger, so every configured
        node reads the same attempt. A missing or node-inaccessible archive
        leaves its size unknown; success does not prove the archive still
        exists or can be restored. `verify-backup` does not change this status.
        No archive or key paths, keys, runtime policy values, or failure
        details are returned.
      responses:
        '200':
          description: Latest terminal backup attempt, or null when none has been recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBackupStatus'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
  /admin/backup-replication:
    get:
      summary: Read encrypted backup replication status
      description: >-
        Requires the current active authenticated session and the instance-admin
        allowlist. Reports only whether the server-only replica target currently
        validates, the count of nonterminal copies waiting or running, and the
        latest fixed-category attempt. It never returns the endpoint, bucket,
        key prefix, credentials file path or contents, object key, provider
        response, or raw SDK error. Restore sources from the replica are
        listed only after a completed encrypted archive copy.
      responses:
        '200':
          description: Safe replication status and latest attempt metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBackupReplicationStatus'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
  /admin/backup-replication/preflight:
    post:
      summary: Check configured replica bucket access
      description: >-
        Requires the current active authenticated session and the instance-admin
        allowlist. Accepts only an empty JSON object and uses the bucket,
        endpoint, region, and credentials configured on this server. Performs a
        bounded HeadBucket request and returns only a fixed pass result; provider
        responses and target settings are never included. A passing check verifies
        bucket access only and does not prove object upload, multipart, restore,
        or broader provider compatibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminBackupReplicationPreflightRequest'}
      responses:
        '200':
          description: Configured bucket access was verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBackupReplicationPreflightStatus'}
        '400': {description: INVALID_BACKUP_REPLICATION_PREFLIGHT_REQUEST}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '502': {description: BACKUP_REPLICATION_CHECK_FAILED}
        '503': {description: BACKUP_REPLICATION_NOT_CONFIGURED}
  /admin/backup-schedule:
    get:
      summary: Read the durable encrypted-backup schedule
      description: >-
        Requires the caller's current active authenticated session and the
        instance-admin allowlist. The schedule stores only an interval, due
        time, and fixed run metadata; archive and key paths remain private
        server configuration. `backup_configured` reports whether the server
        can currently create encrypted backups, including compatible PG tools
        on the PostgreSQL runtime; `interval_hours` being non-null
        indicates that a schedule is enabled. Enabling without valid backup
        paths is rejected. A due run is claimed durably before archive
        creation. PostgreSQL stores scheduled work in the shared instance-admin
        ledger and uses database leases to mark abandoned work interrupted
        without replay. SQLite uses its durable scheduled-run ledger and
        restart recovery.
      responses:
        '200':
          description: Current schedule and latest durable scheduled run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBackupSchedule'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
    put:
      summary: Enable, change, or disable the encrypted-backup schedule
      description: >-
        Requires the caller's current active authenticated session and the
        instance-admin allowlist. `interval_hours` must be an integer from 1
        through 720, or null to disable scheduling. Enabling requires valid
        private server archive and key configuration and, on PostgreSQL, a
        compatible `pg_dump`/`pg_restore` toolchain; paths and key material
        are never accepted from or returned to the caller. Updates serialize
        with backup creation and maintenance through a PostgreSQL schedule-row
        lock plus the shared active-job fence, or SQLite's shared operation lock.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminBackupScheduleRequest'}
      responses:
        '200':
          description: Persisted schedule after the requested update
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminBackupSchedule'}
        '400': {description: INVALID_BACKUP_SCHEDULE_REQUEST or INVALID_BACKUP_INTERVAL}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '503': {description: BACKUP_NOT_CONFIGURED}
  /admin/restore-sources:
    get:
      summary: List restorable server-generated archives
      description: >-
        Requires the active instance-admin allowlist. Returns bounded safe
        metadata for available manual and scheduled server-generated archives
        from local storage or a completed replica. It never exposes archive
        filenames, paths, key material, or operator-created CLI archives.
        Replica bytes are fetched only through the fixed server-configured
        target and deterministic key after the restore worker acquires the
        shared maintenance lock.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Paged safe archive metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRestoreSourcePage'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '503': {description: BACKUP_NOT_CONFIGURED}
  /admin/restore-stages/{restore_job_id}/discard:
    post:
      summary: Discard a completed isolated restore stage
      description: >-
        Requires the active instance-admin allowlist and the authenticated
        user that created the completed restore job. The request accepts only
        a canonical request_id; stage paths are derived by the server. Under
        the shared maintenance lock, the server verifies the durable restore
        job and private receipt, removes only that job's isolated stage files,
        fsyncs the staging directory, then atomically records the discarded
        lifecycle state and the `admin.restore_stage_discarded` audit event.
        Repeated calls return the original path-free receipt without a
        duplicate event. `request_id` must be a canonical lowercase UUID but
        idempotency is bound to the durable restore-job lifecycle; retries may
        reuse or replace that request_id. This never changes live data or
        removes the source archive.
      parameters:
        - name: restore_job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminRestoreStageDiscardRequest'}
      responses:
        '200':
          description: Fixed path-free completed discard receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRestoreStageDiscardResponse'}
        '400': {description: INVALID_RESTORE_JOB_ID, INVALID_RESTORE_STAGE_DISCARD_REQUEST, or INVALID_REQUEST_ID}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '404': {description: NOT_FOUND for a missing, non-restore, or non-owned restore job}
        '409': {description: RESTORE_STAGE_NOT_READY, RESTORE_STAGE_UNAVAILABLE, or MAINTENANCE_ALREADY_RUNNING}
        '500': {description: RESTORE_STAGE_DISCARD_FAILED; retry the request after filesystem failure}
        '503': {description: BACKUP_NOT_CONFIGURED}
  /admin/jobs:
    get:
      summary: List bounded instance-admin background jobs
      description: >-
        Returns durable metadata for fixed server-side administrative jobs.
        Supported actions are reported as runtime capabilities. SQLite exposes
        maintenance, encrypted backup, restore, status, replication, schedule,
        and stage discard; replica restore is advertised only when configured.
        PostgreSQL advertises backup when its archive path, key, schema and
        tools are ready, and restore only when a distinct empty target is
        ready. It does not currently advertise local backup status,
        replication, scheduling, replica restore, or stage discard. The
        response never includes internal
        errors, filesystem paths, or client data. For a successful restore job,
        the original creator sees its isolated
        stage lifecycle: ready, failed, interrupted, discarding, discarded,
        or unverified. The
        unverified state covers legacy jobs without a lifecycle row and can
        be discarded only after the API revalidates its complete receipt and
        staged contents. The owner can retry a discarding stage after startup
        reconciliation was deferred. Other instance admins and non-succeeded
        jobs receive null.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Paged instance-admin job metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminJobPage'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
    post:
      summary: Queue a fixed maintenance, backup, or isolated restore job
      description: >-
        Persists a fixed job and returns HTTP 202. Only one job across all
        supported actions may be queued or running. Replaying the same
        request_id as the same requester returns the original job.
        Maintenance runs the fixed retention and expired-object cleanup pass.
        Backup requires ATERMIUS_BACKUP_ARCHIVE_DIR to name an existing
        service-owned mode-0700 directory outside ATERMIUS_DATA_DIR and
        ATERMIUS_BACKUP_KEY_FILE to name a service-owner-only 32-byte key file
        outside ATERMIUS_DATA_DIR; missing or invalid settings return
        503 BACKUP_NOT_CONFIGURED. The worker revalidates after acquiring the
        shared maintenance/backup interprocess lock, then generates an
        encrypted archive name under the configured directory. Requests, job
        rows, audit events, backup-status, or replication metadata never contain paths,
        basenames, keys, or internal filesystem errors. Callers cannot supply
        commands, paths, keys, SQL, or cleanup parameters. Archive retention is
        managed by the operator. In PostgreSQL mode, encrypted backup and
        local-archive restore are available only when their advertised
        capabilities are ready; restore additionally requires a distinct
        empty database configured by ATERMIUS_PG_RESTORE_TARGET_URL. PostgreSQL
        does not accept replica restore sources. SQLite restore accepts only
        an archive_id and archive_source pair from the restore-sources catalog.
        Replica requests
        cannot provide an endpoint, bucket, key, or path. Local candidates are
        revalidated before acceptance. Replica acceptance checks only the
        successful local outbox record and server configuration; the worker
        rechecks the remote object under the maintenance lock. A remote object
        removed or changed around submission may therefore make an accepted
        job finish with the fixed restore_failed result, without remote error
        details. The worker prepares a separate directory below the
        private configured archive directory while the live instance continues
        serving. The live database records the restore job and its audit events;
        account, Vault, session, and generation data are not changed. The
        existing offline CLI restore continues to
        require --server-stopped. The Web action never activates or replaces
        ATERMIUS_DATA_DIR; operators perform the later stop, environment/volume
        cutover, restart, and post-restore checks using the runbook. Runtime
        policy drift is rejected by this action and must be reviewed through
        the offline CLI workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminJobRequest'}
      responses:
        '202':
          description: Existing idempotent job or newly queued fixed job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminJobReceipt'}
        '400': {description: INVALID_JOB_REQUEST or INVALID_REQUEST_ID}
        '401': {description: AUTH_REQUIRED}
        '403': {description: INSTANCE_ADMIN_REQUIRED}
        '409': {description: 'JOB_REQUEST_ID_CONFLICT, MAINTENANCE_ALREADY_RUNNING, or RESTORE_SOURCE_UNAVAILABLE'}
        '503': {description: BACKUP_NOT_CONFIGURED when backup settings are missing or invalid, or PG_ADMIN_ACTION_UNSUPPORTED for backup/restore in restricted PostgreSQL mode}
