        host_attachment_manifest_versions,max_attachment_bytes}`. The account
        and device IDs must identify the current authenticated account/device.
        Revisions are positive and strictly increase. An exact same-revision
        retry is idempotent; a lower revision or changed same-revision report
        returns DEVICE_CAPABILITY_REVISION_CONFLICT. A device in any active
        schema-2 vault cannot publish a report that drops v2 or 1 GiB support.
        A missing/v1 transport marker cannot publish or restore a report asserting complete v2 support; it returns 409 VAULT_CLIENT_CAPABILITY_REQUIRED.
