        operation_id: {type: string, format: uuid}
        current_login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier; never a password}
        recovery_generation: {type: integer, minimum: 1}
        recovery_public_signing_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        recovery_public_encryption_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        recovery_envelope: {$ref: '#/components/schemas/RecoveryOpaqueEnvelope'}
        recovery_identity_envelope: {$ref: '#/components/schemas/RecoveryOpaqueEnvelope'}
        key_envelopes:
