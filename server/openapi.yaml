openapi: 3.1.0
info:
  title: Atermius Self-Hosted API
  version: 1.0.0
  description: >-
    Ciphertext-only account, vault sync, object storage, and optional SSH relay API.
    Vault-scoped routes use the same generic 404 for unknown vault IDs and IDs without caller membership.
    Every bearer-authenticated HTTP request sends exactly one X-Atermius-Capability-Marker: v1 or v2.
    Missing, duplicate, malformed, or unknown markers are treated as v1. The marker is an unsigned current-client
    read hint only; schema-2 writes still require a current signed device capability report. When a device next
    contacts the server with a missing/v1 marker, a stored report asserting complete v2 support is atomically
    revoked. Offline rollback cannot be detected before contact. If schema-2 data exists, v1 readers receive
    409 VAULT_CLIENT_CAPABILITY_REQUIRED on envelope-bearing routes. Browser CORS is disabled without
    ATERMIUS_PUBLIC_ORIGIN; when configured, only that exact origin is allowed. The redaction marker is included
    in the CORS preflight allowlist. A device that has published a redaction-capability report must continue
    sending exactly one X-Atermius-Redaction-Marker (value v1) on every authenticated request; a missing, duplicate,
    malformed, or unknown marker invalidates the stored report while retaining its revision floor. A signed
    redaction-capability report is only a support declaration; it does not prove that clients applied a
    redaction. SQLite and restricted PostgreSQL expose an owner-only, retention-gated record purge endpoint that
    independently verifies every active Vault device report and emits a signed redaction proof. Owners can also
    persist default-off automatic-purge consent for an exact tombstone; no automatic purge worker or scheduler runs.
    Unreferenced object bytes use the existing delayed object collector.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /instance:
    get:
      summary: Instance identity and enabled capabilities
      description: Returns persistent instance/server-space IDs, generation, current Ed25519 signing public key, ordered old-key-signed transition chain, and effective record restore window. `restore_retention_days` is the tombstone restore window (default 30, configured with ATERMIUS_RECORD_RESTORE_RETENTION_DAYS); `capabilities` and `limits` describe server support only and never substitute for signed per-device reports. The first key is trust-on-first-use; clients must verify the complete transition chain from a pinned key when the key changes. notifications is present only if ATERMIUS_PUBLIC_ORIGIN is configured; terminal_collaboration is present only when ATERMIUS_TERMINAL_COLLABORATION_ENABLED=true and ATERMIUS_PUBLIC_ORIGIN is configured; the origin is not returned.
      security: []
      responses:
        '200':
          description: Public instance identity, current signing key, and rotation proofs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InstanceInfo'}
  /auth/prelogin:
    post:
      summary: Return account KDF parameters or a stable decoy
      description: Unknown users receive username-bound decoy account and KDF values. Requests are rate limited with HTTP 429 and Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320, description: Trimmed and lowercased before validation; the normalized UTF-8 encoding is limited to 320 bytes. maxLength counts Unicode characters and does not enforce this byte limit by itself.}
      responses: {'200': {description: KDF details or shape-compatible decoy}, '429': {description: Rate limited; Retry-After is seconds to reset}}
  /auth/register:
    post:
      summary: Create an account using the initial bootstrap or an operator-issued account invitation
      description: The first account supplies bootstrap_token; later accounts supply instance_invitation_token bound to the normalized username. The invitation enrolls only the account and personal vault and does not grant membership in another vault. The initial top-level name_envelope must have the bounded v1 display envelope shape; new clients include the identical value at initial_vault.membership.manifest.display_name_envelope so it is owner-signed. Older initial manifests may omit that inner field.
      security: []
      x-operator-invitation-command: "atermius-server create-account-invite --username <email> [--expires-in-seconds N]"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, username, kdf, login_verifier, account_key_envelope, device, initial_vault]
              properties:
                bootstrap_token: {type: string, description: One-time initial setup credential}
                instance_invitation_token: {type: string, description: One-time username-bound account enrollment credential}
                username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320, description: Trimmed and lowercased before validation; the normalized UTF-8 encoding is limited to 320 bytes. maxLength counts Unicode characters and does not enforce this byte limit by itself.}
                account_id: {type: string, format: uuid}
                kdf:
                  type: object
                  required: [id, salt, mem_kib, iterations, parallelism, version]
                  properties:
                    id: {type: string, const: argon2id13}
                    salt: {type: string}
                    mem_kib: {type: integer}
                    iterations: {type: integer}
                    parallelism: {type: integer}
                    version: {type: integer}
                login_verifier: {type: string, description: Client-derived login verifier; never a master password}
                account_key_envelope: {type: object, description: Opaque encrypted account-key envelope}
                device:
                  type: object
                  required: [device_id, signing_public_key, encryption_public_key, signature]
                  properties:
                    device_id: {type: string, format: uuid}
                    name: {type: string, default: device}
                    signing_public_key: {type: string}
                    encryption_public_key: {type: string}
                    signature: {type: string}
                initial_vault:
                  type: object
                  required: [vault_id, name_envelope, key_epoch, membership_version, key_envelope, membership]
                  properties:
                    vault_id: {type: string, format: uuid}
                    name_envelope: {type: object}
                    key_epoch: {type: integer, minimum: 1}
                    membership_version: {type: integer, minimum: 1}
                    key_envelope: {type: object}
                    membership: {type: object}
              oneOf:
                - required: [bootstrap_token]
                - required: [instance_invitation_token]
      responses:
        '200': {description: Session and personal vault}
        '401': {description: Invalid bootstrap or account invitation}
        '403': {description: Later account registration requires an operator invitation}
        '429': {description: Rate limited; Retry-After is seconds to reset}
  /auth/login:
    post:
      summary: Start a device session
      description: Unknown usernames and non-active accounts perform a dummy Argon2 verifier check and return the same AUTH_REQUIRED response as a wrong verifier. Attributable failures for a known account are best-effort audited with account-HMAC scope and null unverified actor/resource IDs; unknown and non-active accounts are not audited. Successful login audit is committed with session creation. Login attempts remain rate limited with HTTP 429 and Retry-After.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, login_verifier, device_id]
              properties:
                username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320, description: Trimmed and lowercased before validation; the normalized UTF-8 encoding is limited to 320 bytes. maxLength counts Unicode characters and does not enforce this byte limit by itself.}
                login_verifier: {type: string, description: Client-derived verifier; never a master password}
                device_id: {type: string, format: uuid}
      responses:
        '200':
          description: Password-only session DTO (unchanged for accounts without MFA)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '202':
          description: Password verified; a short-lived single-use MFA challenge is required before a session is issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaLoginChallenge'}
        '401': {description: Invalid username, verifier, account, or device}
        '429': {description: Password login rate limited or too many outstanding MFA challenges; Retry-After is seconds to reset}
  /auth/login/mfa:
    post:
      summary: Complete a password-verified MFA login challenge
      description: The challenge is single-use, expires after five minutes, is bound to the account, registered device and credential version, and permits at most five factor attempts. Challenge consumption, replay-safe TOTP step or recovery-code consumption, session creation and success audit share one transaction. Invalid/replayed/expired challenges and invalid factors return generic AUTH_REQUIRED (401); denied rate-limit attempts persist their counters before returning 429. A TOTP attempt needs ATERMIUS_MFA_ENCRYPTION_KEY_FILE; if unavailable it returns MFA_KEY_UNAVAILABLE (503) without consuming the challenge, so an unused recovery code can still complete login. The password step never issues tokens while MFA is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge_id]
              properties:
                challenge_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
                totp_code: {type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$'}
                recovery_code: {type: string, minLength: 19, maxLength: 32, pattern: '^[A-Za-z2-7-]+$'}
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [challenge_id, totp_code]
                  properties:
                    challenge_id: {type: string, format: uuid}
                    totp_code: {type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$'}
                - type: object
                  additionalProperties: false
                  required: [challenge_id, recovery_code]
                  properties:
                    challenge_id: {type: string, format: uuid}
                    recovery_code: {type: string, minLength: 19, maxLength: 32, pattern: '^[A-Za-z2-7-]+$'}
      responses:
        '200':
          description: Session DTO issued only after successful second factor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthSession'}
        '401': {description: Generic AUTH_REQUIRED for invalid/replayed factor, challenge, credential version or device}
        '429': {description: MFA login rate limited; Retry-After is seconds to reset}
        '503': {description: MFA_KEY_UNAVAILABLE for TOTP verification; recovery-code completion remains available}
  /auth/mfa:
    get:
      summary: Read the authenticated account MFA status
      responses:
        '200':
          description: MFA enabled flag and number of unused recovery codes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaStatus'}
        '401': {description: AUTH_REQUIRED}
  /auth/mfa/totp/setup:
    post:
      summary: Start TOTP enrollment after fresh login-verifier confirmation
      description: Requires an active session and current client-derived login verifier. The server returns a 20-byte random TOTP seed once, encrypted at rest with the dedicated 32-byte operator key in ATERMIUS_MFA_ENCRYPTION_KEY_FILE. The pending seed expires after ten minutes and binds to credential_version. A missing key returns MFA_KEY_UNAVAILABLE (503); an unsafe or malformed configured key fails startup.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaStepUpRequest'}
      responses:
        '200':
          description: One-time seed and standards-compatible provisioning URI; caller must retain the seed only long enough to enroll
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaTotpSetup'}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED}
        '409': {description: MFA_ALREADY_ENABLED}
        '429': {description: Rate limited; Retry-After is seconds to reset}
        '503': {description: MFA_KEY_UNAVAILABLE}
  /auth/mfa/totp/confirm:
    post:
      summary: Confirm TOTP enrollment and issue one-time recovery codes
      description: Requires a fresh login verifier and a valid, previously unused six-digit TOTP step. The seed becomes active atomically with salted HMAC-SHA-256 recovery-code hashes and one safe audit event. Ten recovery codes are returned once; each contains 80 random bits.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaConfirmRequest'}
      responses:
        '200':
          description: One-time recovery codes; copy to an offline secret store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaRecoveryCodes'}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED; invalid or replayed TOTP step}
        '409': {description: MFA_SETUP_REQUIRED, MFA_SETUP_EXPIRED, or MFA_SETUP_CHANGED}
        '429': {description: Rate limited; Retry-After is seconds to reset}
        '503': {description: MFA_KEY_UNAVAILABLE}
  /auth/mfa/recovery-codes:
    post:
      summary: Rotate one-time MFA recovery codes
      description: Requires a fresh login verifier and a valid, previously unused TOTP step. Existing unused and consumed hashes are atomically replaced; plaintext is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaConfirmRequest'}
      responses:
        '200':
          description: New one-time recovery codes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaRecoveryCodes'}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED; invalid or replayed TOTP step}
        '409': {description: MFA_NOT_ENABLED}
        '429': {description: Rate limited; Retry-After is seconds to reset}
        '503': {description: MFA_KEY_UNAVAILABLE}
  /auth/mfa/totp:
    delete:
      summary: Disable TOTP after fresh login-verifier and TOTP confirmation
      description: Requires a valid, previously unused TOTP step and current login verifier. TOTP seed, pending setup and recovery-code hashes are deleted atomically with the success audit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaConfirmRequest'}
      responses:
        '200':
          description: TOTP disabled; no recovery codes remain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MfaStatus'}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED; invalid or replayed TOTP step}
        '409': {description: MFA_NOT_ENABLED}
        '429': {description: Rate limited; Retry-After is seconds to reset}
        '503': {description: MFA_KEY_UNAVAILABLE}
  /auth/password-change:
    post:
      summary: Change the account login verifier and rewrap its account key
      description: >-
        Requires the active bearer session and client-derived current_login_verifier; never send a master password. The request uses the existing Login rate-limit bucket before Argon2 verification. A successful writer transaction updates the verifier hash, KDF parameters, and opaque version-1 account-key envelope, increments credential_version, revokes all other account sessions, preserves the calling session, stores a server-keyed request digest receipt, and writes an auth.password_changed success audit event. A rejected current verifier best-effort writes an auth.password_change_failed audit event scoped to the authenticated account, with no request secret. An exact retry of the latest successful operation in that still-active session returns already_applied=true; a changed body with that current operation ID returns IDEMPOTENCY_KEY_REUSED. Only the most recent password-change operation per session is retained. No verifier, token, or envelope is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, current_login_verifier, new_kdf, new_login_verifier, account_key_envelope]
              properties:
                operation_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
                current_login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier; never a password}
                new_login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier under new_kdf}
                new_kdf:
                  type: object
                  additionalProperties: false
                  required: [id, salt, mem_kib, iterations, parallelism, version]
                  properties:
                    id: {type: string, const: argon2id13}
                    salt: {type: string, minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$'}
                    mem_kib: {type: integer, minimum: 65536, maximum: 262144}
                    iterations: {type: integer, minimum: 3, maximum: 10}
                    parallelism: {type: integer, minimum: 1, maximum: 8}
                    version: {type: integer, const: 1}
                account_key_envelope:
                  type: object
                  additionalProperties: false
                  required: [version, nonce, ciphertext]
                  properties:
                    version: {type: integer, const: 1}
                    nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$'}
                    ciphertext: {type: string, minLength: 22, maxLength: 65536, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        '200':
          description: Password changed; response contains no secret material
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, operation_id, credential_version, session_preserved, other_sessions_revoked, already_applied]
                properties:
                  status: {type: string, const: changed}
                  operation_id: {type: string, format: uuid}
                  credential_version: {type: integer, minimum: 2}
                  session_preserved: {type: boolean, const: true}
                  other_sessions_revoked: {type: boolean, const: true}
                  already_applied: {type: boolean}
        '400': {description: INVALID_PASSWORD_CHANGE_OPERATION_ID, INVALID_CREDENTIAL, INVALID_KDF, UNSUPPORTED_KDF, or INVALID_ENVELOPE}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED}
        '409': {description: IDEMPOTENCY_KEY_REUSED}
        '429': {description: RATE_LIMITED; Retry-After is seconds until the window resets}
  /auth/recovery:
    put:
      summary: Configure or rotate client-encrypted account recovery
      description: >-
        Requires an active session, the current client-derived login verifier,
        and a device signature over the complete request with proof_signature
        omitted. The new Recovery Ed25519 key separately proves possession.
        Initial setup uses generation 1. Rotation increments generation and
        additionally requires previous_recovery_signature from the old
        Recovery key. The request may include only keyboxes available on this
        device (plus boxes re-sealed from the old descriptor during rotation);
        recovery_status is stale until all required Vault epochs have boxes.
        The server validates and stores opaque envelopes without decrypting
        them. Login rate limits are charged before verifier KDF work. The
        default limiter window is 900 seconds and is configured with
        ATERMIUS_AUTH_RATE_WINDOW_SECONDS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryConfigureRequest'}
      responses:
        '200':
          description: Configured or rotated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, operation_id, recovery_generation, recovery_status, already_applied]
                properties:
                  status: {type: string, const: configured}
                  operation_id: {type: string, format: uuid}
                  recovery_generation: {type: integer, minimum: 1}
                  recovery_status: {type: string, enum: [stale, current]}
                  already_applied: {type: boolean}
        '400': {description: Invalid operation, generation, key, envelope, or Recovery context}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED}
        '403': {description: RECOVERY_ROTATION_PROOF_REQUIRED or VAULT_KEY_UNAVAILABLE}
        '409': {description: IDEMPOTENCY_KEY_REUSED, RECOVERY_GENERATION_CONFLICT, or RECOVERY_ROTATION_INCOMPLETE}
        '429': {description: RATE_LIMITED before verifier KDF; Retry-After is seconds to reset}
    delete:
      summary: Disable client-encrypted account recovery
      description: Requires an active session and current client-derived login verifier. Charges the Login rate limit before verifier KDF work.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryDisableRequest'}
      responses:
        '200':
          description: Disabled; contains operation receipt metadata only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, operation_id, already_applied]
                properties:
                  status: {type: string, const: disabled}
                  operation_id: {type: string, format: uuid}
                  already_applied: {type: boolean}
        '401': {description: AUTH_REQUIRED or REAUTH_REQUIRED}
        '409': {description: IDEMPOTENCY_KEY_REUSED}
        '429': {description: RATE_LIMITED before verifier KDF; Retry-After is seconds to reset}
  /auth/recovery/contexts:
    get:
      summary: Read Recovery descriptor and Vault keybox coverage
      description: >-
        Requires an active session. Works while Recovery is disabled and then
        returns the last used generation (0 before the first setup), null
        identity/public-key/hash fields, no boxes, and recovery_status disabled.
        A re-enable request must use recovery_generation + 1. When enabled, returns the Recovery public
        keys and descriptor hash together with opaque identity/keybox envelopes.
        Required context entries use the highest validated signed membership
        version for each epoch. A box is not proof of validity by itself; the
        client verifies its Recovery signature before opening it.
      responses:
        '200':
          description: Descriptor and setup/rotation coverage state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryContexts'}
        '401': {description: AUTH_REQUIRED}
  /auth/recovery/key-envelopes:
    put:
      summary: Upload additional Recovery keyboxes from the current device
      description: >-
        Requires an active session. Recovery key signatures bind the account,
        server space, generation, descriptor hash, Vault and epoch, uploader
        device, and SHA-256 of decoded sealed-box ciphertext bytes. The current
        device must hold that Vault key context. An exact existing box is an
        idempotent no-op; a different box for the same Vault epoch is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryKeyEnvelopeUploadRequest'}
      responses:
        '200':
          description: Updated box count and Recovery coverage status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, operation_id, recovery_generation, recovery_status, inserted_count, already_applied]
                properties:
                  status: {type: string, const: updated}
                  operation_id: {type: string, format: uuid}
                  recovery_generation: {type: integer, minimum: 1}
                  recovery_status: {type: string, enum: [stale, current]}
                  inserted_count: {type: integer, minimum: 0}
                  already_applied: {type: boolean}
        '401': {description: AUTH_REQUIRED}
        '403': {description: VAULT_KEY_UNAVAILABLE}
        '409': {description: RECOVERY_DISABLED, RECOVERY_STALE, RECOVERY_KEYBOX_CONFLICT, or IDEMPOTENCY_KEY_REUSED}
  /auth/recovery/start:
    post:
      summary: Start a privacy-preserving account recovery challenge
      description: >-
        Anonymous and rate limited by normalized username, username/IP pair,
        and IP. Unknown, disabled, and configured accounts receive the same
        response shape. This response intentionally includes no Vault IDs or
        keybox coverage; clients must submit the challenge-bound Recovery
        signature to /auth/recovery/inspect before reading Vault contexts.
        Both real-account and NULL-owner decoy rows count toward the global
        live-challenge cap. Live rows have expires_at later than the current
        time and are unconsumed. The cap defaults to 10,000 and is configurable
        with ATERMIUS_MAX_ACTIVE_RECOVERY_CHALLENGES from 1 through 100,000;
        invalid values use the default. When full, start returns the same
        generic 429 for configured and unknown usernames, includes Retry-After
        until the earliest live expiry, and inserts no challenge row. Bounded
        expiry cleanup, the count and any insert run in one SQLite writer
        transaction.
        Recovery code plaintext is padded to 512 bytes before encryption, so
        the recovery_envelope ciphertext is exactly 528 bytes. Default
        limits per 900-second window are 6 attempts per normalized username,
        5 per username/IP pair, and 300 per IP; use
        ATERMIUS_AUTH_RECOVERY_START_USER_LIMIT,
        ATERMIUS_AUTH_RECOVERY_START_PAIR_LIMIT, and
        ATERMIUS_AUTH_RECOVERY_START_IP_LIMIT to change them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username]
              properties:
                username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320, description: Trimmed and lowercased before validation; the normalized UTF-8 encoding is limited to 320 bytes. maxLength counts Unicode characters and does not enforce this byte limit by itself.}
      responses:
        '200':
          description: Shape-compatible challenge and Recovery descriptor or decoy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryStartResponse'}
        '400': {description: Invalid username}
        '429': {description: RATE_LIMITED for authentication throttling or a full global live-challenge cap; Retry-After is seconds until the rate-limit window or earliest live challenge expiry}
  /auth/recovery/inspect:
    post:
      summary: Read required recovery contexts after proving Recovery key possession
      description: >-
        Anonymous and rate limited by RecoveryStart buckets. The request signs
        the account, instance, server space, generation, challenge ID/value,
        and descriptor hash under the old Recovery Ed25519 key. Only after
        signature and challenge verification does the server return Vault IDs
        and stored opaque keyboxes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryInspectRequest'}
      responses:
        '200':
          description: Required and present contexts; all keybox bodies remain opaque
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryInspectResponse'}
        '401': {description: RECOVERY_FAILED; challenge/signature/account failures share one response}
        '429': {description: RATE_LIMITED; Retry-After is seconds to reset}
  /auth/recovery/complete:
    post:
      summary: Complete account recovery and atomically rotate credentials and Recovery identity
      description: >-
        Anonymous and rate limited by normalized account username, username/IP
        pair, and IP. Default limits per 900-second window are 5 attempts per
        account, 4 per account/IP pair, and 120 per IP; use
        ATERMIUS_AUTH_RECOVERY_COMPLETE_USER_LIMIT,
        ATERMIUS_AUTH_RECOVERY_COMPLETE_PAIR_LIMIT, and
        ATERMIUS_AUTH_RECOVERY_COMPLETE_IP_LIMIT to change them. The old Recovery key signs the complete request excluding
        recovery_signature inside the domain wrapper
        {protocol: "atermius-account-recovery-complete-v1", request: ...}.
        The request must include every server-required Vault epoch
        in the new-device key envelopes and Recovery keyboxes. Success installs
        the new device and credentials, revokes all previous devices/sessions,
        rotates Recovery generation and stores an HMAC idempotency receipt in
        one transaction. Exact retries return that receipt after revocation;
        changed bodies under the same operation_id return IDEMPOTENCY_KEY_REUSED.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryCompleteRequest'}
      responses:
        '200':
          description: Recovery completed or exact response-loss retry
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, operation_id, credential_version, recovery_generation, device_id, already_applied]
                properties:
                  status: {type: string, const: recovered}
                  operation_id: {type: string, format: uuid}
                  credential_version: {type: integer, minimum: 2}
                  recovery_generation: {type: integer, minimum: 2}
                  device_id: {type: string, format: uuid}
                  already_applied: {type: boolean}
        '401': {description: RECOVERY_FAILED; invalid/missing challenge, identity proof, or account state}
        '409': {description: RECOVERY_STALE for changed Vault context or IDEMPOTENCY_KEY_REUSED for changed retry body}
        '429': {description: RATE_LIMITED; Retry-After is seconds to reset}
  /auth/refresh:
    post:
      summary: Rotate refresh token
      description: A valid refresh token atomically replaces both bearer credentials while preserving its session. Reuse of a previously consumed token revokes every session in that family whose revoked_at is null and returns 401 AUTH_REQUIRED when the revocation transaction commits. If that revocation changes state, the server best-effort writes one account-scoped auth.refresh_reuse_detected audit event with a random session-family ID and null actor IDs. If the audit INSERT fails but the revocation transaction still commits, the revocation remains and the response is 401; if the transaction commit fails, the response is 500 INTERNAL and the revocation outcome is unknown. Unknown, expired, or otherwise invalid tokens without a matching consumed-token history are not audited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, minLength: 1}
      responses:
        '200':
          description: Rotated bearer credentials and the stable account/device identity for the existing session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotatedSession'}
        '401': {description: AUTH_REQUIRED; invalid or previously consumed refresh token}
        '500':
          description: INTERNAL; the revocation transaction failed to commit, so the revocation outcome is unknown
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /auth/logout:
    post: {summary: Revoke current session, responses: {'200': {description: Logout result}}}
  /account/delete:
    post:
      summary: Begin the cancellable account deletion window
      description: Requires the active bearer session and client-derived login_verifier. Login rate limiting is charged before Argon2 verification. An account that owns a vault with another active or invited member is blocked. Success immediately marks the account deleting and revokes all active devices and sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_verifier]
              properties:
                login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier; never the master password}
      responses:
        '200': {description: Account lifecycle DTO with status deleting, requested_at, purge_after and can_cancel}
        '401': {description: REAUTH_REQUIRED for invalid proof or AUTH_REQUIRED when the session is not active}
        '409': {description: ACCOUNT_OWNS_SHARED_VAULT, ACCOUNT_DELETION_PENDING, or ACCOUNT_DELETION_TRANSITION_CONFLICT}
        '429': {description: RATE_LIMITED before verifier KDF; includes Retry-After}
  /account/delete/cancel:
    post:
      summary: Cancel account deletion before its purge deadline
      description: Sessionless because deletion revokes every session. The username and login_verifier are checked with the normalized-username and peer login rate limits and Argon2. Cancellation restores only devices revoked by that deletion request; sessions remain revoked and the user must log in again. Repeating after cancellation is an idempotent success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, login_verifier]
              properties:
                username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320, description: Trimmed and lowercased before validation; the normalized UTF-8 encoding is limited to 320 bytes. maxLength counts Unicode characters and does not enforce this byte limit by itself.}
                login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier; never the master password}
      responses:
        '200': {description: Active account lifecycle DTO; no session is returned}
        '401': {description: REAUTH_REQUIRED for unknown usernames or invalid verifier}
        '410': {description: ACCOUNT_DELETION_WINDOW_EXPIRED at or after the deadline}
        '429': {description: RATE_LIMITED before verifier KDF; includes Retry-After}
