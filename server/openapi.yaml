      properties:
        version: {type: integer, const: 1}
        nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$', description: Base64url-no-pad encoding of 24 nonce bytes}
        ciphertext: {type: string, minLength: 22, maxLength: 65536, pattern: '^[A-Za-z0-9_-]+$'}
    RecoverySealedBox:
