        ciphertext: {type: string, minLength: 64, maxLength: 87382, pattern: '^[A-Za-z0-9_-]+$', description: Base64url-no-pad libsodium sealed box bytes, including 48-byte crypto_box_seal overhead}
    RecoveryKeyEnvelope:
