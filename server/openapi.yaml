        and HMAC-scoped audit insert in one transaction. It uses the shared
        account lifecycle fence also used by login and refresh, so a racing
        login or refresh is either revoked by a later disable or rejected after
        a disable commits. Concurrent administrator account writes serialize
        the last-active-administrator check.
        Disabling does not erase encrypted device caches or close SSH
        connections opened directly by a client. Existing server Relay and
        notification connections recheck session state about every two
        seconds; an already-authorized request may finish before that check.
