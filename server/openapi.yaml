      required: [account_id, instance_id, server_space_id, recovery_generation, challenge_id, challenge, expires_at, recovery_public_signing_key, recovery_public_encryption_key, recovery_descriptor_hash, recovery_envelope]
      properties:
        account_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        server_space_id: {type: string, format: uuid}
        recovery_generation: {type: integer, minimum: 1}
        challenge_id: {type: string, format: uuid}
        challenge: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        expires_at: {type: string, format: date-time}
        recovery_public_signing_key: {type: string, minLength: 43, maxLength: 43}
        recovery_public_encryption_key: {type: string, minLength: 43, maxLength: 43}
        recovery_descriptor_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        recovery_envelope: {$ref: '#/components/schemas/RecoveryOpaqueEnvelope'}
    RecoveryInspectRequest:
      type: object
      additionalProperties: false
      required: [account_id, instance_id, server_space_id, recovery_generation, challenge_id, challenge, recovery_signature]
      properties:
        account_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        server_space_id: {type: string, format: uuid}
        recovery_generation: {type: integer, minimum: 1}
        challenge_id: {type: string, format: uuid}
        challenge: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        recovery_signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
    RecoveryInspectResponse:
      type: object
      additionalProperties: false
      required: [account_id, recovery_generation, recovery_descriptor_hash, required_contexts, present_contexts, recovery_status]
      properties:
        account_id: {type: string, format: uuid}
        recovery_generation: {type: integer, minimum: 1}
        recovery_descriptor_hash: {type: string, pattern: '^[0-9a-f]{64}$'}
        required_contexts:
          type: array
          items: {$ref: '#/components/schemas/RecoveryRequiredContext'}
        present_contexts:
          type: array
          items: {$ref: '#/components/schemas/RecoveryPresentContext'}
        recovery_status: {type: string, enum: [stale, current]}
    RecoveryKdf:
      type: object
      additionalProperties: false
      required: [id, salt, mem_kib, iterations, parallelism, version]
      properties:
        id: {type: string, const: argon2id13}
        salt: {type: string, minLength: 22, maxLength: 22, pattern: '^[A-Za-z0-9_-]{22}$'}
        mem_kib: {type: integer, minimum: 65536, maximum: 262144}
        iterations: {type: integer, minimum: 3, maximum: 10}
        parallelism: {type: integer, minimum: 1, maximum: 8}
        version: {type: integer, const: 1}
    RecoveryCompletionDevice:
      type: object
      additionalProperties: false
      required: [device_id, signing_public_key, encryption_public_key, signature]
      properties:
        device_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 128, default: device}
        signing_public_key: {type: string, minLength: 43, maxLength: 43}
        encryption_public_key: {type: string, minLength: 43, maxLength: 43}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
    RecoveryVaultKeyEnvelope:
      type: object
      additionalProperties: false
      required: [vault_id, recipient_device_id, key_epoch, membership_version, envelope, signature]
      properties:
        vault_id: {type: string, format: uuid}
        recipient_device_id: {type: string, format: uuid}
        key_epoch: {type: integer, minimum: 1}
        membership_version: {type: integer, minimum: 1}
        envelope: {type: object, description: Opaque Vault-key envelope signed by the new device key}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
    RecoveryNextDescriptor:
      type: object
      additionalProperties: false
      required: [recovery_public_signing_key, recovery_public_encryption_key, recovery_envelope, recovery_identity_envelope, key_envelopes, recovery_identity_proof_signature]
      properties:
        recovery_public_signing_key: {type: string, minLength: 43, maxLength: 43}
        recovery_public_encryption_key: {type: string, minLength: 43, maxLength: 43}
        recovery_envelope: {$ref: '#/components/schemas/RecoveryOpaqueEnvelope'}
        recovery_identity_envelope: {$ref: '#/components/schemas/RecoveryOpaqueEnvelope'}
        key_envelopes:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/RecoveryKeyEnvelope'}
        recovery_identity_proof_signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
    RecoveryCompleteRequest:
      type: object
      additionalProperties: false
      required: [operation_id, account_id, instance_id, server_space_id, recovery_generation, challenge_id, challenge, recovery_signature, new_kdf, new_login_verifier, account_key_envelope, device, vault_key_envelopes, next_recovery]
      properties:
        operation_id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        server_space_id: {type: string, format: uuid}
        recovery_generation: {type: integer, minimum: 1}
        challenge_id: {type: string, format: uuid}
        challenge: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        recovery_signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$'}
        new_kdf: {$ref: '#/components/schemas/RecoveryKdf'}
        new_login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        account_key_envelope: {$ref: '#/components/schemas/RecoveryAccountKeyEnvelope'}
        device: {$ref: '#/components/schemas/RecoveryCompletionDevice'}
        vault_key_envelopes:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/RecoveryVaultKeyEnvelope'}
        next_recovery: {$ref: '#/components/schemas/RecoveryNextDescriptor'}
    MeResponse:
      type: object
      required: [account_id, username, device_id, account_key_envelope, account_key_envelope_version, recovery_status, policy]
      properties:
        account_id: {type: string, format: uuid}
        username: {type: string, description: Normalized lowercase email-like account username}
        device_id: {type: string, format: uuid}
        account_key_envelope: {type: object, description: Opaque encrypted account-key envelope}
        account_key_envelope_version: {type: integer, minimum: 1}
        recovery_status:
          type: string
          enum: [disabled, current, stale]
          description: Server-computed account recovery coverage state; current means an opaque signed Recovery box exists for every required Vault context.
        policy:
          type: object
          required: [registration_open, instance_admin, credential_visibility]
          properties:
            credential_visibility:
              description: The account's credential-visibility mode; null in the restricted PostgreSQL runtime.
              oneOf:
                - {$ref: '#/components/schemas/CredentialVisibilityPolicy'}
                - {type: 'null'}
            registration_open: {type: boolean}
            instance_admin:
              type: boolean
              description: True when this account's normalized username is in the instance-admin allowlist; informational only, each admin request independently checks the active session and current allowlist.
    AdminOverview:
      type: object
      required: [instance, counts, relay, database_encryption, generated_at]
      properties:
        instance:
          type: object
          required: [instance_id, server_space_id, generation, protocol_version]
          properties:
            instance_id: {type: string, format: uuid}
            server_space_id: {type: string, format: uuid}
            generation: {type: string, format: uuid}
            protocol_version: {type: integer, const: 1}
        counts:
          type: object
          description: Instance-wide aggregates. No account or Vault names or per-user/per-Vault rows are returned.
          required: [accounts_total, accounts_active, accounts_deleting, accounts_disabled, devices_active, vaults_active, vaults_deleting, stored_bytes, reserved_upload_bytes, vault_quota_bytes]
          properties:
            accounts_total: {type: integer, format: int64, minimum: 0, description: All current account rows, including active and deletion-pending accounts; permanently purged accounts are absent.}
            accounts_active: {type: integer, format: int64, minimum: 0, description: Accounts whose current status is active.}
            accounts_deleting: {type: integer, format: int64, minimum: 0, description: Accounts in deletion grace.}
            accounts_disabled: {type: integer, format: int64, minimum: 0, description: Accounts whose login is administratively disabled.}
            devices_active: {type: integer, format: int64, minimum: 0, description: Active devices belonging to active accounts.}
            vaults_active: {type: integer, format: int64, minimum: 0, description: Vaults whose current status is active.}
            vaults_deleting: {type: integer, format: int64, minimum: 0, description: Vaults in deletion grace.}
            stored_bytes: {type: integer, format: int64, minimum: 0, description: Sum of completed blob payload sizes across all nonpurged Vaults, including bytes retained during object-GC grace.}
            reserved_upload_bytes: {type: integer, format: int64, minimum: 0, description: Sum of expected sizes for open, unexpired upload reservations across the instance.}
            vault_quota_bytes: {type: integer, format: int64, minimum: 0, description: Sum of configured quotas for active and deleting Vaults.}
        relay:
          type: object
          required: [enabled, allow_cidrs, allow_ports, max_connections_per_user]
          properties:
            enabled: {type: boolean, description: Whether SSH Relay is available under the current runtime and effective policy; false in restricted PostgreSQL mode.}
            allow_cidrs: {type: array, items: {type: string}, description: Current effective Relay destination CIDR allowlist; empty in restricted PostgreSQL mode.}
            allow_ports: {type: array, items: {type: integer, minimum: 1, maximum: 65535}, description: Current effective exact destination-port allowlist; empty in restricted PostgreSQL mode.}
            max_connections_per_user: {type: integer, minimum: 1, description: Current per-user Relay connection limit.}
        database_encryption:
          type: string
          enum: [enabled, disabled]
          description: >-
            enabled when the main SQLite database is SQLCipher-encrypted at
            rest with the operator key named by ATERMIUS_DATABASE_KEY_FILE;
            disabled for a plaintext database, which admin clients should
            flag. In restricted PostgreSQL mode this describes only the
            responding node's local SQLite store; PostgreSQL data relies on
            storage-level encryption. Never includes key material or paths.
        generated_at: {type: string, format: date-time, description: UTC RFC3339 time at which this overview was generated.}
    AdminPushHealth:
      type: object
      additionalProperties: false
      required: [generated_at, delivery_window, providers]
      properties:
        generated_at: {type: string, format: date-time, description: UTC RFC3339 database time used for the queue snapshot comparisons.}
        delivery_window: {$ref: '#/components/schemas/AdminPushHealthDeliveryWindow'}
        providers:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly one apns row followed by one fcm_v1 row.
          items: {$ref: '#/components/schemas/AdminPushHealthProvider'}
    AdminPushHealthProvider:
      type: object
      additionalProperties: false
      required: [provider, configured, registered_endpoints, due, retry_waiting, leased, dead_lettered, delivery_results]
      properties:
        provider: {type: string, enum: [apns, fcm_v1]}
        configured: {type: boolean, description: True only when this responding process has loaded the adapter; it does not imply connectivity or worker liveness.}
        registered_endpoints: {type: integer, format: int64, minimum: 0, description: All current endpoint registration rows for this provider, independent of account/device status.}
        due: {type: integer, format: int64, minimum: 0, description: Unfinished non-dead-letter rows scheduled at or before database snapshot time with no active lease; expired leases are due.}
        retry_waiting: {type: integer, format: int64, minimum: 0, description: Unfinished non-dead-letter rows scheduled after database snapshot time.}
        leased: {type: integer, format: int64, minimum: 0, description: Unfinished non-dead-letter rows with an active lease at database snapshot time.}
        dead_lettered: {type: integer, format: int64, minimum: 0, description: Unfinished rows marked dead-lettered.}
        delivery_results: {$ref: '#/components/schemas/AdminPushHealthDeliveryResults'}
    AdminPushHealthDeliveryWindow:
      type: object
      additionalProperties: false
      required: [days, start_date_utc, end_date_utc]
      properties:
        days: {type: integer, enum: [7]}
        start_date_utc: {type: string, format: date, description: Inclusive first UTC calendar date in the result window.}
        end_date_utc: {type: string, format: date, description: Inclusive last UTC calendar date in the result window; the current date is partial.}
    AdminPushHealthDeliveryResults:
      type: object
      additionalProperties: false
      required: [accepted, invalid_token, retryable_failure]
      properties:
        accepted: {type: integer, format: int64, minimum: 0, description: Provider adapter returned success; device receipt and sync are not confirmed.}
        invalid_token: {type: integer, format: int64, minimum: 0, description: Provider adapter classified the endpoint token as invalid.}
        retryable_failure: {type: integer, format: int64, minimum: 0, description: Provider adapter reported a retryable failure or timed out.}
    AdminRelayGroupCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80, x-maxUtf8Bytes: 320, description: Trimmed and normalized with Unicode NFKC; control characters are rejected. The server derives its unique name key by applying Unicode lowercase to NFKC text and normalizing the result with NFKC; this is not full Unicode case folding.}
    AdminRelayGroupRenameRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, name]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 80, x-maxUtf8Bytes: 320}
    AdminRelayGroupDeleteRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, expected_membership_revision, expected_policy_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        expected_membership_revision: {type: integer, format: int64, minimum: 0}
        expected_policy_revision: {type: integer, format: int64, minimum: 0}
    AdminRelayGroupMembersRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, user_ids]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        user_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: {type: string, format: uuid}
    AdminRelayGroupPolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, expected_instance_policy_revision, enabled, allow_cidrs, allow_ports]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        expected_instance_policy_revision: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        allow_cidrs:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, maxLength: 64, description: Canonical CIDR network address contained by the current effective instance policy.}
        allow_ports:
          type: array
          maxItems: 4096
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 65535, description: Exact port contained by the current effective instance policy.}
    AdminRelayGroupPolicyResetRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
    AdminRelayGroupList:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/AdminRelayGroupSummary'}
    AdminRelayGroupSummary:
      type: object
      additionalProperties: false
      required: [group_id, name, revision, membership_revision, policy_revision, member_count, policy_inherited, updated_at]
      properties:
        group_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80, x-maxUtf8Bytes: 320}
        revision: {type: integer, format: int64, minimum: 1}
        membership_revision: {type: integer, format: int64, minimum: 0}
        policy_revision: {type: integer, format: int64, minimum: 0}
        member_count: {type: integer, minimum: 0, maximum: 1000}
        policy_inherited: {type: boolean}
        updated_at: {type: string, format: date-time}
    AdminRelayGroupDetail:
      type: object
      additionalProperties: false
      required: [group, members, policy]
      properties:
        group: {$ref: '#/components/schemas/AdminRelayGroup'}
        members: {$ref: '#/components/schemas/AdminRelayGroupMembers'}
        policy: {$ref: '#/components/schemas/AdminRelayGroupPolicy'}
    AdminRelayGroup:
      type: object
      additionalProperties: false
      required: [group_id, name, revision, created_at, updated_at]
      properties:
        group_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 80, x-maxUtf8Bytes: 320}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminRelayGroupMembers:
      type: object
      additionalProperties: false
      required: [revision, items]
      properties:
        revision: {type: integer, format: int64, minimum: 0}
        items:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/AdminRelayGroupMember'}
    AdminRelayGroupMember:
      type: object
      additionalProperties: false
      required: [user_id, username]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320}
    AdminRelayGroupPolicy:
      type: object
      additionalProperties: false
      required: [inherited, revision, updated_at, instance_policy_revision, policy, effective_policy]
      properties:
        inherited: {type: boolean, description: True when the group has no override and follows the current instance policy.}
        revision: {type: integer, format: int64, minimum: 0, description: Monotonic CAS watermark including reset while the override row is absent.}
        updated_at: {type: [string, 'null'], format: date-time}
        instance_policy_revision: {type: integer, format: int64, minimum: 0}
        policy: {$ref: '#/components/schemas/AdminRelayPolicySelection'}
        effective_policy: {$ref: '#/components/schemas/AdminRelayEffectivePolicy'}
    AdminRelayPolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, enabled, allow_cidrs, allow_ports]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        allow_cidrs:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, maxLength: 64, description: Canonical CIDR network address wholly contained by a deployment CIDR.}
        allow_ports:
          type: array
          maxItems: 4096
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 65535}
    AdminRelayPolicy:
      type: object
      additionalProperties: false
      required: [policy, deployment_limits, max_connections_per_user, revision, updated_at]
      properties:
        policy: {$ref: '#/components/schemas/AdminRelayPolicySelection'}
        deployment_limits: {$ref: '#/components/schemas/AdminRelayDeploymentLimits'}
        max_connections_per_user: {type: integer, minimum: 1, description: Per-user active Relay connection ceiling; read-only deployment/server setting.}
        revision: {type: integer, format: int64, minimum: 0}
        updated_at: {type: [string, 'null'], format: date-time}
    AdminRelayUserPolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, expected_instance_policy_revision, enabled, allow_cidrs, allow_ports]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        expected_instance_policy_revision: {type: integer, format: int64, minimum: 0, description: Instance policy revision observed with the account policy; checked atomically with expected_revision.}
        enabled: {type: boolean}
        allow_cidrs:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, maxLength: 64, description: Canonical CIDR network address contained by the current effective instance policy.}
        allow_ports:
          type: array
          maxItems: 4096
          uniqueItems: true
          items: {type: integer, minimum: 1, maximum: 65535, description: Exact port contained by the current effective instance policy.}
    AdminRelayUserPolicyResetRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
    AdminRelayUserPolicy:
      type: object
      additionalProperties: false
      required: [user_id, inherited, policy, effective_policy, instance_policy_revision, revision, updated_at]
      properties:
        user_id: {type: string, format: uuid}
        inherited: {type: boolean, description: True when no user policy row exists and policy is inherited from the instance.}
        policy: {$ref: '#/components/schemas/AdminRelayPolicySelection'}
        effective_policy: {$ref: '#/components/schemas/AdminRelayEffectivePolicy'}
        instance_policy_revision: {type: integer, format: int64, minimum: 0}
        revision: {type: integer, format: int64, minimum: 0, description: Monotonic CAS generation, including reset mutations while no override row exists.}
        updated_at: {type: [string, 'null'], format: date-time, description: Last user override or reset mutation; null before the first override.}
    AdminRelayEffectivePolicy:
      type: object
      additionalProperties: false
      required: [enabled, allow_cidrs, allow_ports]
      properties:
        enabled: {type: boolean, description: Effective after deployment, instance, authenticated-user and all assigned group policy intersections.}
        allow_cidrs: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, maxLength: 64}}
        allow_ports: {type: array, maxItems: 4096, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}}
    AdminRelayPolicySelection:
      type: object
      additionalProperties: false
      required: [enabled, allow_cidrs, allow_ports]
      properties:
        enabled: {type: boolean, description: Durable administrator selection; effective only when deployment_limits.relay_available is true.}
        allow_cidrs: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, maxLength: 64, description: Canonical saved CIDR selection; effective authorization intersects it with current deployment limits.}}
        allow_ports: {type: array, maxItems: 4096, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535, description: Saved exact-port selection; effective authorization intersects it with current deployment limits.}}
    AdminRelayDeploymentLimits:
      type: object
      additionalProperties: false
      required: [relay_available, allow_cidrs, allow_ports]
      properties:
        relay_available: {type: boolean, description: True only when deployment Relay flag, public origin and valid non-empty deployment CIDR and port lists are all configured.}
        allow_cidrs: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, maxLength: 64}, description: Immutable deployment CIDR ceiling.}
        allow_ports: {type: array, maxItems: 4096, uniqueItems: true, items: {type: integer, minimum: 1, maximum: 65535}, description: Immutable exact destination-port ceiling.}
    AdminBackupStatus:
      type: object
      additionalProperties: false
      required: [operation, last_attempt]
      properties:
        operation: {type: string, const: backup}
        last_attempt:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/AdminBackupAttempt'}
    AdminBackupReplicationStatus:
      type: object
      additionalProperties: false
      required: [operation, configured, pending_count, latest_attempt]
      properties:
        operation: {type: string, const: backup_replication}
        configured: {type: boolean}
        pending_count: {type: integer, format: int64, minimum: 0}
        latest_attempt:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/AdminBackupReplicationAttempt'}
    AdminBackupReplicationPreflightRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    AdminBackupReplicationPreflightStatus:
      type: object
      additionalProperties: false
      required: [check, result]
      properties:
        check: {type: string, const: bucket_access}
        result: {type: string, const: passed}
    AdminBackupReplicationAttempt:
      type: object
      additionalProperties: false
      required: [archive_id, state, attempted_at, completed_at, archive_bytes, failure_category]
      properties:
        archive_id: {type: string, format: uuid}
        state:
          type: string
          enum: [pending_archive, pending, running, retry_wait, succeeded, interrupted, failed]
        attempted_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        archive_bytes: {type: [integer, 'null'], format: int64, minimum: 1}
        failure_category:
          type: [string, 'null']
          enum: [archive_unavailable, credentials_invalid, remote_unavailable, remote_integrity_mismatch, replication_failed, null]
    AdminBackupAttempt:
      type: object
      additionalProperties: false
      required: [attempted_at, result, migration_version, archive_bytes, failure_category]
      properties:
        attempted_at: {type: string, format: date-time}
        result: {type: string, enum: [succeeded, failed]}
        migration_version: {type: [integer, 'null'], minimum: 0}
        archive_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 1
          description: Null when a completed PostgreSQL archive is no longer safely visible to this node.
        failure_category: {type: [string, 'null'], enum: [backup_failed, null]}
    AdminBackupScheduleRequest:
      type: object
      additionalProperties: false
      required: [interval_hours]
      properties:
        interval_hours: {type: [integer, 'null'], minimum: 1, maximum: 720, description: Interval in hours, or null to disable scheduled backups.}
    AdminBackupSchedule:
      type: object
      additionalProperties: false
      required: [operation, backup_configured, interval_hours, next_run_at, last_run]
      properties:
        operation: {type: string, const: backup_schedule}
        backup_configured: {type: boolean, description: Whether private server backup settings and compatible PostgreSQL tools when applicable currently validate.}
        interval_hours: {type: [integer, 'null'], minimum: 1, maximum: 720}
        next_run_at: {type: [string, 'null'], format: date-time}
        last_run:
          oneOf:
            - {type: 'null'}
            - {$ref: '#/components/schemas/AdminScheduledBackupRun'}
    AdminScheduledBackupRun:
      type: object
      additionalProperties: false
      required: [run_id, scheduled_for, started_at, finished_at, status, result_code, archive_bytes, migration_version]
      properties:
        run_id: {type: string, format: uuid}
        scheduled_for: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [running, succeeded, failed, interrupted]}
        result_code: {type: [string, 'null'], enum: [completed, backup_failed, interrupted, null]}
        archive_bytes: {type: [integer, 'null'], format: int64, minimum: 1}
        migration_version: {type: [integer, 'null'], minimum: 0}
    AdminRestoreSourcePage:
      type: object
      additionalProperties: false
      required: [sources, total]
      properties:
        sources:
          type: array
          items: {$ref: '#/components/schemas/AdminRestoreSource'}
        total: {type: integer, format: int64, minimum: 0}
    AdminRestoreSource:
      type: object
      additionalProperties: false
      required: [archive_id, created_at, archive_bytes, origin, source]
      properties:
        archive_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        created_at: {type: string, format: date-time}
        archive_bytes: {type: integer, format: int64, minimum: 1}
        origin: {type: string, enum: [manual, scheduled]}
        source: {type: string, enum: [local, replica]}
    AdminJobPage:
      type: object
      additionalProperties: false
      required: [jobs, total, supported_actions]
      properties:
        jobs:
          type: array
          items: {$ref: '#/components/schemas/AdminJob'}
        total: {type: integer, format: int64, minimum: 0}
        supported_actions:
          type: array
          uniqueItems: true
          items: {type: string, enum: [maintenance, backup, restore, backup_status, backup_replication, backup_schedule, restore_replica, restore_stage_discard]}
          description: Runtime capabilities. PostgreSQL advertises backup_status after the shared jobs ledger is ready, backup/restore only when their operator settings and tools are ready, and does not support replication, schedules, replica restore or stage discard.
    AdminJobReceipt:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job: {$ref: '#/components/schemas/AdminJob'}
    AdminJobRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [request_id, action]
          properties:
            request_id:
              type: string
              format: uuid
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            action: {type: string, const: maintenance}
        - type: object
          additionalProperties: false
          required: [request_id, action]
          properties:
            request_id:
              type: string
              format: uuid
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            action: {type: string, const: backup}
        - type: object
          additionalProperties: false
          required: [request_id, action, archive_id, archive_source]
          properties:
            request_id:
              type: string
              format: uuid
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            action: {type: string, const: restore}
            archive_id:
              type: string
              format: uuid
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            archive_source: {type: string, enum: [local, replica]}
    AdminJob:
      type: object
      additionalProperties: false
      required: [job_id, request_id, action, archive_id, archive_source, status, requested_at, started_at, finished_at, result_code, restore_stage_status]
      properties:
        job_id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        action: {type: string, enum: [maintenance, backup, restore]}
        archive_id:
          type: [string, 'null']
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        archive_source:
          type: [string, 'null']
          enum: [local, replica, null]
        status: {type: string, enum: [queued, running, succeeded, failed, interrupted]}
        requested_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        result_code:
          type: [string, 'null']
          enum: [completed, maintenance_failed, backup_failed, restore_failed, interrupted, null]
        restore_stage_status:
          type: [string, 'null']
          enum: [ready, failed, interrupted, discarding, discarded, unverified, null]
          description: Original job owner only. PostgreSQL reports failed/interrupted preparation states; SQLite discard states require receipt and stage revalidation.
    AdminRestoreStageDiscardRequest:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    AdminRestoreStageDiscardResponse:
      type: object
      additionalProperties: false
      required: [restore_stage]
      properties:
        restore_stage:
          type: object
          additionalProperties: false
          required: [restore_job_id, status, discarded_at]
          properties:
            restore_job_id:
              type: string
              format: uuid
              pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
            status: {type: string, const: discarded}
            discarded_at: {type: string, format: date-time}
    AdminAccountPage:
      type: object
      additionalProperties: false
      required: [accounts, total, limit, offset]
      properties:
        accounts:
          type: array
          items: {$ref: '#/components/schemas/AdminAccountSummary'}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
    AdminAccountSummary:
      type: object
      additionalProperties: false
      required: [user_id, username, status, created_at, active_device_count, active_session_count]
      properties:
        user_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        username: {type: string, description: Normalized account username, visible only to allowlisted instance administrators.}
        status: {type: string, enum: [active, disabled, deleting]}
        created_at: {type: string, format: date-time}
        active_device_count: {type: integer, format: int64, minimum: 0}
        active_session_count: {type: integer, format: int64, minimum: 0, description: Unrevoked sessions whose refresh expiry is in the future.}
        credential_visibility: {$ref: '#/components/schemas/CredentialVisibilityMode', description: SQLite runtime only.}
        escrow_status: {$ref: '#/components/schemas/CredentialEscrowStatus', description: SQLite runtime only.}
    AdminAccountInvitationPage:
      type: object
      additionalProperties: false
      required: [invitations, total, limit, offset]
      properties:
        invitations:
          type: array
          items: {$ref: '#/components/schemas/AdminAccountInvitationSummary'}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
    AdminAccountInvitationSummary:
      type: object
      additionalProperties: false
      required: [invitation_id, username, created_at, expires_at, status]
      properties:
        invitation_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        username: {type: string, description: Normalized username bound to the invitation.}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        status: {type: string, enum: [pending, expired, consumed, revoked]}
        credential_visibility:
          description: Explicit mode for the invited account; null uses the instance default at registration. SQLite runtime only.
          oneOf:
            - {$ref: '#/components/schemas/CredentialVisibilityMode'}
            - {type: 'null'}
    AdminAccountInvitationRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: {type: string, minLength: 1, maxLength: 320, x-maxUtf8Bytes: 320, description: Trimmed and lowercased before validation; the normalized UTF-8 encoding is limited to 320 bytes. maxLength counts Unicode characters and does not enforce this byte limit by itself.}
        expires_in_seconds: {type: integer, minimum: 60, maximum: 2592000, default: 604800}
        credential_visibility:
          description: Optional explicit mode for the invited account; absent or null uses the instance default at registration. A non-null value returns 503 PG_SYNC_SCOPE_LIMITED in the restricted PostgreSQL runtime.
          oneOf:
            - {$ref: '#/components/schemas/CredentialVisibilityMode'}
            - {type: 'null'}
    AdminAccountInvitationCreated:
      type: object
      additionalProperties: false
      required: [invitation]
      properties:
        invitation:
          type: object
          additionalProperties: false
          required: [invitation_id, username, created_at, expires_at, token]
          properties:
            invitation_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
            username: {type: string}
            created_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
            token: {type: string, minLength: 43, maxLength: 43, description: One-time enrollment token returned only at issuance.}
            credential_visibility:
              description: SQLite runtime only; null means the instance default applies at registration.
              oneOf:
                - {$ref: '#/components/schemas/CredentialVisibilityMode'}
                - {type: 'null'}
    AdminAccountInvitationRevoked:
      type: object
      additionalProperties: false
      required: [invitation_id, status, revoked_at]
      properties:
        invitation_id: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        status: {type: string, const: revoked}
        revoked_at: {type: string, format: date-time}
    AdminAccountStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, disabled]}
    AdminAccountStatusResponse:
      type: object
      additionalProperties: false
      required: [account_id, status, revoked_sessions, changed, updated_at]
      properties:
        account_id: {type: string, format: uuid}
        status: {type: string, enum: [active, disabled]}
        revoked_sessions: {type: integer, format: int64, minimum: 0, description: Sessions revoked by this disable transition.}
        changed: {type: boolean, description: False when the requested status already matched.}
        updated_at: {type: string, format: date-time}
    AdminSessionPage:
      type: object
      additionalProperties: false
      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items: {$ref: '#/components/schemas/AdminSessionSummary'}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
    AdminSessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, device_id, device_name, created_at, access_expires_at, refresh_expires_at, revoked_at, active]
      properties:
        session_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        device_name: {type: string}
        created_at: {type: string, format: date-time}
        access_expires_at: {type: string, format: date-time}
        refresh_expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        active: {type: boolean, description: Unrevoked, unexpired session with an active account and device.}
    AdminSessionsRevokeResponse:
      type: object
      additionalProperties: false
      required: [account_id, revoked_sessions, updated_at]
      properties:
        account_id: {type: string, format: uuid}
        revoked_sessions: {type: integer, format: int64, minimum: 0}
        updated_at: {type: string, format: date-time}
    AdminSessionRevokeResponse:
      type: object
      additionalProperties: false
      required: [account_id, session_id, revoked, changed, updated_at]
      properties:
        account_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        revoked: {type: boolean, const: true}
        changed: {type: boolean, description: False when the session was already revoked.}
        updated_at: {type: string, format: date-time}
    AdminVaultPage:
      type: object
      required: [vaults, total, limit, offset]
      properties:
        vaults:
          type: array
          items: {$ref: '#/components/schemas/AdminVaultQuotaSummary'}
        total: {type: integer, format: int64, minimum: 0, description: Total number of existing Vault rows before pagination.}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 1000000}
    AdminVaultQuotaSummary:
      type: object
      required: [vault_id, owner_user_id, owner_username, state, stored_bytes, reserved_upload_bytes, quota_bytes, created_at]
      properties:
        vault_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        owner_user_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        owner_username: {type: string, description: Normalized email-like account username of the Vault owner.}
        state: {type: string, enum: [active, deleting]}
        stored_bytes: {type: integer, format: int64, minimum: 0, description: Sum of completed blob payload sizes in the Vault.}
        reserved_upload_bytes: {type: integer, format: int64, minimum: 0, description: Sum of expected sizes for open, unexpired uploads in the Vault.}
        quota_bytes: {type: integer, format: int64, minimum: 1, maximum: 1099511627776, description: Configured storage quota in bytes, from 1 byte through 1 TiB.}
        created_at: {type: string, format: date-time, description: UTC RFC3339 creation time.}
    AdminVaultQuotaRequest:
      type: object
      additionalProperties: false
      required: [quota_bytes]
      properties:
        quota_bytes: {type: integer, format: int64, minimum: 1, maximum: 1099511627776, description: Requested quota in bytes, from 1 byte through 1 TiB inclusive; zero returns INVALID_QUOTA.}
    AdminVaultQuotaResponse:
      type: object
      required: [vault_id, quota_bytes, stored_bytes, reserved_upload_bytes, updated_at]
      properties:
        vault_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        quota_bytes: {type: integer, format: int64, minimum: 1, maximum: 1099511627776}
        stored_bytes: {type: integer, format: int64, minimum: 0, description: Current completed blob payload bytes in the Vault.}
        reserved_upload_bytes: {type: integer, format: int64, minimum: 0, description: Current expected bytes of open, unexpired uploads in the Vault.}
        updated_at: {type: string, format: date-time, description: UTC RFC3339 time of the quota update.}
    AdminAuditPage:
      type: object
      additionalProperties: false
      required: [events, next_cursor, has_more]
      properties:
        events:
          type: array
          items: {$ref: '#/components/schemas/AdminAuditEvent'}
        next_cursor: {type: [string, 'null'], description: Opaque next-page cursor, or null when pagination is complete.}
        has_more: {type: boolean, description: True when another row exists within the fixed high-water mark.}
    AdminAuditEvent:
      type: object
      additionalProperties: false
      required: [event_id, scope, actor_user_id, actor_device_id, action, resource_type, resource_id, result, occurred_at, source]
      properties:
        event_id: {type: string, pattern: '^[0-9]+$', description: Decimal event sequence string.}
        scope: {type: string, const: instance}
        actor_user_id: {type: [string, 'null'], format: uuid, description: Authenticated actor ID, or null if the actor account was purged.}
        actor_device_id: {type: [string, 'null'], format: uuid, description: Authenticated actor device ID, or null if unavailable.}
        action: {type: string, description: Fixed instance action label.}
        resource_type: {type: string, description: Fixed resource type label.}
        resource_id: {type: [string, 'null'], description: Keyed HMAC resource identifier; never a raw Vault ID.}
        result: {type: string, enum: [success, failure]}
        occurred_at: {type: string, format: date-time}
        source: {type: string, enum: [api, maintenance]}
    AuditEvent:
      type: object
      required: [event_id, scope, vault_id, actor_user_id, actor_device_id, action, resource_type, resource_id, result, occurred_at, source]
      properties:
        event_id: {type: string, pattern: '^[0-9]+$', description: Decimal sequence string}
        scope: {type: string, enum: [account, vault]}
        vault_id: {type: [string, 'null'], format: uuid}
        actor_user_id: {type: [string, 'null'], format: uuid}
        actor_device_id: {type: [string, 'null'], format: uuid}
        action: {type: string}
        resource_type: {type: string, description: Fixed resource type label; sync batch events use sync_batch.}
        resource_id: {type: [string, 'null'], description: "Opaque resource identifier. Sync batch events always use null. Session and session_family resources expose only random UUIDs, never access or refresh tokens; actor IDs and account, account-recovery, device, membership, session, and session-family resource IDs, plus Vault resource IDs of the purged account's own account-scope rows, are cleared when the owning account is permanently purged."}
        result: {type: string, enum: [success, failure]}
        occurred_at: {type: string, format: date-time}
        source: {type: string, enum: [api, maintenance]}
    AuditPage:
      type: object
      required: [events, next_cursor, has_more]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
    NotificationTicket:
      type: object
      required: [ticket, expires_at, expires_in_seconds]
      properties:
        ticket: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: One-use 32-byte ticket; never put in a URL}
        expires_at: {type: string, format: date-time}
        expires_in_seconds: {type: integer, minimum: 1, maximum: 30}
    MobilePushEndpointRequest:
      type: object
      additionalProperties: false
      required: [provider, token]
      properties:
        provider: {type: string, enum: [fcm_v1, apns]}
        token: {type: string, description: Provider-specific opaque device token; never returned}
      oneOf:
        - properties:
            provider: {const: fcm_v1}
            token: {type: string, minLength: 16, maxLength: 4096, pattern: '^[!-~]{16,4096}$', description: FCM token with 16–4096 printable non-space ASCII bytes}
        - properties:
            provider: {const: apns}
            token: {type: string, minLength: 32, maxLength: 512, pattern: '^(?:[0-9A-Fa-f]{2}){16,256}$', description: APNs device token encoded as 16–256 bytes of hexadecimal text}
    MobilePushEndpointResponse:
      type: object
      additionalProperties: false
      required: [status, device_id, provider]
      properties:
        status: {type: string, enum: [registered, removed]}
        device_id: {type: string, format: uuid}
        provider: {type: string, enum: [fcm_v1, apns]}
    RelayTicketRequest:
      type: object
      required: [device_id, target_host, target_port]
      additionalProperties: false
      properties:
        device_id: {type: string, format: uuid}
        target_host: {type: string, minLength: 1, maxLength: 254, description: IP literal or normalized DNS hostname using ASCII IDNA A-labels (maximum 253 normalized bytes; one trailing dot may make the request value 254 bytes); hostname answers are checked against the effective Relay CIDR/port policy and the selected IP is pinned into the one-use ticket}
        target_port: {type: integer, minimum: 1, maximum: 65535, description: Must exactly match one port in ATERMIUS_RELAY_ALLOW_PORTS}
    RelayTicket:
      type: object
      required: [ticket, expires_at, connect_path]
      additionalProperties: false
      properties:
        ticket: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Random one-use ticket; returned once and stored as SHA-256 hash}
        expires_at: {type: string, format: date-time}
        connect_path: {type: string, const: /relay/v1/connect}
    InstanceInfo:
      type: object
      additionalProperties: false
      required: [instance_id, server_space_id, generation, signing_public_key, signing_key_transitions, protocol_version, setup_required, restore_retention_days, capabilities, limits]
      properties:
        instance_id: {type: string, format: uuid}
        server_space_id: {type: string, format: uuid}
        generation: {type: string, format: uuid}
        signing_public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Canonical base64url without padding for a 32-byte Ed25519 public key}
        signing_key_transitions:
          type: array
          items: {$ref: '#/components/schemas/InstanceKeyTransition'}
        protocol_version: {type: integer, minimum: 1}
        setup_required: {type: boolean}
        restore_retention_days: {type: integer, minimum: 1, maximum: 3650}
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ciphertext_sync, instance_signing_key, instance_key_transitions, snapshots, revision_history, conflict_history, encrypted_objects, signed_membership, device_capability_reports, notifications, relay, web_static, credential_visibility]
        credential_visibility_default:
          $ref: '#/components/schemas/CredentialVisibilityMode'
          description: Present only with the credential_visibility capability (SQLite runtime); the mode new accounts receive unless their invitation names one. Clients show the admin_visible notice before registration.
        limits: {$ref: '#/components/schemas/InstanceLimits'}
    InstanceLimits:
      type: object
      additionalProperties: false
      required: [max_object_bytes, max_upload_chunk_bytes, max_record_object_refs]
      properties:
        max_object_bytes: {type: integer, format: int64, minimum: 1, description: Maximum declared size for one opaque object upload; default server configuration is 67108864 bytes.}
        max_upload_chunk_bytes: {type: integer, minimum: 1, description: Maximum request-body size for one uploaded object chunk; currently 1048576 bytes.}
        max_record_object_refs: {type: integer, minimum: 1, description: Maximum number of strictly sorted object references in one signed record header; currently 1024.}
    DeviceCapabilityReport:
      type: object
      additionalProperties: false
      required: [account_id, device_id, revision, max_record_schema, host_attachment_manifest_versions, max_attachment_bytes, signature]
      properties:
        account_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        max_record_schema: {type: integer, enum: [1, 2]}
        host_attachment_manifest_versions:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: integer, enum: [1, 2]}
          description: Strictly ascending supported versions; server rejects duplicates and unsorted values.
        max_attachment_bytes: {type: integer, format: int64, minimum: 0, maximum: 1073741824}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Candidate/current device Ed25519 signature over canonical JCS of the report fields excluding signature.}
    DeviceRedactionCapabilityReport:
      type: object
      additionalProperties: false
      required: [format, account_id, device_id, revision, sync_redaction_version, signature]
      properties:
        format: {type: string, const: atermius-sync-redaction-capability-v1}
        account_id: {type: string, format: uuid, description: Must equal the authenticated account ID.}
        device_id: {type: string, format: uuid, description: Must equal the authenticated active registered device ID.}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991, description: Positive, strictly monotonic per device; gaps are allowed and values must remain exactly representable by JSON/JavaScript clients.}
        sync_redaction_version: {type: integer, const: 1}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Registered device Ed25519 signature over UTF-8 canonical JCS of exactly format, account_id, device_id, revision, and sync_redaction_version; signature is excluded.}
    DeviceRedactionCapabilityReportResult:
      type: object
      additionalProperties: false
      required: [status, already_applied, redaction_capability_report]
      properties:
        status: {type: string, const: stored}
        already_applied: {type: boolean, description: True for an exact same-revision retry; false when a higher revision is stored.}
        redaction_capability_report: {$ref: '#/components/schemas/DeviceRedactionCapabilityReport'}
    VaultDeviceDirectory:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items: {$ref: '#/components/schemas/VaultDevice'}
    VaultDevice:
      type: object
      additionalProperties: false
      required: [device_id, user_id, name, signing_public_key, encryption_public_key, status, membership_status, created_at, capability_report, redaction_capability_report]
      properties:
        device_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string}
        signing_public_key: {type: string, description: Base64url Ed25519 public key.}
        encryption_public_key: {type: string, description: Base64url X25519 public key.}
        status: {type: string, enum: [active, revoked, archived]}
        membership_status: {type: string, enum: [active, invited, revoked, archived]}
        created_at: {type: string, format: date-time}
        capability_report:
          anyOf:
            - {$ref: '#/components/schemas/DeviceCapabilityReport'}
            - {type: 'null'}
        redaction_capability_report:
          anyOf:
            - {$ref: '#/components/schemas/VaultDeviceRedactionCapabilityReport'}
            - {type: 'null'}
          description: Present as null when no report exists or the row is not an active device of an active member. invalidated_at is server metadata and is excluded from the device signature payload.
    VaultDeviceRedactionCapabilityReport:
      type: object
      additionalProperties: false
      required: [format, account_id, device_id, revision, sync_redaction_version, signature, invalidated_at]
      properties:
        format: {type: string, const: atermius-sync-redaction-capability-v1}
        account_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        sync_redaction_version: {type: integer, minimum: 1, maximum: 9007199254740991}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Device Ed25519 signature over UTF-8 canonical JCS of format, account_id, device_id, revision, and sync_redaction_version; signature and invalidated_at are excluded.}
        invalidated_at: {type: [string, 'null'], format: date-time, description: Set by the server when an authenticated request invalidates this report; a higher signed report revision is required to recover readiness.}
    InstanceKeyTransition:
      type: object
      additionalProperties: false
      required: [format, instance_id, from_public_key, to_public_key, issued_at, signature]
      properties:
        format: {type: string, const: atermius-instance-key-transition-v1}
        instance_id: {type: string, format: uuid}
        from_public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        to_public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        issued_at: {type: string, format: date-time}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Old-key Ed25519 signature over canonical JCS transition payload}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Includes RECORD_RESTORE_EXPIRED (409), OBJECT_REFERENCE_UNAVAILABLE (409), OBJECT_COLLECTED (410), CLIENT_REDACTION_CAPABILITY_REQUIRED (426), SNAPSHOT_REDACTED (410), and RECORD_REDACTED (410). RECORD_RESTORE_EXPIRED details include the exact restore_until plus the backward-compatible restore_expires_at alias.
            message: {type: string}
            request_id: {type: string, format: uuid}
            details:
              type: object
              additionalProperties: true
              description: Error-specific safe recovery metadata.
    SyncPageTooLargeError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: {type: string, const: PAYLOAD_TOO_LARGE}
            message: {type: string}
            request_id: {type: string, format: uuid}
            details:
              type: object
              required: [max_response_bytes, recovery]
              properties:
                max_response_bytes: {type: integer, const: 4194304}
                recovery: {type: string, const: contact_server_operator}
    RecordRedactionProof:
      type: object
      additionalProperties: false
      required: [format, redaction_id, instance_id, server_space_id, vault_id, record_id, deleted_revision_id, deleted_seq, redaction_seq, signing_public_key, signature]
      properties:
        format: {type: string, const: aterminus-record-redaction-proof-v1}
        redaction_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        server_space_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        record_id: {type: string, format: uuid}
        deleted_revision_id: {type: string, format: uuid}
        deleted_seq: {type: string, pattern: '^[1-9][0-9]*$'}
        redaction_seq: {type: string, pattern: '^[1-9][0-9]*$'}
        signing_public_key: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$'}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]{86}$', description: Ed25519 over UTF-8 RFC 8785 JCS of every proof property except signature; clients validate signing_public_key against the verified current instance identity.}
    RecordPurgeRequest:
      type: object
      additionalProperties: false
      required: [expected_deleted_revision_id, expected_deleted_seq]
      properties:
        expected_deleted_revision_id: {type: string, format: uuid, description: Exact current deleted head revision captured by the recycle-bin action}
        expected_deleted_seq: {type: string, pattern: '^[1-9][0-9]*$', description: Exact current deleted head commit sequence}
    RecordPurgeResponse:
      type: object
      additionalProperties: false
      required: [status, already_purged, redaction]
      properties:
        status: {type: string, const: purged}
        already_purged: {type: boolean}
        redaction: {$ref: '#/components/schemas/RecordRedactionProof'}
    RecordAutomaticPurgePolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_deleted_revision_id, expected_deleted_seq, expected_policy_revision, enabled]
      properties:
        expected_deleted_revision_id: {type: string, format: uuid, description: Exact current tombstone revision captured by the recycle-bin view}
        expected_deleted_seq: {type: string, pattern: '^[1-9][0-9]*$', description: Exact current tombstone commit sequence}
        expected_policy_revision: {type: string, pattern: '^(0|[1-9][0-9]*)$', description: Current policy compare-and-set revision read by the client}
        enabled: {type: boolean, description: Explicitly enable or disable automatic-purge consent for this exact tombstone}
    RecordAutomaticPurgePolicyResponse:
      type: object
      additionalProperties: false
      required: [vault_id, record_id, deleted_revision_id, deleted_seq, enabled, policy_revision]
      properties:
        vault_id: {type: string, format: uuid}
        record_id: {type: string, format: uuid}
        deleted_revision_id: {type: string, format: uuid}
        deleted_seq: {type: string, pattern: '^[1-9][0-9]*$'}
        enabled: {type: boolean}
        policy_revision: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
    ChangePage:
      type: object
      required: [events, next_cursor, has_more, server_generation]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            oneOf:
              - type: object
                required: [commit_seq, event_type, record_id, revision_id, envelope]
                properties:
                  commit_seq: {type: string, pattern: '^[0-9]+$'}
                  event_type: {type: string, enum: [create, update, delete, restore]}
                  record_id: {type: string, format: uuid}
                  revision_id: {type: string, format: uuid}
                  envelope: {$ref: '#/components/schemas/SignedRecordEnvelope'}
                not: {required: [redaction]}
              - type: object
                additionalProperties: false
                required: [commit_seq, event_type, record_id, redaction]
                properties:
                  commit_seq: {type: string, pattern: '^[0-9]+$'}
                  event_type: {type: string, const: record_redacted}
                  record_id: {type: string, format: uuid}
                  redaction: {$ref: '#/components/schemas/RecordRedactionProof'}
        next_cursor: {type: string, description: Authenticated cursor after the last returned event only}
        has_more: {type: boolean}
        server_generation: {type: string, format: uuid}
    MembershipChainPage:
      type: object
      required: [manifests]
      properties:
        manifests:
          type: array
          items: {$ref: '#/components/schemas/SignedMembershipRecord'}
    SignedMembershipRecord:
      type: object
      required: [vault_id, membership_version, previous_digest, manifest, signature]
      properties:
        vault_id: {type: string, format: uuid}
        membership_version: {type: integer, minimum: 1}
        previous_digest: {type: [string, 'null']}
        manifest: {type: object, description: Signed inner member/epoch payload}
        signature: {type: string, description: Ed25519 over JCS of the same record without this signature field}
    ObjectRefs:
      type: array
      maxItems: 1024
      uniqueItems: true
      description: Strictly ascending array; canonical lowercase UUID strings. Omitted header.object_refs is equivalent to an empty array. It is covered by the record header AAD and Ed25519 signature.
      items:
        type: string
    RevisionHistoryPage:
      type: object
      required: [snapshot_id, vault_id, high_watermark, conflict_high_watermark, revisions, next_cursor, has_more, server_generation]
      properties:
        snapshot_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        high_watermark: {type: string, pattern: '^[0-9]+$'}
        conflict_high_watermark: {type: string, pattern: '^[0-9]+$'}
        revisions:
          type: array
          maxItems: 500
          items:
            oneOf:
              - type: object
                required: [record_id, revision_id, base_revision_id, commit_seq, operation, deleted, created_at, envelope]
                properties:
                  record_id: {type: string, format: uuid}
                  revision_id: {type: string, format: uuid}
                  base_revision_id: {type: [string, 'null'], format: uuid}
                  commit_seq: {type: string, pattern: '^[0-9]+$'}
                  operation: {type: string, enum: [create, update, delete, restore]}
                  deleted: {type: boolean, description: True only when this revision is a tombstone operation}
                  created_at: {type: string, format: date-time}
                  restore_until:
                    type: [string, 'null']
                    format: date-time
                    description: Optional for rollout compatibility. New servers return the frozen deadline on delete revisions and null on other operations.
                  auto_purge_enabled:
                    type: boolean
                    description: Optional current consent state; present only on unredacted delete rows and false when disabled.
                  auto_purge_revision:
                    type: string
                    pattern: '^(0|[1-9][0-9]*)$'
                    description: Optional current policy compare-and-set revision; present only on unredacted delete rows.
                  envelope: {type: object, description: Exact opaque signed revision envelope}
                not: {required: [redaction]}
              - type: object
                additionalProperties: false
                required: [record_id, revision_id, base_revision_id, commit_seq, operation, deleted, created_at, envelope, redaction]
                properties:
                  record_id: {type: string, format: uuid}
                  revision_id: {type: string, format: uuid}
                  base_revision_id: {type: [string, 'null'], format: uuid}
                  commit_seq: {type: string, pattern: '^[0-9]+$'}
                  operation: {type: string, const: redacted}
                  deleted: {type: boolean, description: True only for the original tombstone revision}
                  created_at: {type: string, format: date-time}
                  restore_until: {type: 'null', description: Redacted revision rows are not active tombstones.}
                  envelope: {type: 'null'}
                  redaction: {$ref: '#/components/schemas/RecordRedactionProof'}
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
        server_generation: {type: string, format: uuid}
    ConflictHistoryPage:
      type: object
      required: [snapshot_id, vault_id, high_watermark, conflict_high_watermark, conflicts, next_cursor, has_more, server_generation]
      properties:
        snapshot_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        high_watermark: {type: string, pattern: '^[0-9]+$'}
        conflict_high_watermark: {type: string, pattern: '^[0-9]+$'}
        conflicts:
          type: array
          maxItems: 500
          items:
            oneOf:
              - type: object
                required: [conflict_id, conflict_seq, record_id, base_revision_id, resolved_revision_id, resolution_seq, created_at, envelope]
                properties:
                  conflict_id: {type: string, format: uuid}
                  conflict_seq: {type: string, pattern: '^[0-9]+$'}
                  record_id: {type: string, format: uuid}
                  base_revision_id: {type: [string, 'null'], format: uuid}
                  resolved_revision_id: {type: [string, 'null'], format: uuid, description: Null if unresolved at the page high watermark}
                  resolution_seq: {type: [string, 'null'], pattern: '^[0-9]+$'}
                  created_at: {type: string, format: date-time}
                  envelope: {type: object, description: Exact opaque signed conflict branch envelope}
                not: {required: [redaction]}
              - type: object
                additionalProperties: false
                required: [conflict_id, conflict_seq, record_id, base_revision_id, resolved_revision_id, resolution_seq, created_at, envelope, redaction]
                properties:
                  conflict_id: {type: string, format: uuid}
                  conflict_seq: {type: string, pattern: '^[0-9]+$'}
                  record_id: {type: string, format: uuid}
                  base_revision_id: {type: [string, 'null'], format: uuid}
                  resolved_revision_id: {type: 'null'}
                  resolution_seq: {type: [string, 'null'], pattern: '^[0-9]+$'}
                  created_at: {type: string, format: date-time}
                  envelope: {type: 'null'}
                  redaction: {$ref: '#/components/schemas/RecordRedactionProof'}
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
        server_generation: {type: string, format: uuid}
    ConflictChangesPage:
      type: object
      required: [vault_id, after_seq, high_watermark, events, next_after_seq, has_more, server_generation]
      properties:
        vault_id: {type: string, format: uuid}
        after_seq: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        high_watermark: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        events:
          type: array
          maxItems: 500
          items:
            oneOf:
              - type: object
                required: [seq, type, conflict_id, record_id, base_revision_id, resolved_revision_id, created_at, envelope]
                properties:
                  seq: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
                  type: {type: string, const: created}
                  conflict_id: {type: string, format: uuid}
                  record_id: {type: string, format: uuid}
                  base_revision_id: {type: [string, 'null'], format: uuid}
                  resolved_revision_id: {type: 'null'}
                  created_at: {type: string, format: date-time, description: Conflict branch creation time.}
                  envelope: {type: object, description: Exact opaque signed conflict envelope.}
              - type: object
                required: [seq, type, conflict_id, record_id, base_revision_id, resolved_revision_id, created_at]
                properties:
                  seq: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
                  type: {type: string, const: resolved}
                  conflict_id: {type: string, format: uuid}
                  record_id: {type: string, format: uuid}
                  base_revision_id: {type: [string, 'null'], format: uuid}
                  resolved_revision_id: {type: string, format: uuid}
                  created_at: {type: string, format: date-time, description: First resolution time. Legacy resolution rows use the resolved revision created_at, falling back to the conflict created_at.}
                not:
                  required: [envelope]
              - type: object
                additionalProperties: false
                required: [seq, type, conflict_id, record_id, redaction]
                properties:
                  seq: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
                  type: {type: string, const: redacted}
                  conflict_id: {type: string, format: uuid}
                  record_id: {type: string, format: uuid}
                  redaction: {$ref: '#/components/schemas/RecordRedactionProof'}
        next_after_seq: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        has_more: {type: boolean}
        server_generation: {type: string, format: uuid}
    SignedRecordEnvelope:
      type: object
      required: [header, nonce, ciphertext, signature]
      properties:
        header:
          type: object
          properties:
            object_refs: {$ref: '#/components/schemas/ObjectRefs'}
          additionalProperties: true
        nonce: {type: string}
        ciphertext: {type: string}
        signature: {type: string}

    CredentialVisibilityMode:
      type: string
      enum: [private, admin_visible]
      description: private keeps saved Host credentials zero-knowledge; admin_visible escrows the account's Vault keys to the instance escrow key so administrator clients can read them. The master password is never sent in either mode.
    CredentialEscrowStatus:
      type: string
      enum: [not_required, no_key, pending, complete]
    CredentialVisibilityPolicy:
      type: object
      additionalProperties: false
      required: [mode, changed_at]
      properties:
        mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
        changed_at: {type: [string, 'null'], format: date-time, description: Null until an administrator first changes the mode after creation.}
    CredentialEscrowKeyDescriptor:
      type: object
      additionalProperties: false
      required: [key_id, public_key, signed_payload, signature, created_at]
      properties:
        key_id: {type: string, format: uuid}
        public_key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: base64url 32-byte X25519 public key}
        signed_payload: {type: string, description: 'Exact JCS of {format:"atermius-credential-escrow-key-v1",instance_id,key_id,public_key,created_at}'}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]{86}$', description: Instance Ed25519 signature over the UTF-8 signed_payload; verify against the pinned instance key.}
        created_at: {type: string, format: date-time}
    CredentialEscrowAccountWrap:
      type: object
      additionalProperties: false
      required: [version, nonce, ciphertext]
      properties:
        version: {type: integer, const: 1}
        nonce: {type: string, pattern: '^[A-Za-z0-9_-]{32}$', description: 24-byte XChaCha20 nonce}
        ciphertext: {type: string, pattern: '^[A-Za-z0-9_-]{64}$', description: 32-byte escrow secret key plus 16-byte tag}
    CredentialEscrowRecoveryWrap:
      type: object
      additionalProperties: false
      required: [version, kdf, nonce, ciphertext]
      properties:
        version: {type: integer, const: 1}
        kdf:
          type: object
          additionalProperties: false
          required: [id, salt, mem_kib, iterations, parallelism]
          properties:
            id: {type: string, const: argon2id13}
            salt: {type: string, pattern: '^[A-Za-z0-9_-]{22}$', description: Non-zero 16-byte salt}
            mem_kib: {type: integer, const: 65536}
            iterations: {type: integer, const: 3}
            parallelism: {type: integer, const: 1}
        nonce: {type: string, pattern: '^[A-Za-z0-9_-]{32}$'}
        ciphertext: {type: string, pattern: '^[A-Za-z0-9_-]{64}$'}
    CredentialVisibilityShareRecipient:
      type: object
      additionalProperties: false
      required: [recipient_admin_visible, vault_admin_visible]
      properties:
        recipient_admin_visible: {type: boolean, description: The recipient account is admin_visible (whether or not an escrow key exists yet).}
        vault_admin_visible: {type: boolean, description: The Vault is administrator visible now (escrow key exists and an active member is admin_visible).}
    CredentialVisibilityStatus:
      type: object
      additionalProperties: false
      required: [mode, changed_at, escrow_status, escrow_key, missing, admin_views, admin_visible_vaults]
      properties:
        admin_visible_vaults: {type: integer, minimum: 0, description: 'Vaults GET /vaults lists for the caller with admin_visible true.'}
        mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
        changed_at: {type: [string, 'null'], format: date-time}
        escrow_status: {$ref: '#/components/schemas/CredentialEscrowStatus'}
        escrow_key:
          oneOf:
            - {$ref: '#/components/schemas/CredentialEscrowKeyDescriptor'}
            - {type: 'null'}
        missing:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [vault_id, key_epoch]
            properties:
              vault_id: {type: string, format: uuid}
              key_epoch: {type: integer, minimum: 1}
        admin_views:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [viewed_at, admin_username, vault_id]
            properties:
              viewed_at: {type: string, format: date-time}
              admin_username: {type: [string, 'null'], description: Null when the administrator account was deleted.}
              vault_id: {type: [string, 'null'], format: uuid}
    CredentialEscrowDepositRequest:
      type: object
      additionalProperties: false
      required: [key_id, sealed, signature]
      properties:
        key_id: {type: string, format: uuid}
        sealed: {type: string, description: base64url crypto_box_seal output, 49..1024 bytes decoded}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]{86}$'}
    CredentialEscrowDepositResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [stored, already_present]}
    AdminCredentialVisibilityPolicy:
      type: object
      additionalProperties: false
      required: [default_mode, escrow_key, caller_wrap, recovery_wrap, counts]
      properties:
        default_mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
        escrow_key:
          oneOf:
            - {$ref: '#/components/schemas/CredentialEscrowKeyDescriptor'}
            - {type: 'null'}
        caller_wrap:
          oneOf:
            - {$ref: '#/components/schemas/CredentialEscrowAccountWrap'}
            - {type: 'null'}
        recovery_wrap:
          oneOf:
            - {$ref: '#/components/schemas/CredentialEscrowRecoveryWrap'}
            - {type: 'null'}
        counts:
          type: object
          additionalProperties: false
          required: [admin_visible, private, pending]
          properties:
            admin_visible: {type: integer, minimum: 0}
            private: {type: integer, minimum: 0}
            pending: {type: integer, minimum: 0}
    AdminCredentialVisibilityPolicyRequest:
      type: object
      additionalProperties: false
      required: [default_mode]
      properties:
        default_mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
    AdminAccountCredentialVisibilityRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
    AdminAccountCredentialVisibilityResponse:
      type: object
      additionalProperties: false
      required: [user_id, mode, changed_at, escrow_status]
      properties:
        user_id: {type: string, format: uuid}
        mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
        changed_at: {type: [string, 'null'], format: date-time}
        escrow_status: {$ref: '#/components/schemas/CredentialEscrowStatus'}
    AdminCredentialEscrowKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [key_id, public_key, creator_signature, account_wrap, recovery_wrap]
      properties:
        key_id: {type: string, format: uuid}
        public_key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        creator_signature: {type: string, pattern: '^[A-Za-z0-9_-]{86}$', description: 'Calling device Ed25519 over JCS {format:"atermius-credential-escrow-key-creation-v1",instance_id,key_id,public_key,account_id,device_id}'}
        account_wrap: {$ref: '#/components/schemas/CredentialEscrowAccountWrap'}
        recovery_wrap: {$ref: '#/components/schemas/CredentialEscrowRecoveryWrap'}
    AdminCredentialEscrowKeyWrapRequest:
      type: object
      additionalProperties: false
      required: [key_id, account_wrap]
      properties:
        key_id: {type: string, format: uuid}
        account_wrap: {$ref: '#/components/schemas/CredentialEscrowAccountWrap'}
    AdminCredentialEscrowKeyResetRequest:
      type: object
      additionalProperties: false
      required: [key_id, confirm]
      properties:
        key_id: {type: string, format: uuid}
        confirm: {type: string, const: reset}
    AdminCredentialEscrowAccountVaults:
      type: object
      additionalProperties: false
      required: [account, vaults]
      properties:
        account:
          type: object
          additionalProperties: false
          required: [user_id, username, mode]
          properties:
            user_id: {type: string, format: uuid}
            username: {type: string}
            mode: {$ref: '#/components/schemas/CredentialVisibilityMode'}
        vaults:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [vault_id, role, owner_user_id, name_envelope, active_epoch, escrow]
            properties:
              vault_id: {type: string, format: uuid}
              role: {type: string, enum: [owner, editor, viewer]}
              owner_user_id: {type: string, format: uuid}
              name_envelope: {type: [object, 'null'], description: Opaque Vault name ciphertext}
              active_epoch: {type: integer, minimum: 1}
              escrow:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [key_epoch, sealed, signature, depositor_device_id, depositor_signing_public_key]
                  properties:
                    key_epoch: {type: integer, minimum: 1}
                    sealed: {type: string}
                    signature: {type: string}
                    depositor_device_id: {type: [string, 'null'], format: uuid}
                    depositor_signing_public_key: {type: [string, 'null'], description: Ed25519 key of the depositing device, from the device row or, after the depositor's account was purged, the Vault-scoped device archive; null only if neither exists.}
    AdminCredentialEscrowRecordPage:
      type: object
      additionalProperties: false
      required: [records, next_after]
      properties:
        records:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [record_id, revision_id, envelope, author_device_id, author_signing_public_key]
            properties:
              record_id: {type: string, format: uuid}
              revision_id: {type: string, format: uuid}
              envelope: {type: object, description: Record envelope exactly as stored by sync}
              author_device_id: {type: string, format: uuid}
              author_signing_public_key: {type: [string, 'null'], description: Ed25519 key of the authoring device, from the device row or the Vault-scoped device archive for a purged author; null only if neither exists.}
        next_after: {type: [string, 'null'], format: uuid}
  parameters:
    ClientCapabilityMarker:
      name: X-Atermius-Capability-Marker
      in: header
      required: false
      description: Every bearer-authenticated request should send exactly one canonical v1 or v2. Missing, duplicate, malformed, or unknown values are treated as v1. This unsigned declaration is only a read hint; it never replaces the signed per-device report required for schema-2 writes. A v1/missing marker atomically revokes a stored report that asserted full v2 support on the device's next server contact.
      schema: {type: string, enum: [v1, v2]}
    ClientRedactionMarker:
      name: X-Atermius-Redaction-Marker
      in: header
      required: false
      description: Once the Vault contains a redaction, the listed sync and object payload routes require exactly one canonical v1 value and return 426 otherwise. This unsigned transport declaration never substitutes for the device-signed report. Independently, a device that has published a capability report must send exactly one canonical v1 value on every authenticated request; missing, duplicate, malformed, or unknown values invalidate the current report while preserving its revision watermark. The report itself is stored only by the capability route, which requires this header.
      schema: {type: string, const: v1}
    HistorySnapshot:
      name: snapshot_id
      in: query
      required: true
      description: Existing, unexpired snapshot for this vault with both record and conflict history watermarks.
      schema: {type: string, format: uuid}
    HistoryCursor:
      name: cursor
      in: query
      required: false
      description: Authenticated opaque cursor bound to vault, generation, endpoint kind and fixed high watermark.
      schema: {type: string}
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Page size. Omitted means 500; values outside 1..500 return INVALID_LIMIT.
      schema: {type: integer, minimum: 1, maximum: 500, default: 500}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
