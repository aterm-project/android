      properties:
        account_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        access_token: {type: string, minLength: 1}
        expires_in: {type: integer, minimum: 1}
        refresh_token: {type: string, minLength: 1}
    RecoveryOpaqueEnvelope:
      type: object
      additionalProperties: false
      required: [version, suite, nonce, ciphertext]
      properties:
        version: {type: integer, const: 1}
        suite: {type: string, const: xchacha20-poly1305-ietf}
        nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$', description: Base64url-no-pad encoding of 24 nonce bytes}
        ciphertext: {type: string, minLength: 22, maxLength: 65536, pattern: '^[A-Za-z0-9_-]+$', description: Base64url-no-pad ciphertext; the code-encrypted recovery envelope is exactly 528 decoded bytes}
    RecoveryAccountKeyEnvelope:
