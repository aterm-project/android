            application/json:
              schema: {$ref: '#/components/schemas/CredentialEscrowDepositResult'}
        '400': {description: CREDENTIAL_ESCROW_INVALID (shape, size, signature, epoch or undelivered epoch)}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_REVOKED}
        '404': {description: NOT_FOUND for any Vault the caller cannot deposit for}
        '409': {description: CREDENTIAL_ESCROW_NOT_REQUIRED or CREDENTIAL_ESCROW_KEY_MISMATCH}
        '503': {description: PG_SYNC_SCOPE_LIMITED}
