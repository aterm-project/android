      responses:
        '200': {description: Signed report stored or exact retry, with already_applied and capability_report}
        '400': {description: INVALID_DEVICE_CAPABILITY_REPORT}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_REVOKED}
        '409': {description: DEVICE_CAPABILITY_REVISION_CONFLICT, DEVICE_CAPABILITY_REQUIRED, or VAULT_CLIENT_CAPABILITY_REQUIRED}
  /devices/redaction-capabilities:
    put:
      summary: Publish a device's signed sync-redaction protocol capability
      description: >-
        This route is implemented for SQLite and the restricted PostgreSQL runtime.
        SQLite black-box/OpenAPI acceptance and focused PostgreSQL HTTP/repository/auth
        acceptance have passed. It is the first protocol phase preceding permanent record purge. The authenticated
        active account and active registered device must be the account_id and device_id
        in the report. The device signs canonical UTF-8 JCS of exactly
        {format,account_id,device_id,revision,sync_redaction_version}, excluding signature,
        with its registered Ed25519 signing key. Require exactly one
        X-Atermius-Redaction-Marker header with value v1. After a report is stored,
        every authenticated request from that device must continue to send this marker.
        An authenticated request without exactly one v1 marker invalidates the active
        report while preserving its revision floor; publishing again requires a higher
        revision. Revisions are positive and strictly monotonic, may skip integers, and
        are bounded by 9007199254740991. An exact
        same-revision retry is idempotent only while that revision is active. If a request
        invalidated the report, the same revision cannot reactivate it; a higher revision
        is required. A lower revision or different signed report at the current revision
        returns DEVICE_REDACTION_CAPABILITY_REVISION_CONFLICT.
        A successful report records only the device's claimed protocol support. It does
        not prove redactions were received/applied, establish vault-wide compatibility,
        or itself authorize purge. The implemented Owner-only record-purge route
        independently rechecks every active device of every active Vault member for a
        current, signature-verified v1 report inside the Vault writer fence. Missing,
        invalidated, or incompatible reports block purge; offline active devices count.
      x-implementation-status: implemented for SQLite and restricted PostgreSQL; focused acceptance passed
      x-contract-tests-status: SQLite OpenAPI/device-capability and PostgreSQL HTTP/repository/auth acceptance passed
      x-contract-tests:
        - Reject missing, duplicate, malformed, or non-v1 X-Atermius-Redaction-Marker with 400 INVALID_REDACTION_MARKER; invalidate any existing report but preserve its revision floor, and require a higher revision to publish again.
        - Reject malformed fields, unknown fields, invalid JCS Ed25519 signatures, and report account/device IDs that differ from the authenticated principal with 400 INVALID_DEVICE_REDACTION_CAPABILITY_REPORT and no report mutation.
        - Reject a revoked device with 403 DEVICE_REVOKED; require the registered current device signing key for signature verification.
        - Accept a valid first report and a strictly higher revision; return the stored report and already_applied false for a new revision.
        - Return already_applied true for an exact same-revision retry while active; reject replay of an invalidated revision, a lower revision, and a changed valid same-revision report with 409 DEVICE_REDACTION_CAPABILITY_REVISION_CONFLICT.
        - Verify that a valid higher revision can reactivate a report after marker-based invalidation while preserving the revision watermark.
        - Verify report publication alone does not change record heads, tombstones, revision history, object references, or purge state.
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRedactionCapabilityReport'}
            examples:
              signedReport:
                summary: Device-signed redaction sync protocol capability
                value:
                  format: atermius-sync-redaction-capability-v1
                  account_id: 11111111-1111-4111-8111-111111111111
                  device_id: 22222222-2222-4222-8222-222222222222
                  revision: 1
                  sync_redaction_version: 1
                  signature: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: Report stored or exact active same-revision retry; focused SQLite and PostgreSQL acceptance passed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceRedactionCapabilityReportResult'}
              examples:
                stored:
                  value:
                    status: stored
                    already_applied: false
                    redaction_capability_report:
                      format: atermius-sync-redaction-capability-v1
                      account_id: 11111111-1111-4111-8111-111111111111
                      device_id: 22222222-2222-4222-8222-222222222222
                      revision: 1
                      sync_redaction_version: 1
                      signature: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        '400':
          description: Invalid required redaction marker or invalid signed report. An unmarked authenticated request invalidates any current report while preserving its revision floor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              examples:
                missingMarker:
                  summary: Required independent redaction marker is missing
                  value:
                    error:
                      code: INVALID_REDACTION_MARKER
                      message: Invalid redaction capability marker
                      request_id: 33333333-3333-4333-8333-333333333333
                invalidSignature:
                  summary: Signature does not verify against the registered device key
                  value:
                    error:
                      code: INVALID_DEVICE_REDACTION_CAPABILITY_REPORT
                      message: Invalid device redaction capability report
                      request_id: 33333333-3333-4333-8333-333333333333
        '401':
          description: Authentication failed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              example:
                error:
                  code: AUTH_REQUIRED
                  message: Authentication required
                  request_id: 33333333-3333-4333-8333-333333333333
        '403':
          description: Authenticated device is revoked or inactive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              example:
                error:
                  code: DEVICE_REVOKED
                  message: Device is revoked
                  request_id: 33333333-3333-4333-8333-333333333333
        '409':
          description: Revision moved backwards, was reused for different content, or attempts to reactivate an invalidated revision; the stored revision watermark is retained.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
              example:
                error:
                  code: DEVICE_REDACTION_CAPABILITY_REVISION_CONFLICT
                  message: Device redaction capability revision conflict
                  request_id: 33333333-3333-4333-8333-333333333333
  /devices/{id}/revoke:
    post:
      summary: Revoke a caller device
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Revoked device}}
  /vaults:
    get:
      summary: List accessible vaults and device key envelopes
      description: Includes active and deleting vaults for current active members. Each item includes role, status, required_record_schema, requested_at, purge_after, can_cancel, and can_write. In the SQLite runtime each item also has admin_visible (true when a credential escrow key exists and an active member account is admin_visible; clients show an administrator-visible badge). During deletion grace the encrypted vault is read-only and remains available for export. `required_record_schema` is raised atomically to 2 when a schema-2 record or conflict commits and never decreases.
      responses: {'200': {description: Vault lifecycle state, required_record_schema, and key envelopes}}
    post:
      summary: Create a client-keyed vault
      description: The top-level name_envelope must have the bounded v1 display envelope shape. New clients also sign the identical value at membership.manifest.display_name_envelope; older signed manifests may omit that inner field. The default account limit is 50 active membership Vaults (including deletion grace), configurable with ATERMIUS_MAX_VAULTS_PER_USER in the range 1–4096. The check runs in the creation transaction and returns USER_VAULT_LIMIT_REACHED without creating state when full.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault_id, name_envelope, key_envelope, membership]
              properties:
                vault_id: {type: string, format: uuid}
                name_envelope: {type: object}
                key_epoch: {type: integer, minimum: 1, description: Optional legacy duplicate of key_envelope.key_epoch}
                membership_version: {type: integer, minimum: 1, description: Optional legacy duplicate of membership.membership_version}
                key_envelope:
                  type: object
                  required: [recipient_device_id, key_epoch, membership_version, envelope, signature]
                  properties:
                    recipient_device_id: {type: string, format: uuid}
                    key_epoch: {type: integer, minimum: 1}
                    membership_version: {type: integer, minimum: 1}
                    envelope: {type: object}
                    signature: {type: string}
                membership:
                  type: object
                  required: [membership_version, previous_digest, manifest, signature]
                  properties:
                    membership_version: {type: integer, minimum: 1}
                    previous_digest: {type: [string, 'null']}
                    manifest: {type: object}
                    signature: {type: string}
      responses:
        '200': {description: Vault}
        '409': {description: USER_VAULT_LIMIT_REACHED}
  /vaults/{vault_id}/members:
    get:
      summary: List vault members
      description: Invited members include an invitation status and expiry, but never token material, key envelopes, or the server-only issuance_order. The server chooses the latest unaccepted invitation by issuance_order DESC, then creation timestamp and invitation ID; equal timestamps therefore use the higher order. Historical rows with NULL issuance_order cannot be ordered safely and return reissue_required with expires_at=null. A status is pending only while the selected invitation is unexpired, matches the active Vault epoch and membership version, and its recipient device is active. Expiry takes precedence over stale epoch/version status; a revoked or missing recipient device returns reissue_required with expires_at=null.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Vault members and non-secret invitation state
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [user_id, username, role, state, added_at, invitation]
                      properties:
                        user_id: {type: string, format: uuid}
                        username: {type: string}
                        role: {type: string, enum: [owner, editor, viewer]}
                        state: {type: string, enum: [active, invited, revoked]}
                        added_at: {type: string, format: date-time}
                        invitation:
                          oneOf:
                            - type: 'null'
                            - type: object
                              required: [status, expires_at]
                              properties:
                                status: {type: string, enum: [pending, expired, stale, reissue_required]}
                                expires_at: {type: [string, 'null'], format: date-time}
        '404': {description: Vault unavailable to caller}
  /vaults/{vault_id}/presence:
    get:
      summary: List online device leases for active members of a Vault
      description: >-
        Requires an active session and an active membership in this Vault. The
        session/device and membership are rechecked in the same read snapshot as
        the response. Only unexpired leases tied to active accounts, devices,
        sessions, and memberships are included. Multiple live sessions for one
        device collapse to one row. Presence is temporary operational state,
        is not part of encrypted-record history or the audit log, and has a
        fixed 90-second TTL. The response contains only opaque user/device IDs
        and last_seen_at; it does not echo the Vault ID and never contains
        Host, terminal, content, token, IP, or device-name fields.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Currently online member devices
          content:
            application/json:
              schema:
                type: object
                required: [devices, ttl_seconds]
                additionalProperties: false
                properties:
                  ttl_seconds: {type: integer, const: 90}
                  devices:
                    type: array
                    items:
                      type: object
                      required: [user_id, device_id, last_seen_at]
                      additionalProperties: false
                      properties:
                        user_id: {type: string, format: uuid}
                        device_id: {type: string, format: uuid}
                        last_seen_at: {type: string, format: date-time}
        '401': {description: Missing, expired, or revoked session}
        '403': {description: Authenticated device is revoked}
        '404': {description: Vault unavailable to caller}
    post:
      summary: Renew the authenticated device presence lease
      description: >-
        Requires an empty request body, active session/device, and current
        active Vault membership. The authenticated user, device, session, and
        access-token hash are derived exclusively from the bearer session.
        Session/device and membership checks plus the lease upsert share one
        writer transaction. The fixed lease expires after 90 seconds; clients
        should renew every 30 seconds while the Vault workspace is active.
        The persistent write-rate gate is keyed by (Vault, session), allowing
        an immediate Vault switch while accepting at most one heartbeat per
        key in each 5-second window. A faster repeat returns the fixed
        429 PRESENCE_HEARTBEAT_RATE_LIMITED with Retry-After: 5 and does not
        extend the lease. The Members view may still perform its separate GET.
        At most 8 live session leases per user and Vault and 100,000 live
        leases per instance are accepted. Capacity rejection is fixed as
        409 PRESENCE_LEASE_LIMIT. Expiration is always enforced by list and
        capacity queries; hourly/startup maintenance and the operator
        maintenance command physically remove expired or revoked leases and
        stale rate-gate rows. Heartbeats do not sweep the table. This temporary
        state is excluded from encrypted-record history and audit events. No
        Host, terminal, content, or caller-supplied principal fields are
        accepted.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Lease renewal deadline
          content:
            application/json:
              schema:
                type: object
                required: [expires_at, ttl_seconds]
                additionalProperties: false
                properties:
                  expires_at: {type: string, format: date-time}
                  ttl_seconds: {type: integer, const: 90}
        '400': {description: A heartbeat request body is not allowed}
        '409': {description: Presence lease capacity is full (PRESENCE_LEASE_LIMIT)}
        '429': {description: Heartbeat rate limited (PRESENCE_HEARTBEAT_RATE_LIMITED); Retry-After is 5 seconds}
        '401': {description: Missing, expired, or revoked session}
        '403': {description: Authenticated device is revoked}
        '404': {description: Vault unavailable to caller}
  /vaults/{vault_id}/terminal-sessions:
    post:
      summary: Create a signed encrypted terminal collaboration session
      description: >-
        Requires an active bearer session/device and active Vault membership.
        Enabled only when ATERMIUS_TERMINAL_COLLABORATION_ENABLED=true and
        ATERMIUS_PUBLIC_ORIGIN is configured. The host supplies a canonical
        session UUID, a UTC RFC3339 expiry no more than 15 minutes ahead, and
        one to eight explicitly approved active member devices with host-signed
        crypto_box_seal keyboxes. The server verifies the registered device
        Ed25519 signature and exact membership version but never opens or
        persists keyboxes or terminal data. Protocol v1 retains output-only
        observer behavior. Protocol v2 adds host-created short-lived input
        leases through the controller-lease routes; output remains on the
        existing observer socket. The response returns a one-use
        host ticket valid for at most 30 seconds and the collaboration path.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TerminalSessionCreate'}
      responses:
        '200':
          description: Ephemeral room and host WebSocket ticket
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session_id, expires_at, host_ticket, connect_path]
                properties:
                  session_id: {type: string, format: uuid}
                  expires_at: {type: string, format: date-time}
                  host_ticket: {type: string, minLength: 43, maxLength: 43}
                  connect_path: {type: string, const: '/collaboration/v1/connect'}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_REVOKED or TERMINAL_OBSERVER_NOT_AUTHORIZED}
        '404': {description: Vault not found or not an active member}
        '413': {description: Request exceeds the configured body limit}
        '422': {description: INVALID_ENVELOPE or invalid signed keybox}
        '429': {description: TERMINAL_TICKET_RATE_LIMITED}
        '503': {description: TERMINAL_COLLABORATION_DISABLED or TERMINAL_COLLABORATION_BUSY}
  /vaults/{vault_id}/terminal-sessions/{session_id}/ticket:
    post:
      summary: Issue a one-use ticket to an explicitly approved observer device
      description: >-
        Only an active member device present in the host's signed observer
        allowlist can issue its own ticket. Session, account, device, Vault
        membership, membership version, keybox grant and access-token expiry
        are checked while holding SQLite's writer order. The response includes
        the observer's signed keybox and a ticket deadline no more than 30
        seconds ahead.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Observer-specific keybox and one-use WebSocket ticket
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ticket, role, keybox, ticket_expires_at, connect_path]
                properties:
                  ticket: {type: string, minLength: 43, maxLength: 43}
                  role: {type: string, const: observer}
                  keybox: {$ref: '#/components/schemas/TerminalKeybox'}
                  ticket_expires_at: {type: string, format: date-time}
                  connect_path: {type: string, const: '/collaboration/v1/connect'}
        '401': {description: AUTH_REQUIRED}
        '404': {description: Unknown session, nonmember, or device not allowlisted}
        '429': {description: TERMINAL_TICKET_RATE_LIMITED}
        '503': {description: TERMINAL_COLLABORATION_DISABLED or TERMINAL_COLLABORATION_BUSY}
  /vaults/{vault_id}/terminal-sessions/{session_id}/controller-lease:
    post:
      summary: Grant a v2 controller lease to an approved observer device
      description: >-
        Only the original active host device may grant a lease in a protocol v2
        room. The target must be an explicitly approved observer and an active
        Vault member device. The signed control keybox binds the exact room,
        membership version, lease UUID, epoch, purpose and expiry; the server
        validates but never opens or stores its sealed secret. Epochs start at
        1 and increase exactly once per successful new lease. One lease may be
        active; an identical active grant retry is idempotent. Expiry must be a
        UTC RFC3339 timestamp representing a whole-second instant (any
        fractional component must be zero), after
        now, within five minutes, and no later than the session expiry. Clients
        round the deadline down before signing the keybox. Only the
        target's connected observer socket receives the v2 grant event. The
        host response contains lease metadata and does not echo the keybox.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TerminalControllerLeaseCreate'}
      responses:
        '200':
          description: Active lease metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalControllerLease'}
        '400': {description: INVALID_TERMINAL_CONTROLLER_LEASE or INVALID_ENVELOPE}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_REVOKED or TERMINAL_OBSERVER_NOT_AUTHORIZED}
        '404': {description: Session not found, non-host, or target not explicitly approved}
        '409': {description: TERMINAL_CONTROLLER_LEASE_ACTIVE or TERMINAL_CONTROLLER_EPOCH_INVALID}
        '422': {description: Invalid signed control keybox}
        '503': {description: TERMINAL_COLLABORATION_DISABLED or TERMINAL_COLLABORATION_BUSY}
    delete:
      summary: Revoke the active v2 controller lease
      description: >-
        Only the original active host device may revoke the lease. Revocation
        invalidates pending controller tickets, closes a connected controller
        socket with close code 4003 and reason CONTROL_REVOKED, and sends the
        host and exact target observer the three-field controller_lease_ended
        event with reason revoked. The host session and SSH connection remain
        active.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Lease revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: {status: {type: string, const: revoked}}
        '401': {description: AUTH_REQUIRED}
        '404': {description: Session or active lease not found, or caller is not the host device}
        '503': {description: TERMINAL_COLLABORATION_DISABLED}
  /vaults/{vault_id}/terminal-sessions/{session_id}/controller-lease/ticket:
    post:
      summary: Issue a one-use input ticket to the exact active lease device
      description: >-
        Only the controller account and device named by the active v2 lease may
        request an empty-body ticket. Ticket issuance and WebSocket consumption
        recheck the active login session, device, Vault membership version,
        lease ID, epoch and expiry. The response includes the signed
        control_keybox. Keep the existing observer WebSocket open for output;
        the controller WebSocket is a separate input-only channel. Revocation,
        expiry, disconnect, membership change or room stop invalidates pending
        tickets. Only one controller socket may attach to a lease.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Controller-specific ticket and signed control keybox
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalControllerTicket'}
        '401': {description: AUTH_REQUIRED}
        '404': {description: Unknown session, inactive lease, wrong device, or nonmember}
        '429': {description: TERMINAL_TICKET_RATE_LIMITED}
        '503': {description: TERMINAL_COLLABORATION_DISABLED or TERMINAL_COLLABORATION_BUSY}
  /vaults/{vault_id}/terminal-sessions/{session_id}:
    delete:
      summary: Stop a host-owned terminal observer session
      description: The original active host device closes the room and every connected observer; the room, tickets, keyboxes, and queued frames are process-memory-only and removed.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Session stopped
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, const: stopped}
        '401': {description: AUTH_REQUIRED}
        '404': {description: Session not found or caller is not its host device}
        '503': {description: TERMINAL_COLLABORATION_DISABLED}
  /vaults/{vault_id}/devices:
    get:
      summary: List public keys for current and historical vault member devices
      description: Also includes archived public signing/encryption keys still needed to validate signatures in surviving shared-vault ciphertext after an account is purged. Every row includes membership_status (active, invited, revoked, or archived) separately from device status. Active devices of active members include their signed capability_report, or null if none exists; missing reports count as v1 for record-schema compatibility. They also include redaction_capability_report, which is null if none is stored and otherwise carries the device-signed report plus its server-side invalidated_at timestamp. Clients verify that signature against the row's signing_public_key. Archived, revoked, and inactive-member devices do not count toward schema-2 or redaction-purge readiness. Archived items contain no account login identity, device name, token, credential or private material and cannot authenticate.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Vault-scoped public device directory with capability_report, redaction_capability_report, and membership_status per device; archived items have status and membership_status archived
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VaultDeviceDirectory'}
        '404': {description: Vault unavailable to caller}
  /vaults/{vault_id}/invitations:
    post:
      summary: Create a signed one-use vault invitation for a registered device
      description: The recipient encryption key must match the registered device key, and the signed membership grant must contain its matching base64url SHA-256 fingerprint. New clients include membership.manifest.display_name_envelope encrypted under the current epoch key; when present, its bounded v1 value is mirrored into the vault descriptor atomically with membership. Legacy invitations may omit it. Lifetime defaults to 604800 seconds and must be 60 through 2592000 seconds. The default Vault capacity is 100 active or invited members; ATERMIUS_MAX_MEMBERS_PER_VAULT accepts 1–1000. Invitation creation checks capacity in the writer transaction and returns VAULT_MEMBER_LIMIT_REACHED when full; revoked memberships do not count.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, recipient_device_id, recipient_encryption_public_key, key_envelope, membership]
              properties:
                role: {type: string, enum: [editor, viewer]}
                recipient_device_id: {type: string, format: uuid}
                recipient_encryption_public_key: {type: string}
                key_envelope: {type: object}
                membership: {type: object}
                expires_in_seconds: {type: integer, minimum: 60, maximum: 2592000, default: 604800}
      responses:
        '200': {description: Invitation token, shown once}
        '400': {description: Invalid invitation lifetime}
        '409': {description: VAULT_DELETION_PENDING, VAULT_MEMBER_LIMIT_REACHED, or concurrent membership change}
        '422': {description: Invalid recipient key, fingerprint, membership or envelope}
  /invitations/accept:
    post:
      summary: Accept a single-use invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, description: One-use invitation token shown to the recipient}
      description: Acceptance atomically checks both the account limit of 50 active membership Vaults (including deletion grace) and the target Vault limit of 100 active or invited members. Capacity is configurable by ATERMIUS_MAX_VAULTS_PER_USER (1–4096) and ATERMIUS_MAX_MEMBERS_PER_VAULT (1–1000); a full limit returns its stable 409 code without consuming the invitation.
      responses: {'200': {description: Accepted invitation}, '409': {description: INVITATION_STALE, VAULT_DELETION_PENDING, USER_VAULT_LIMIT_REACHED, or VAULT_MEMBER_LIMIT_REACHED}, '410': {description: Invitation expired}}
  /vaults/{vault_id}/membership:
    get:
      summary: Read signed membership manifest chain
      description: Every returned manifest record includes vault_id context, including legacy database rows normalized at read time. Signatures still cover only the JCS payload without signature; normalization never changes the stored digest or signed payload.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Membership chain
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MembershipChainPage'}
        '404': {description: Vault unavailable to caller}
  /vaults/{vault_id}/keys/rotate:
    post:
      summary: Submit a client-signed membership and key rotation
      description: The signed inner manifest must contain display_name_envelope encrypted with the requested new key epoch. The server validates its bounded v1 envelope shape and atomically stores it as the vault's current top-level name_envelope with the membership, ACL, epoch and key envelopes. The server cannot decrypt or verify which epoch key encrypted it.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_epoch, membership, key_envelopes]
              properties:
                new_epoch: {type: integer, minimum: 2}
                membership:
                  type: object
                  required: [membership_version, previous_digest, manifest, signature]
                  properties:
                    membership_version: {type: integer, minimum: 2}
                    previous_digest: {type: [string, 'null']}
                    signature: {type: string, minLength: 86, maxLength: 86}
                    manifest:
                      type: object
                      required: [key_epoch, members, signer_device_id, display_name_envelope]
                      properties:
                        key_epoch: {type: integer, minimum: 2}
                        members: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}
                        signer_device_id: {type: string, format: uuid}
                        display_name_envelope:
                          type: object
                          additionalProperties: false
                          required: [version, nonce, ciphertext]
                          properties:
                            version: {type: integer, const: 1}
                            nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$', description: Base64url without padding encoding exactly 24 bytes}
                            ciphertext: {type: string, minLength: 22, maxLength: 65536, pattern: '^[A-Za-z0-9_-]+$', description: Base64url without padding encoding 16 bytes through 48 KiB}
                key_envelopes: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}
      responses:
        '200': {description: New key epoch and membership version committed atomically}
        '409': {description: KEY_EPOCH_OUTDATED, MEMBERSHIP_VERSION_CONFLICT, or VAULT_DELETION_PENDING}
        '422': {description: Invalid signed membership, display name envelope, or key envelope set}
  /vaults/{vault_id}/ownership/transfer:
    post:
      summary: Transfer Vault ownership with an atomic signed key rotation
      description: >-
        Requires the current active Owner. new_owner_user_id must identify an existing active editor or viewer with at least one active device; invited, revoked, inactive, missing, and self targets are rejected. The old Owner remains an active editor. The owner-signed membership.manifest must contain exactly one active owner (the target) and ownership_transfer {from_user_id,to_user_id} matching the authenticated Owner and request target. The request advances membership version and key epoch by one, includes exactly one current-Owner-signed new-epoch key envelope for every active device in the retained signed membership, and may not combine unrelated role, invitation, or revocation changes. Membership, signed name envelope, ACL role changes, unique owner_user_id, epoch, and envelopes commit in one transaction; incomplete rotations do not update ownership. The service cannot decrypt or inspect the sealed key material.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_owner_user_id, new_epoch, membership, key_envelopes]
              properties:
                new_owner_user_id: {type: string, format: uuid}
                new_epoch: {type: integer, minimum: 2}
                membership:
                  type: object
                  required: [membership_version, previous_digest, manifest, signature]
                  properties:
                    membership_version: {type: integer, minimum: 2}
                    previous_digest: {type: [string, 'null']}
                    signature: {type: string, minLength: 86, maxLength: 86}
                    manifest:
                      type: object
                      required: [key_epoch, members, signer_device_id, display_name_envelope, ownership_transfer]
                      properties:
                        key_epoch: {type: integer, minimum: 2}
                        members: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}
                        signer_device_id: {type: string, format: uuid}
                        ownership_transfer:
                          type: object
                          additionalProperties: false
                          required: [from_user_id, to_user_id]
                          properties:
                            from_user_id: {type: string, format: uuid}
                            to_user_id: {type: string, format: uuid}
                        display_name_envelope:
                          type: object
                          additionalProperties: false
                          required: [version, nonce, ciphertext]
                          properties:
                            version: {type: integer, const: 1}
                            nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]{32}$'}
                            ciphertext: {type: string, minLength: 22, maxLength: 65536, pattern: '^[A-Za-z0-9_-]+$'}
                key_envelopes: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}
      responses:
        '200': {description: New sole Owner, membership version, key epoch, and envelopes committed atomically}
        '403': {description: Current active Owner membership and device are required}
        '409': {description: KEY_EPOCH_OUTDATED, MEMBERSHIP_VERSION_CONFLICT, OWNER_TRANSFER_TARGET_INVALID, OWNER_TRANSFER_STALE, or VAULT_DELETION_PENDING}
        '422': {description: Invalid signed owner transition or incomplete/invalid key envelope set}
  /vaults/{vault_id}:
    delete:
      summary: Begin or inspect the current owner-requested vault deletion grace period
      description: Requires an active Owner device and a fresh login_verifier proof. Each proof consumes the existing login rate-limit bucket before Argon2 verification and a 429 response includes Retry-After. Idempotent while pending; retries do not extend purge_after. The grace defaults to 604800 seconds and is bounded by ATERMIUS_VAULT_DELETION_GRACE_SECONDS (60..7776000). The master password is never sent.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_verifier]
              properties:
                login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte login verifier, base64url without padding; never a master password}
      responses:
        '200': {description: Deletion lifecycle DTO with vault_id, role, status, requested_at, purge_after, can_cancel, can_write}
        '401': {description: REAUTH_REQUIRED when the login verifier proof is invalid}
        '403': {description: Active Owner membership and device are required}
        '404': {description: Vault not found or not accessible}
        '409': {description: VAULT_DELETION_PENDING or concurrent lifecycle transition}
        '429': {description: RATE_LIMITED before verifier KDF; includes Retry-After}
  /vaults/{vault_id}/deletion/cancel:
    post:
      summary: Cancel a vault deletion before its purge deadline
      description: Requires an active Owner device and a fresh login_verifier proof. Each proof consumes the existing login rate-limit bucket before Argon2 verification and a 429 response includes Retry-After. Once purge_after is reached, cancellation fails even if maintenance has not yet purged the vault.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_verifier]
              properties:
                login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte login verifier, base64url without padding; never a master password}
      responses:
        '200': {description: Active vault lifecycle DTO with vault_id, role, status, requested_at, purge_after, can_cancel, can_write; repeated cancellation while active is idempotent}
        '401': {description: REAUTH_REQUIRED when the login verifier proof is invalid}
        '403': {description: Active Owner membership and device are required}
        '404': {description: Vault not found or not accessible}
        '409': {description: Concurrent lifecycle transition}
        '410': {description: VAULT_DELETION_WINDOW_EXPIRED after the deadline}
        '429': {description: RATE_LIMITED before verifier KDF; includes Retry-After}
  /vaults/{vault_id}/sync/push:
    post:
      summary: Atomic signed encrypted CAS batch
      description: Each signed header may include object_refs, a strictly ascending unique array of at most 1024 lowercase canonical UUID strings. Each reference must name a completed object in this vault. A revision_id is unique across the entire Vault because revision reads are addressed by vault_id and revision_id; reuse returns 409 REVISION_EXISTS. A delete revision fixes its restore_until deadline at commit time using its created_at and the effective restore-retention setting. Later configuration changes do not move that deadline. An explicit restore is a CAS against the current tombstone and is accepted only before restore_until; an expired restore returns 409 RECORD_RESTORE_EXPIRED with create_new_record recovery guidance and the exact restore_until (also exposed as the compatibility alias restore_expires_at). A record_schema 2 write is accepted only when every active device of every active vault member has a current verified capability report for schema 2, attachment manifest v2, and at least 1073741824 attachment bytes. On success the vault's required_record_schema is raised to 2 in the same transaction. Missing or incompatible reports return 409 VAULT_CLIENT_CAPABILITY_REQUIRED without committing any part of the batch. Unavailable, cross-vault, open, or expired objects return 409 OBJECT_REFERENCE_UNAVAILABLE without committing any part of the batch. Once any record in a Vault is redacted, sync payload writes require X-Atermius-Redaction-Marker (value v1). Success atomically stores revision references and cancels object GC deadlines. Exact retries remain idempotent.
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol_version, server_generation, vault_id, device_id, batch_id, operations]
              properties:
                protocol_version: {type: integer, minimum: 1}
                server_generation: {type: string, format: uuid}
                vault_id: {type: string, format: uuid}
                device_id: {type: string, format: uuid}
                batch_id: {type: string, format: uuid}
                operations:
                  type: array
                  items: {$ref: '#/components/schemas/SignedRecordEnvelope'}
      responses:
        '200': {description: Commit receipts}
        '409': {description: REVISION_CONFLICT, REVISION_EXISTS, RECORD_RESTORE_EXPIRED, idempotency error, OBJECT_REFERENCE_UNAVAILABLE, VAULT_CLIENT_CAPABILITY_REQUIRED, or VAULT_DELETION_PENDING}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED when this Vault contains a redacted record and the exact redaction marker is absent or invalid}
        '422': {description: INVALID_ENVELOPE for malformed or unsorted object_refs}
  /vaults/{vault_id}/records/{record_id}/purge:
    post:
      summary: Permanently purge an expired tombstone
      description: Implemented for SQLite and the restricted PostgreSQL runtime. Requires the active Vault owner, the exact redaction marker, and a request naming the current deleted revision and sequence. The request is accepted only after the tombstone's persisted restore_until deadline, every active device of every active Vault member has a currently active signature-verified sync_redaction_version 1 report, and the record has no unresolved conflicts. The transaction shares the Vault writer fence with sync writes and snapshots, invalidates and erases persisted snapshot pages first, preserves the graveyard and idempotency receipts, keeps sequence positions while scrubbing revision/event/conflict envelopes, removes only exact revision references, and starts the configured object GC grace only for objects with no remaining Vault reference. An exact retry returns the original proof. Automatic time-based tombstone purge is disabled. This guarantees removal from active server state; earlier encrypted backups and offline copies are outside the guarantee.
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: record_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordPurgeRequest'}
      responses:
        '200':
          description: Signed immutable redaction proof; exact retries return the original statement with a current-instance signature.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordPurgeResponse'}
        '400': {description: INVALID_PURGE_REQUEST, INVALID_REDACTION_MARKER, or invalid JSON}
        '403': {description: VAULT_OWNER_REQUIRED}
        '404': {description: Vault unavailable to caller}
        '409': {description: RECORD_PURGE_NOT_DUE, RECORD_DELETE_CHANGED, RECORD_NOT_PURGEABLE, RECORD_HAS_UNRESOLVED_CONFLICTS, REDACTION_REFERENCE_AMBIGUOUS, VAULT_REDACTION_CAPABILITY_REQUIRED, or RECORD_REDACTION_ID_MISMATCH}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED when a redaction already exists and the exact marker is absent}
  /vaults/{vault_id}/records/{record_id}/automatic-purge:
    put:
      summary: Set automatic-purge policy for the exact current tombstone
      description: >-
        Only the active Vault Owner may update the policy for the exact current retained tombstone identified by the
        path and expected deleted revision ID and sequence. The request also supplies the current policy revision as
        a compare-and-set value. A successful state change increments that revision and writes the Vault audit action
        `vault.record_auto_purge_opt_in_changed` with source `api`; repeating the current enabled value is idempotent
        and creates no duplicate audit event. The policy is stored per exact tombstone and defaults to disabled.
        Restoring the record removes that tombstone's policy; a later delete starts disabled at policy revision 0.
        Re-enabling after opting out increments the policy revision. An explicit purge consumes enabled consent and resets it to
        disabled. Setting consent does not move the immutable restore_until deadline or purge the record immediately.
        A device with a published redaction-capability report must send exactly one canonical v1 redaction marker on
        this authenticated request under the usual marker rule. PostgreSQL additionally requires the caller's current
        redaction-capability report when the Vault already contains a redacted record. Any future Maintenance purge
        must recheck this exact policy, the current tombstone and due deadline, active-device reports, conflicts,
        snapshots, object references, and the Vault writer fence in its purge transaction. No automatic purge worker
        or scheduler currently runs. Consent cannot erase offline device copies
        or earlier encrypted backups; restoring a pre-purge backup can restore ciphertext, and legacy backups without
        this exact consent state restore opted out.
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: record_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordAutomaticPurgePolicyRequest'}
      responses:
        '200':
          description: Exact tombstone policy state and current compare-and-set revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordAutomaticPurgePolicyResponse'}
        '400': {description: "INVALID_AUTO_PURGE_POLICY, INVALID_PURGE_REQUEST, INVALID_REDACTION_MARKER, or invalid JSON"}
        '403': {description: VAULT_OWNER_REQUIRED}
        '404': {description: Vault unavailable to caller}
        '409': {description: "RECORD_TOMBSTONE_CHANGED, RECORD_AUTO_PURGE_POLICY_REVISION_CONFLICT, or RECORD_AUTO_PURGE_POLICY_REVISION_EXHAUSTED"}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED when PostgreSQL requires a current report for a redacted Vault and the caller lacks one}
  /vaults/{vault_id}/changes:
    get:
      summary: Pull ordered encrypted change events
      description: Cursors are bound to the vault and server generation. The cursor is at most 2048 bytes and the complete raw query string is capped at 2112 bytes before authentication and query extraction; an oversized query returns 400 INVALID_CURSOR. In-bound requests authenticate and check active Vault membership before parsing the cursor. A single backend transaction checks membership and reads the high watermark, retention floor, redaction statements, and event rows; events are bounded by that high watermark. Every retained event for a redacted record is projected as the same signed record_redacted marker, with its original commit_seq and no envelope or revision_id. Once any record in a Vault is redacted, this route requires X-Atermius-Redaction-Marker (value v1). History is retained for 90 days by default (ATERMIUS_HISTORY_RETENTION_DAYS); cursors before the retained contiguous sequence prefix return 410 CURSOR_EXPIRED with snapshot recovery guidance. Local client outbox data must be preserved. The serialized JSON response is at most 4194304 bytes including its wrapper. The server returns at most 500 events and may return a shorter ordered prefix to fit the byte budget; next_cursor represents only the last returned event. A first event that cannot fit returns 413 PAYLOAD_TOO_LARGE without advancing the cursor.
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 2048, description: Authenticated opaque cursor; at most 2048 bytes}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        '200': {description: Change page; maximum serialized JSON size 4194304 bytes, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePage'}}}}
        '409': {description: VAULT_CLIENT_CAPABILITY_REQUIRED if a returned envelope uses schema 2 and marker is not v2}
        '404': {description: Vault unavailable to caller}
        '400': {description: INVALID_CURSOR; malformed, invalid, or overlong changes query}
        '410': {description: Cursor expired}
        '413':
          description: PAYLOAD_TOO_LARGE; one event exceeds the response page budget and the cursor did not advance
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncPageTooLargeError'}}}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no event or cursor is returned}
  /vaults/{vault_id}/snapshots:
    post:
      summary: Pin a current-head manifest and paired history boundaries
      description: Captures record high_watermark and conflict_high_watermark in the same writer transaction and persists an immutable, keyset-ordered union of current heads and redaction graveyard entries. Each record ID appears exactly once; graveyard entries contain the signed redaction proof and no payload. Returns item_count with both watermarks. Large manifests remain available through GET snapshot pages; only one item that cannot fit within a 4194304-byte page returns 413 without persisting a snapshot. Returns 409 VAULT_CLIENT_CAPABILITY_REQUIRED without creating a snapshot if its manifest contains schema-2 envelopes and the request marker is not v2. Once a redaction exists, requires X-Atermius-Redaction-Marker (value v1).
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Snapshot ID, both history watermarks, existing snapshot cursor and expiry
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_id, high_watermark, conflict_high_watermark, item_count, next_cursor, expires_at]
                properties:
                  snapshot_id: {type: string, format: uuid}
                  high_watermark: {type: string, pattern: '^[0-9]+$'}
                  conflict_high_watermark: {type: string, pattern: '^[0-9]+$'}
                  item_count: {type: integer, minimum: 0, description: Total distinct current-head and redacted graveyard items captured by this snapshot.}
                  next_cursor: {type: string}
                  expires_at: {type: string, format: date-time}
        '409': {description: VAULT_CLIENT_CAPABILITY_REQUIRED if the snapshot would contain a schema-2 envelope and marker is not v2}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; snapshot is not created}
        '400': {description: INVALID_CURSOR if the snapshot ID or query is invalid}
        '404': {description: Vault unavailable to caller or purged}
        '413':
          description: PAYLOAD_TOO_LARGE; one snapshot item cannot fit within the 4194304-byte page limit and the snapshot is not persisted
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncPageTooLargeError'}}}
  /snapshots/{snapshot_id}:
    get:
      summary: Get pinned encrypted snapshot manifest
      description: Without limit or page_cursor, returns the full immutable snapshot manifest and next_cursor at the fixed high_watermark. Its serialized response is limited to 4194304 bytes; larger manifests return 413 PAYLOAD_TOO_LARGE. Set limit from 1 to 500 to read a bounded keyset page; omit page_cursor for the first page. Continuations supply the returned opaque next_page_cursor; if page_cursor is supplied without limit, limit defaults to 100. Page responses include item_count, has_more, and next_page_cursor (null on the final page), and are limited to 4194304 serialized bytes. Each page is ordered by binary record_id and reads the immutable items captured when the snapshot was created. Page cursors are canonical HMAC tokens bound to snapshot, Vault, server generation, and the last returned record_id. New snapshots contain `kind=head` items with exact record_heads.commit_seq, or `kind=graveyard` items with deleted_revision_id, deleted_seq, and a signed redaction proof; record IDs are unique. Legacy snapshots may omit commit_seq and clients must preserve the unknown commit state. Legacy snapshots return conflict_high_watermark null and remain readable here; history page routes require a new snapshot in that case. A request without marker v2 receives 409 VAULT_CLIENT_CAPABILITY_REQUIRED if any page envelope uses schema 2. Once any Vault record is redacted, this route requires X-Atermius-Redaction-Marker (value v1). A snapshot invalidated by redaction returns 410 SNAPSHOT_REDACTED before reading its manifest. Expired or prior-generation snapshots return 410 SNAPSHOT_EXPIRED.
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: snapshot_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500}, description: Omit with page_cursor to preserve legacy full-manifest behavior. Defaults to 100 when page_cursor is supplied.}
        - {name: page_cursor, in: query, required: false, schema: {type: string, maxLength: 2048}, description: Omit for the first page; pass next_page_cursor for continuation.}
      responses:
        '200':
          description: Snapshot manifest and paired history watermarks
          content:
            application/json:
              schema:
                type: object
                required: [snapshot_id, server_generation, high_watermark, conflict_high_watermark, item_count, next_cursor, manifest, expires_at]
                properties:
                  snapshot_id: {type: string, format: uuid}
                  server_generation: {type: string, format: uuid, description: Current server generation bound to this snapshot page and its continuation cursors.}
                  high_watermark: {type: string, pattern: '^[0-9]+$'}
                  conflict_high_watermark: {type: [string, 'null'], pattern: '^[0-9]+$'}
                  item_count: {type: integer, minimum: 0, description: Total current-head items captured by this snapshot.}
                  next_cursor: {type: string}
                  manifest:
                    type: array
                    items:
                      oneOf:
                        - type: object
                          additionalProperties: false
                          required: [kind, record_id, revision_id, commit_seq, deleted, envelope]
                          properties:
                            kind: {type: string, const: head}
                            record_id: {type: string, format: uuid}
                            revision_id: {type: string, format: uuid}
                            commit_seq: {type: string, pattern: '^[1-9][0-9]*$', description: Exact positive current-head sequence. Omitted only by legacy snapshots; when present it cannot exceed high_watermark.}
                            deleted: {type: boolean}
                            envelope: {type: object, description: Signed encrypted record envelope, including its opaque header.}
                        - type: object
                          additionalProperties: false
                          required: [kind, record_id, deleted_revision_id, deleted_seq, redaction]
                          properties:
                            kind: {type: string, const: graveyard}
                            record_id: {type: string, format: uuid}
                            deleted_revision_id: {type: string, format: uuid}
                            deleted_seq: {type: string, pattern: '^[1-9][0-9]*$'}
                            redaction: {$ref: '#/components/schemas/RecordRedactionProof'}
                  expires_at: {type: string, format: date-time}
                  has_more: {type: boolean, description: Present in paged responses; false on the last page.}
                  next_page_cursor: {type: [string, 'null'], maxLength: 2048, description: Present in paged responses; null when has_more is false.}
        '410': {description: SNAPSHOT_EXPIRED or SNAPSHOT_REDACTED; redacted snapshots never return a short page or count mismatch}
        '400': {description: INVALID_CURSOR or INVALID_LIMIT; the complete raw query is limited to 2112 bytes}
        '404': {description: Snapshot unavailable to caller or Vault purged}
        '409': {description: VAULT_CLIENT_CAPABILITY_REQUIRED when a returned envelope requires schema-2 support}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no snapshot payload or continuation cursor is returned}
        '413':
          description: PAYLOAD_TOO_LARGE; full legacy response or a single page item exceeds the 4194304-byte response bound
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncPageTooLargeError'}}}
  /vaults/{vault_id}/revisions:
    get:
      summary: Read paginated immutable revision history
      description: >-
        Requires snapshot_id from a new paired snapshot. Returns revision history in ascending per-vault commit_seq order through that snapshot's high_watermark; later commits are excluded. `deleted` describes whether that historical revision is itself a tombstone. `restore_until` is optional RFC3339 date-time metadata: new servers return the fixed restore deadline for delete revisions and null for non-delete revisions; older servers may omit the field. The optional `auto_purge_enabled` boolean and canonical decimal-string `auto_purge_revision` are returned only for unredacted delete rows and are omitted for non-delete and redacted rows; older servers may omit them. They are current policy metadata, can change independently of the snapshot high watermark, and do not establish that a tombstone is currently purgeable. Legacy active database rows are backfilled from the policy the old server currently advertises, and legacy archive rows from the archived runtime policy. Redacted records retain their sequence rows but return operation `redacted`, envelope null, a null restore_until, and a signed redaction proof. A request without marker v2 receives 409 VAULT_CLIENT_CAPABILITY_REQUIRED if a returned envelope uses schema 2. Once any Vault record is redacted, this route requires X-Atermius-Redaction-Marker (value v1). A snapshot invalidated by redaction returns 410 SNAPSHOT_REDACTED. The serialized JSON response is at most 4194304 bytes including its wrapper. The server returns at most 500 events and may return a shorter ordered prefix to fit the byte budget; next_cursor represents only the last returned event. A first event that cannot fit returns 413 PAYLOAD_TOO_LARGE without advancing the cursor.
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/HistorySnapshot'}
        - {$ref: '#/components/parameters/HistoryCursor'}
        - {$ref: '#/components/parameters/HistoryLimit'}
      responses:
        '200': {description: Revision history page with fixed high_watermark and opaque next_cursor, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionHistoryPage'}}}}
        '400': {description: INVALID_CURSOR, INVALID_LIMIT, or INVALID_SNAPSHOT_ID}
        '409': {description: HISTORY_SNAPSHOT_INCOMPLETE or VAULT_CLIENT_CAPABILITY_REQUIRED}
        '404': {description: Vault unavailable to caller or purged}
        '410': {description: HISTORY_CURSOR_EXPIRED, SNAPSHOT_EXPIRED, or SNAPSHOT_REDACTED}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no revision page or cursor is returned}
        '413':
          description: PAYLOAD_TOO_LARGE; one event exceeds the response page budget and the cursor did not advance
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncPageTooLargeError'}}}
  /vaults/{vault_id}/revisions/{revision_id}:
    get:
      summary: Read an immutable encrypted revision
      description: Returns the exact signed opaque envelope. A request without marker v2 receives 409 VAULT_CLIENT_CAPABILITY_REQUIRED when the envelope uses schema 2. If the revision belongs to a redacted record, returns 410 RECORD_REDACTED with a signed proof and no envelope. Once any Vault record is redacted, this route requires X-Atermius-Redaction-Marker (value v1).
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: revision_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Revision envelope}
        '404': {description: Vault or revision unavailable to caller}
        '409': {description: VAULT_CLIENT_CAPABILITY_REQUIRED}
        '410': {description: RECORD_REDACTED; proof is in error.details.redaction and the envelope is omitted}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED}
  /vaults/{vault_id}/conflicts:
    get:
      summary: Read paginated encrypted conflict branches
      description: Requires the same snapshot_id as the revision history route. Returns conflict rows in ascending per-vault conflict_seq order through that snapshot's conflict_high_watermark. A branch created after that watermark is excluded; a resolution whose resolution_seq is later than the watermark is represented as unresolved on every page. Conflict creation and resolution allocate sequence values atomically. Redacted rows retain sequence metadata but return envelope null, resolved_revision_id null, and a signed redaction proof. A request without marker v2 receives 409 VAULT_CLIENT_CAPABILITY_REQUIRED if a returned envelope uses schema 2. Once any Vault record is redacted, this route requires X-Atermius-Redaction-Marker (value v1). A snapshot invalidated by redaction returns 410 SNAPSHOT_REDACTED. The serialized JSON response is at most 4194304 bytes including its wrapper. The server returns at most 500 events and may return a shorter ordered prefix to fit the byte budget; next_cursor represents only the last returned event. A first event that cannot fit returns 413 PAYLOAD_TOO_LARGE without advancing the cursor.
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/HistorySnapshot'}
        - {$ref: '#/components/parameters/HistoryCursor'}
        - {$ref: '#/components/parameters/HistoryLimit'}
      responses:
        '200': {description: Conflict history page with fixed high_watermark and opaque next_cursor, content: {application/json: {schema: {$ref: '#/components/schemas/ConflictHistoryPage'}}}}
        '400': {description: INVALID_CURSOR, INVALID_LIMIT, or INVALID_SNAPSHOT_ID}
        '409': {description: HISTORY_SNAPSHOT_INCOMPLETE or VAULT_CLIENT_CAPABILITY_REQUIRED}
        '404': {description: Vault unavailable to caller or purged}
        '410': {description: HISTORY_CURSOR_EXPIRED, SNAPSHOT_EXPIRED, or SNAPSHOT_REDACTED}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no conflict page or cursor is returned}
        '413':
          description: PAYLOAD_TOO_LARGE; one event exceeds the response page budget and the cursor did not advance
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncPageTooLargeError'}}}
    post:
      summary: Store an encrypted conflict branch
      description: >-
        Request body is {envelope: Envelope}. The signed header.op_id is the
        idempotency key scoped to vault and device: identical JCS digests
        return the existing conflict_id without allocating a sequence or
        writing references again; a changed digest for the same key returns
        IDEMPOTENCY_KEY_REUSED. Signed header.object_refs follows the same
        format as record pushes; each object must be completed in this vault.
        References are stored atomically with the branch and cancel pending
        GC. record_schema 2 branches use the same all-active-reader capability
        gate as sync push and atomically raise required_record_schema to 2.
        Once a record is redacted, conflict creation requires the exact
        X-Atermius-Redaction-Marker (value v1) before storing branch payload.
      parameters:
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope: {$ref: '#/components/schemas/SignedRecordEnvelope'}
      responses:
        '200': {description: Conflict reference}
        '400': {description: Invalid vault identifier or request}
        '401': {description: Authentication required}
        '403': {description: Device or vault access denied}
        '404': {description: Vault unavailable to caller}
        '409': {description: OBJECT_REFERENCE_UNAVAILABLE, IDEMPOTENCY_KEY_REUSED, VAULT_CLIENT_CAPABILITY_REQUIRED, or VAULT_DELETION_PENDING}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no conflict branch is stored}
        '413': {description: Request body exceeds configured limit}
        '422': {description: INVALID_ENVELOPE for malformed or unsorted object_refs}
  /vaults/{vault_id}/conflict-changes:
    get:
      summary: Read incremental conflict creation and resolution events
      description: Every page is read under one vault membership check and one database transaction. Events are ordered by the per-vault append-only conflict sequence and bounded by the page's high_watermark. Omit both after_seq and server_generation for the first page; every continuation that explicitly supplies after_seq, including after_seq 0, must send the server_generation returned by the preceding page. A generation mismatch returns 410 and requires restarting from the first page. Creation events include the exact signed encrypted envelope; resolution events omit it. Redacted records project every retained creation and resolution position as the strict `{seq,type:redacted,conflict_id,record_id,redaction}` shape. A request without marker v2 receives 409 VAULT_CLIENT_CAPABILITY_REQUIRED if a returned creation event uses schema 2. Once any Vault record is redacted, this route requires X-Atermius-Redaction-Marker (value v1). The serialized JSON response is at most 4194304 bytes including its wrapper. The server returns at most 500 events and may return a shorter ordered prefix to fit the byte budget; next_after_seq represents only the last returned event. A first event that cannot fit returns 413 PAYLOAD_TOO_LARGE without advancing after_seq.
      parameters:
        - {$ref: '#/components/parameters/ClientCapabilityMarker'}
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after_seq, in: query, required: false, description: Canonical non-negative decimal string; defaults to 0, schema: {type: string, pattern: '^(0|[1-9][0-9]*)$', default: '0'}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: server_generation, in: query, required: false, description: Returned by the preceding page and required whenever after_seq is explicitly supplied, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Incremental conflict event page, content: {application/json: {schema: {$ref: '#/components/schemas/ConflictChangesPage'}}}}
        '400': {description: INVALID_AFTER_SEQ, INVALID_LIMIT, INVALID_SERVER_GENERATION, or SERVER_GENERATION_REQUIRED}
        '404': {description: Vault unavailable to caller or purged}
        '410': {description: CONFLICT_FEED_GENERATION_CHANGED or CONFLICT_FEED_SEQUENCE_AHEAD; restart at after_seq 0}
        '409': {description: VAULT_CLIENT_CAPABILITY_REQUIRED}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no event or sequence cursor is returned}
        '413':
          description: PAYLOAD_TOO_LARGE; one event exceeds the response page budget and after_seq did not advance
          content: {application/json: {schema: {$ref: '#/components/schemas/SyncPageTooLargeError'}}}
  /vaults/{vault_id}/conflicts/{conflict_id}/resolve:
    post:
      summary: Attach a committed main revision to a conflict
      description: The first success atomically allocates resolution_seq and resolution_at, writes one `vault.conflict_resolved` Vault audit event, and returns already_resolved false. The event is in the resolution transaction and stores only the conflict UUID plus authenticated actor metadata; an audit insert failure rolls back the resolution. The incremental conflict feed uses resolution_at for its resolved event. Repeating the same resolved_revision_id returns the original sequence with already_resolved true and does not add another audit event, even if the main head has since advanced; a different revision returns CONFLICT_ALREADY_RESOLVED. Once any Vault record is redacted, resolution writes require X-Atermius-Redaction-Marker (value v1).
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: vault_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: conflict_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved_revision_id]
              properties:
                resolved_revision_id: {type: string, format: uuid}
      responses:
        '200':
          description: Resolution or idempotent retry
          content:
            application/json:
              schema:
                type: object
                required: [status, resolved_revision_id, resolution_seq, already_resolved]
                properties:
                  status: {type: string, const: resolved}
                  resolved_revision_id: {type: string, format: uuid}
                  resolution_seq: {type: string, pattern: '^[0-9]+$'}
                  already_resolved: {type: boolean}
        '409': {description: VAULT_DELETION_PENDING or CONFLICT_ALREADY_RESOLVED}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; conflict state is unchanged}
  /vaults/{vault_id}/uploads/init:
    post:
      summary: Reserve or resume an immutable encrypted object upload
      description: >-
        Reserves quota for 24 hours. For the same authenticated user and
        (vault_id, object_id, size, sha256), a repeated request while an open
        reservation is unexpired returns its existing upload_id and expiry;
        it does not add another quota reservation. SHA-256 comparison is
        case-insensitive. Reusing an active object_id with different metadata
        returns UPLOAD_RESERVATION_CONFLICT. If another member owns an active
        reservation for that object_id, the server returns UPLOAD_IN_PROGRESS
        without disclosing its upload_id. Expired reservations are retired and
        their chunk bytes removed before a new reservation is made. Existing
        completed object IDs return OBJECT_EXISTS. There is no abort endpoint;
        a client-side discard leaves quota reserved until expiry. Once any
        Vault record is redacted, requires the exact
        X-Atermius-Redaction-Marker (value v1) before reserving quota.
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - name: vault_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [object_id, size, sha256]
              properties:
                object_id: {type: string, format: uuid}
                size: {type: integer, minimum: 1}
                sha256: {type: string, pattern: '^[0-9A-Fa-f]{64}$'}
      responses:
        '200':
          description: New or reused user-bound upload reservation
          content:
            application/json:
              schema:
                type: object
                required: [upload_id, chunk_size, expires_at]
                properties:
                  upload_id: {type: string, format: uuid}
                  chunk_size: {type: integer, const: 1048576}
                  expires_at: {type: string, format: date-time}
        '403': {description: Viewer role cannot upload}
        '404': {description: Vault is unavailable to this caller}
        '409': {description: VAULT_DELETION_PENDING, UPLOAD_RESERVATION_CONFLICT, UPLOAD_IN_PROGRESS, or OBJECT_EXISTS}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no upload reservation is created}
        '413': {description: Object exceeds the configured maximum}
        '507': {description: QUOTA_EXCEEDED}
  /uploads/{upload_id}/chunks/{index}:
    put:
      summary: Upload one immutable object chunk
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: upload_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: index, in: path, required: true, schema: {type: integer, minimum: 0}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, description: One non-empty chunk, at most 1048576 bytes}
      responses: {'200': {description: Chunk receipt}, '409': {description: VAULT_DELETION_PENDING or immutable chunk conflict}, '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; upload_id resolves to its owning Vault and the chunk is not accepted}}
  /uploads/{upload_id}/complete:
    post:
      summary: Verify and finalize encrypted object
      description: Completed object gets a delayed GC deadline. Temporary chunk payloads are deleted atomically with finalization. A completed upload whose unreferenced object was collected returns 410 OBJECT_COLLECTED on retries. Once any Vault record is redacted, requires X-Atermius-Redaction-Marker (value v1); upload_id resolves to its owning Vault before completion.
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - {name: upload_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Object receipt}
        '409': {description: VAULT_DELETION_PENDING or upload integrity/state conflict}
        '410': {description: UPLOAD_EXPIRED or OBJECT_COLLECTED}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; upload completion is not published}
  /vaults/{vault_id}/objects/{object_id}:
    get:
      summary: Download encrypted object or one byte range
      description: >-
        Requires current vault authorization. Responses preserve the opaque bytes and include a strong SHA-256 ETag and Accept-Ranges: bytes. Without Range the full object is returned as 200. One Range of bytes=start-end, bytes=start-, or bytes=-suffix-length is supported and returns 206; the requested end is clipped to the object size. Unknown Range units are ignored and return the full object. Malformed or unsatisfiable byte ranges, repeated Range headers, and multi-range requests return an empty 416 response with Content-Range: bytes */size. If-Range is honored only for one exact strong ETag; a stale, weak, date, or repeated validator ignores Range and returns the full 200 response. SQLite returns bytes only when the Vault has a live object reference, or when the authenticated uploader owns an unexpired completed reservation for that still-available object (the retry path that verifies upload completion before the signed revision links it). Expired or collected reservations, foreign users, and arbitrary unreferenced object IDs receive NOT_FOUND even while delayed-GC bytes remain physically stored. PostgreSQL must match this policy; its parity is pending. Once any Vault record is redacted, the exact X-Atermius-Redaction-Marker (value v1) is required before an object lookup or body is returned.
      parameters:
        - {$ref: '#/components/parameters/ClientRedactionMarker'}
        - name: vault_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: object_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Range
          in: header
          required: false
          description: One byte range only; comma-separated ranges are rejected with 416.
          schema: {type: string, example: 'bytes=0-65535'}
        - name: If-Range
          in: header
          required: false
          description: A matching strong ETag honors Range; other validators cause a full 200 response.
          schema: {type: string}
      responses:
        '200':
          description: Complete opaque object
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            ETag: {schema: {type: string}}
            Content-Length: {schema: {type: integer}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Requested opaque byte range
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Range: {schema: {type: string, example: 'bytes 0-65535/1048576'}}
            Content-Length: {schema: {type: integer}}
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {description: AUTH_REQUIRED}
        '404': {description: Vault/object unavailable, or no live reference/valid owner-bound upload retry grant; foreign resources remain indistinguishable}
        '426': {description: CLIENT_REDACTION_CAPABILITY_REQUIRED; no object bytes or range metadata are returned}
        '416':
          description: Invalid, unsupported, or unsatisfiable range; body is empty
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
            Content-Range: {schema: {type: string, example: 'bytes */1048576'}}
            Content-Length: {schema: {type: integer, const: 0}}
            ETag: {schema: {type: string}}
  /relay/tickets:
    post:
      summary: Create a short-lived SSH Relay ticket
      description: >-
        Requires the current bearer session and matching active device. Relay must be explicitly enabled with ATERMIUS_RELAY_ENABLED=true, non-empty ATERMIUS_RELAY_ALLOW_CIDRS and ATERMIUS_RELAY_ALLOW_PORTS allowlists, and ATERMIUS_PUBLIC_ORIGIN. The port list is a comma-separated set of exact destination ports from 1 through 65535; malformed lists fail closed and leave Relay disabled. target_host may be an IP literal or a DNS hostname using ASCII IDNA A-label syntax (maximum 253 normalized bytes; one terminal root dot may make the request value 254 bytes; DNS labels are 1..63 ASCII characters). A single terminal dot is normalized away and ASCII letters are lowercased. The service resolves A and AAAA candidates once, with a two-second timeout and a maximum of 32 addresses. At most 32 DNS resolutions run concurrently; saturated resolver capacity returns 503 RELAY_BUSY without queueing. It inspects every answer and selects the first address allowed by the effective deployment, instance, authenticated-user, and all assigned server-managed group CIDR/port intersection plus special-address deny rules. The selected IP, not the hostname, is encrypted into the one-use ticket and is the only address used for dialing, so later DNS changes cannot retarget an issued ticket. Invalid hostname syntax or port zero returns 400 INVALID_TARGET; no DNS answers, resolver errors/timeouts, or answer-limit overflow return 502 TARGET_RESOLUTION_FAILED without echoing the hostname; if no resolved candidate is allowed, the response is 403 TARGET_DENIED. target_port must exactly match the effective port policy. The authenticated user ID is derived from the live bearer session; unknown request properties such as a caller-selected user_id are rejected. Loopback, unspecified, link-local, multicast, broadcast, and known cloud metadata addresses including Alibaba Cloud 100.100.100.200 remain blocked even inside an allowlisted CIDR. Ticket lifetime is at most 30 seconds and cannot exceed the exact session access expiry. Tickets are one-use, stored by hash, bound to user/device/session, and issuance writes a privacy-safe relay.ticket_issued audit event in the same transaction. The server allows 20 issues per user per minute and 100000 recent ticket rows globally.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RelayTicketRequest'}
      responses:
        '200':
          description: Ticket created; response never contains target metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RelayTicket'}
        '400': {description: INVALID_TARGET}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_REVOKED or TARGET_DENIED}
        '429': {description: RELAY_RATE_LIMITED with Retry-After}
        '422': {description: Request body contains unsupported properties}
        '502': {description: TARGET_RESOLUTION_FAILED; resolution failed, timed out, returned no candidates, or exceeded the bounded answer count}
        '503': {description: RELAY_DISABLED or RELAY_BUSY (including saturated bounded DNS resolution capacity)}
  /relay/v1/connect:
    servers:
      - url: /
    get:
      summary: Open an SSH Relay WebSocket
      security: []
      description: >-
        This route is outside the /api/v1 prefix. Upgrade requires exactly one Origin header equal to ATERMIUS_PUBLIC_ORIGIN. Within 10 seconds, the first text or binary frame must be the raw canonical base64url-no-pad ticket (32 decoded bytes), not JSON. The destination is bound into the ticket and cleared as soon as it is atomically consumed. A DNS hostname is resolved once during ticket issuance; all bounded A/AAAA answers are checked and only an allowed resolved IP is pinned into the ticket. The WebSocket dial uses that pinned IP without another DNS lookup, preventing post-issuance DNS changes from retargeting the connection. Session/device/account state is rechecked before dialing and every two seconds during forwarding, including while socket writes are backpressured. Each pending TCP/WebSocket write is bounded to 30 seconds, each session query to five seconds, and TCP half-close to two seconds. The server forwards opaque bytes only, limits a connection to one hour and 1 GiB total, and audits a successful TCP connection as relay.connected without target or SSH content. Membership or policy changes for any assigned server-managed access group advance the user's authorization revision, revoke unused tickets, and close the user's current Relay sockets on the next authorization poll even if the updated policy still permits the same destination.
      x-websocket-first-frame: raw-base64url-ticket
      x-websocket-origin: exactly-one-configured-public-origin
      responses:
        '101': {description: WebSocket upgraded after Origin validation}
        '403': {description: ORIGIN_DENIED}
        '503': {description: RELAY_DISABLED}
  /notifications/tickets:
    post:
      summary: Create a one-use WebSocket authentication ticket
      description: Requires the current bearer session. The request has no fields. The random 32-byte ticket is returned once, stored only as a SHA-256 hash, expires within 30 seconds or with the session, and is bound to the exact session access-expiry value and server generation. Multiple independent tickets are allowed for browser tabs. Notifications must be enabled by ATERMIUS_PUBLIC_ORIGIN.
      responses:
        '200':
          description: Ticket response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationTicket'}
        '401': {description: AUTH_REQUIRED}
        '429': {description: NOTIFICATION_TICKET_RATE_LIMITED with Retry-After}
        '503': {description: NOTIFICATIONS_DISABLED or NOTIFICATIONS_BUSY}
  /notifications/push-endpoints/{device_id}:
    put:
      summary: Register the current device's optional mobile push endpoint
      description: >-
        Requires the bearer session and exact current device ID. The provider token is opaque,
        encrypted at rest, never returned, and never included in logs or sync hints. Registration
        is available independently for each provider only when that provider has valid startup
        configuration. FCM HTTP v1 requires ATERMIUS_FCM_SERVICE_ACCOUNT_FILE to reference an
        absolute owner-only Google service-account JSON file. Direct APNs requires
        ATERMIUS_APNS_PRIVATE_KEY_FILE to reference an absolute owner-only P-256 .p8 key plus
        ATERMIUS_APNS_TEAM_ID, ATERMIUS_APNS_KEY_ID, and ATERMIUS_APNS_TOPIC; setting
        ATERMIUS_APNS_USE_SANDBOX=true selects Apple's fixed sandbox host, otherwise the fixed
        production host is used. An unavailable selected provider returns 503
        PUSH_DELIVERY_DISABLED and stores no token. Both providers send only a generic
        sync_available hint (APNs uses a background content-available payload); delivery is
        at-least-once and existing WebSocket and polling sync remain the source of truth.
      parameters:
        - name: device_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MobilePushEndpointRequest'}
      responses:
        '200':
          description: Endpoint registered without returning the provider token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobilePushEndpointResponse'}
        '400': {description: INVALID_PUSH_ENDPOINT}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_MISMATCH or DEVICE_REVOKED}
        '409': {description: PUSH_ENDPOINT_IN_USE}
        '415': {description: Unsupported request content type}
        '422': {description: Malformed JSON, unknown fields, or invalid provider enum rejected by the JSON extractor}
        '503': {description: PUSH_DELIVERY_DISABLED when the selected provider is unavailable or unsupported}
  /notifications/push-endpoints/{device_id}/{provider}:
    delete:
      summary: Remove the current device's mobile push endpoint
      description: >-
        Requires the bearer session and exact current device ID. Removing an absent endpoint is
        idempotent. Endpoint removal remains available when push delivery is disabled. The provider
        path is fcm_v1 or apns.
      parameters:
        - name: device_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: provider
          in: path
          required: true
          schema: {type: string, enum: [fcm_v1, apns]}
      responses:
        '200':
          description: Endpoint removed or already absent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MobilePushEndpointResponse'}
        '400': {description: INVALID_PUSH_PROVIDER}
        '401': {description: AUTH_REQUIRED}
        '403': {description: DEVICE_MISMATCH or DEVICE_REVOKED}
  /notifications:
    get:
      summary: WebSocket invalidation channel
      description: >-
        Upgrade requires exactly one Origin header matching ATERMIUS_PUBLIC_ORIGIN. First frame is text JSON {type: authenticate, ticket: ...}, within 10 seconds and 2048 bytes. The server replies with ready, then only sync_required invalidation frames; pull APIs remain authoritative and no record/ciphertext data is sent. Server pings every 30 seconds; client responds with Pong. Session, device, account and membership are rechecked every 2 seconds. Every outbound WebSocket write has a 1-second deadline; a timed-out or failed write drops the connection so a slow consumer cannot hold notification capacity or suspend authorization polling indefinitely. Limits are 256 global connections, 8 per user, 4 per session, 32 concurrent poll queries, and 4096 vaults per connection. Close 4001 means ticket/session authentication failed; 4008 means per-user/session capacity; 1008 means protocol or subscription policy violation; 1011 means transient server failure. Obtain a fresh ticket for every reconnect.
      x-websocket-first-frame: {type: authenticate, ticket: base64url-no-pad-32-bytes}
      x-websocket-server-frames:
        ready: {type: ready, server_generation: uuid, sync_required: true, heartbeat_seconds: 30, poll_interval_seconds: 2}
        sync_required_record: {type: sync_required, vault_id: uuid, commit_seq: decimal-string}
        sync_required_conflict: {type: sync_required, vault_id: uuid, conflict_seq: decimal-string}
        sync_required_membership: {type: sync_required, vault_id: null, commit_seq: null}
        error: {type: error, code: AUTH_REQUIRED-or-NOTIFICATIONS_BUSY-or-NOTIFICATIONS_LIMIT-or-INTERNAL}
      responses:
        '101': {description: WebSocket upgraded after origin validation}
        '403': {description: ORIGIN_DENIED}
        '503': {description: NOTIFICATIONS_DISABLED or NOTIFICATIONS_BUSY}
  /collaboration/v1/connect:
    servers:
      - url: /
    get:
      summary: Encrypted terminal collaboration WebSocket
      security: []
      description: >-
        Outside the /api/v1 prefix. Enabled only by
        ATERMIUS_TERMINAL_COLLABORATION_ENABLED=true and
        ATERMIUS_PUBLIC_ORIGIN. Upgrade requires exactly one Origin equal to
        the configured origin. Within ten seconds, the first text message must
        be {type:authenticate,ticket:<canonical base64url 32-byte ticket>}.
        Tickets are single-use, hash-only, memory-only, and bound to active
        session/device/account/Vault membership and server generation. The
        server sends the v1 host/observer authentication acknowledgement, or
        the v2 controller acknowledgement including lease_id and control_epoch.
        Hosts may send signed opaque recipient-bound output/resize frames; the
        server verifies host Ed25519 signatures and context, caps JSON messages
        at 64 KiB, ciphertext at 16 KiB plus tag, lifetime room bytes at 256
        MiB, frame rate at 256/second and bytes at 4 MiB/second, and sends over
        32-frame bounded observer queues. V1 observer application messages are
        rejected. A frame sequence is at most 9007199254740991; the first
        sequence delivered to a late observer may be any positive value, then
        it advances by one per target and kind. The server retains no output
        history and may cache only the latest opaque signed resize frame per
        approved observer, queued immediately after its authentication ack.
        In v2, a controller socket may send signed encrypted input frames up
        to 8 KiB plaintext and 128 frames/64 KiB per second; the server routes
        these only to the host over a bounded queue and sends no host output on
        the controller socket. The target's observer socket remains the output
        path. Only that exact observer socket receives grant/end lifecycle
        events. Account/device/session/Vault membership is writer-ordered
        rechecked every two seconds. Host disconnect, expiry, stop or Vault
        membership-version change closes the room. No frame/keybox/ticket is
        persisted. Server restart ends all rooms.
      x-websocket-first-frame: {type: authenticate, ticket: base64url-no-pad-32-bytes}
      x-websocket-server-frames:
        authenticated: {type: authenticated, role: host-or-observer, session_id: uuid}
        frame: {type: frame, frame: opaque-signed-terminal-frame-v1}
        controller_authenticated: {type: authenticated, role: controller, session_id: uuid, lease_id: uuid, control_epoch: integer}
        controller_lease_granted: {type: controller_lease_granted, session_id: uuid, lease_id: uuid, control_epoch: integer, expires_at: date-time}
        controller_lease_ended: {type: controller_lease_ended, lease_id: uuid, reason: revoked-or-expired-or-controller_disconnected}
      x-websocket-frame-schema: {$ref: '#/components/schemas/TerminalFrame'}
      x-websocket-controller-frame-schema: {$ref: '#/components/schemas/TerminalInputFrame'}
      responses:
        '101': {description: WebSocket upgraded after exact-origin validation}
        '403': {description: ORIGIN_DENIED}
        '503': {description: TERMINAL_COLLABORATION_DISABLED or TERMINAL_COLLABORATION_BUSY}
  /audit:
    get:
      summary: List authorized audit metadata
      description: Account-scope rows are visible only to their account. Vault-scope rows are visible only to current active Owner and Editor members; viewers and nonmembers receive no such rows. Every page rechecks membership. The signed cursor binds requester, server generation, fixed high-water mark and last event ID. Rows contain only opaque IDs and fixed labels, never source IP, User-Agent, host/command data, usernames, login verifiers, request content, tokens, envelopes or ciphertext. Account scopes are stored as a domain-separated HMAC. Actor IDs, account/account-recovery/device/membership/session resource IDs, and session-family resource IDs are cleared when the owning account is permanently purged; actor IDs are also cleared on Vault purge. Vault resource IDs in the purged account's own account-scope rows (such as `account.credential_viewed_by_admin`) are cleared as well. Committed events include password-change outcomes (`auth.password_changed` on success and attributable `auth.password_change_failed` on rejected current verifier) and successful Relay operations (`relay.ticket_issued`, `relay.connected`), along with account and device lifecycle, Recovery configuration/envelope changes (`auth.account_recovery_enabled`, `auth.account_recovery_rotated`, `auth.account_recovery_disabled`, `auth.account_recovery_key_envelopes_updated`) and completion (`auth.account_recovered`), optional TOTP MFA challenge/enrollment/recovery-code rotation/disable (`auth.mfa_login_challenge_created`, `auth.mfa_totp_enabled`, `auth.mfa_recovery_codes_rotated`, `auth.mfa_totp_disabled`) and full-Recovery reset (`auth.mfa_reset_by_recovery`) and restore-state invalidation (`auth.mfa_state_reset_by_restore`), self logout (`auth.logout_succeeded`), Vault invitation/member/key rotation, conflict resolution, and Vault deletion. The first successful conflict resolution writes one `vault.conflict_resolved` Vault-scope success event in the same transaction with the authenticated actor, `resource_type=conflict`, and only the opaque conflict UUID as resource_id; retries, stale/unauthorized attempts, and failed resolutions emit no event, while an audit insert failure rolls back resolution. No record ID, revision ID, envelope, ciphertext, or payload is included. Recovery actions use account scope, success result and account/device actors; configuration/envelope actions use `resource_type=account_recovery`, while completion uses `resource_type=account`. Their resource IDs contain only the account ID and are cleared on permanent account purge. Recovery audit writes share a transaction with the state and receipt changes, and include no recovery code, credential, key envelope, host data or request body. Logout writes its opaque session resource ID in the same transaction that revokes the authenticated session; audit failure rolls back both changes, while unauthenticated or invalid logout attempts are not recorded. Login success/failure use fixed `auth.login_succeeded`/`auth.login_failed` actions and `success`/`failure` results. A replayed consumed refresh token emits at most one `auth.refresh_reuse_detected` failure event when it revokes at least one session-family row whose revoked_at is null; the account-scoped event has null actor IDs and only a random family UUID, never the reused token, account/device identifier, or request metadata. Audit insertion for this event is best effort; if the audit INSERT fails but the transaction commits, family revocation remains and the replay returns 401; if the transaction commit fails, the endpoint returns 500 INTERNAL and the revocation outcome is unknown. Replays after revocation and unknown tokens are not recorded. Unknown and non-active account login attempts are not recorded and retain the same external AUTH_REQUIRED response as a wrong verifier. Signed membership changes use one fixed `vault.member_role_changed` event per changed role or `vault.member_revoked` event per newly revoked member, with the opaque target account ID as the membership resource. A sync push that commits at least one new operation emits at most one `vault.sync_batch_committed` Vault-scope event with the authenticated actor, `resource_type=sync_batch`, and null `resource_id`; it contains no operation or record identifiers, revision, operation type/count, ciphertext, or request payload. Empty, failed, and fully idempotent pushes emit no event. A mixed batch emits one event only when at least one operation is newly committed. The audit insert shares the push transaction, so an insert failure rolls back the push. Retention follows ATERMIUS_AUDIT_RETENTION_DAYS.
      parameters:
        - name: cursor
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Authorized audit event page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '400': {description: INVALID_LIMIT or INVALID_AUDIT_CURSOR}
        '401': {description: AUTH_REQUIRED}
        '410': {description: AUDIT_CURSOR_EXPIRED after a server generation change}
  /health/live:
    servers:
      - url: /
        description: Health endpoints are mounted outside the /api/v1 API prefix.
    get: {summary: Liveness, security: [], responses: {'200': {description: Alive}}}
  /health/ready:
    servers:
      - url: /
        description: Health endpoints are mounted outside the /api/v1 API prefix.
    get: {summary: Readiness, security: [], responses: {'200': {description: Ready}}}
components:
  schemas:
    TerminalSessionCreate:
      type: object
      additionalProperties: false
      required: [protocol_version, session_id, expires_at, observers]
      properties:
        protocol_version: {type: integer, enum: [1, 2]}
        session_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        observers:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [user_id, device_id, keybox]
            properties:
              user_id: {type: string, format: uuid}
              device_id: {type: string, format: uuid}
              keybox: {$ref: '#/components/schemas/TerminalKeybox'}
    TerminalKeybox:
      type: object
      additionalProperties: false
      required: [format, session_id, vault_id, membership_version, host_user_id, host_device_id, observer_user_id, observer_device_id, role, epoch, expires_at, sealed_secret, signature]
      properties:
        format: {type: string, const: atermius-terminal-keybox-v1}
        session_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        membership_version: {type: integer, minimum: 1}
        host_user_id: {type: string, format: uuid}
        host_device_id: {type: string, format: uuid}
        observer_user_id: {type: string, format: uuid}
        observer_device_id: {type: string, format: uuid}
        role: {type: string, const: observer}
        epoch: {type: integer, const: 1}
        expires_at: {type: string, format: date-time}
        sealed_secret: {type: string, minLength: 107, maxLength: 107, pattern: '^[A-Za-z0-9_-]+$'}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]+$'}
    TerminalControllerLeaseCreate:
      type: object
      additionalProperties: false
      required: [controller_user_id, controller_device_id, lease_id, control_epoch, expires_at, keybox]
      properties:
        controller_user_id: {type: string, format: uuid}
        controller_device_id: {type: string, format: uuid}
        lease_id: {type: string, format: uuid}
        control_epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        expires_at:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp at whole-second precision; any fractional component must be zero.
        keybox: {$ref: '#/components/schemas/TerminalControlKeybox'}
    TerminalControlKeybox:
      type: object
      additionalProperties: false
      required: [format, session_id, vault_id, membership_version, host_user_id, host_device_id, controller_user_id, controller_device_id, lease_id, control_epoch, purpose, expires_at, sealed_secret, signature]
      properties:
        format: {type: string, const: atermius-terminal-control-keybox-v2}
        session_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        membership_version: {type: integer, minimum: 1}
        host_user_id: {type: string, format: uuid}
        host_device_id: {type: string, format: uuid}
        controller_user_id: {type: string, format: uuid}
        controller_device_id: {type: string, format: uuid}
        lease_id: {type: string, format: uuid}
        control_epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        purpose: {type: string, const: input}
        expires_at:
          type: string
          format: date-time
          description: UTC RFC3339 timestamp at whole-second precision; any fractional component must be zero.
        sealed_secret: {type: string, minLength: 107, maxLength: 107, pattern: '^[A-Za-z0-9_-]+$'}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]+$'}
    TerminalControllerLease:
      type: object
      additionalProperties: false
      required: [lease_id, control_epoch, expires_at]
      properties:
        lease_id: {type: string, format: uuid}
        control_epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        expires_at: {type: string, format: date-time}
    TerminalControllerTicket:
      type: object
      additionalProperties: false
      required: [ticket, role, lease_id, control_epoch, control_keybox, ticket_expires_at, connect_path]
      properties:
        ticket: {type: string, minLength: 43, maxLength: 43}
        role: {type: string, const: controller}
        lease_id: {type: string, format: uuid}
        control_epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        control_keybox: {$ref: '#/components/schemas/TerminalControlKeybox'}
        ticket_expires_at: {type: string, format: date-time}
        connect_path: {type: string, const: '/collaboration/v1/connect'}
    TerminalInputFrame:
      description: Signed opaque input frame nested as frame inside a controller WebSocket application message.
      type: object
      additionalProperties: false
      required: [format, session_id, vault_id, membership_version, host_user_id, host_device_id, controller_user_id, controller_device_id, lease_id, control_epoch, sequence, nonce, ciphertext, signature]
      properties:
        format: {type: string, const: atermius-terminal-input-frame-v2}
        session_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        membership_version: {type: integer, minimum: 1}
        host_user_id: {type: string, format: uuid}
        host_device_id: {type: string, format: uuid}
        controller_user_id: {type: string, format: uuid}
        controller_device_id: {type: string, format: uuid}
        lease_id: {type: string, format: uuid}
        control_epoch: {type: integer, minimum: 1, maximum: 9007199254740991}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$'}
        ciphertext: {type: string, minLength: 22, maxLength: 10944, pattern: '^[A-Za-z0-9_-]+$'}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]+$'}
    TerminalFrame:
      description: Signed opaque frame nested as frame inside a host WebSocket application message. The signature covers every field except signature, including nonce and ciphertext.
      type: object
      additionalProperties: false
      required: [format, session_id, vault_id, membership_version, host_user_id, host_device_id, recipient_user_id, recipient_device_id, role, epoch, sequence, kind, nonce, ciphertext, signature]
      properties:
        format: {type: string, const: atermius-terminal-frame-v1}
        session_id: {type: string, format: uuid}
        vault_id: {type: string, format: uuid}
        membership_version: {type: integer, minimum: 1}
        host_user_id: {type: string, format: uuid}
        host_device_id: {type: string, format: uuid}
        recipient_user_id: {type: string, format: uuid}
        recipient_device_id: {type: string, format: uuid}
        role: {type: string, const: observer}
        epoch: {type: integer, const: 1}
        sequence: {type: integer, minimum: 1, maximum: 9007199254740991}
        kind: {type: string, enum: [output, resize]}
        nonce: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$', description: Canonical unpadded base64url for a 24-byte XChaCha20-Poly1305 nonce.}
        ciphertext: {type: string, minLength: 22, maxLength: 21867, pattern: '^[A-Za-z0-9_-]+$', description: Canonical unpadded base64url for 16 to 16400 bytes of ciphertext including the Poly1305 tag.}
        signature: {type: string, minLength: 86, maxLength: 86, pattern: '^[A-Za-z0-9_-]+$', description: Canonical unpadded base64url for a 64-byte Ed25519 signature.}
    AuthSession:
      type: object
      additionalProperties: false
      required: [account_id, access_token, expires_in, refresh_token, device_id, vaults]
      properties:
        account_id: {type: string, format: uuid}
        access_token: {type: string, minLength: 1}
        expires_in: {type: integer, minimum: 1}
        refresh_token: {type: string, minLength: 1}
        device_id: {type: string, format: uuid}
        vaults:
          type: array
          items: {type: object}
    MfaLoginChallenge:
      type: object
      additionalProperties: false
      required: [mfa_required, challenge_id, expires_at, methods]
      properties:
        mfa_required: {type: boolean, const: true}
        challenge_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        methods:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [totp, recovery_code]}
    MfaStatus:
      type: object
      additionalProperties: false
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled: {type: boolean}
        recovery_codes_remaining: {type: integer, minimum: 0, maximum: 10}
    MfaTotpSetup:
      type: object
      additionalProperties: false
      required: [secret, provisioning_uri, expires_at]
      properties:
        secret: {type: string, minLength: 32, maxLength: 32, pattern: '^[A-Z2-7]{32}$', description: Base32 encoding of 20 random bytes, uppercase without padding}
        provisioning_uri: {type: string, minLength: 1, pattern: '^otpauth://totp/'}
        expires_at: {type: string, format: date-time}
    MfaRecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items: {type: string, minLength: 19, maxLength: 19, pattern: '^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$', description: Base32 of 10 random bytes, grouped as XXXX-XXXX-XXXX-XXXX without padding}
    MfaStepUpRequest:
      type: object
      additionalProperties: false
      required: [current_login_verifier]
      properties:
        current_login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier; never a password}
    MfaConfirmRequest:
      type: object
      additionalProperties: false
      required: [current_login_verifier, totp_code]
      properties:
        current_login_verifier: {type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]{43}$', description: Client-derived 32-byte verifier; never a password}
        totp_code: {type: string, minLength: 6, maxLength: 6, pattern: '^[0-9]{6}$'}
    RotatedSession:
      type: object
