# Daily Android release build, limited to one build attempt per UTC day.
#
# Checkpoint: cron 00:00 UTC. GitHub does not start scheduled runs to the
# second: they usually start minutes late, sometimes much later, and may be
# dropped under load; the quota day is the UTC date when the gate runs.
# A run builds only if (a) it runs for the default branch, (b) no build attempt
# was claimed yet for that UTC day, and (c) product/packaging inputs
# (.github/daily-build/inputs.txt) differ from the last build that was
# compiled AND published. Repeated schedule/dispatch/re-runs on the same day
# only check and skip. State lives in git refs (refs/atermius-ci/daily-build/*),
# never in Actions caches/artifacts. Details: .github/daily-build/README.md
name: Daily build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: daily-build-${{ github.repository }}
  cancel-in-progress: false

env:
  ATERMIUS_RELEASE_BRANCH: main
  ATERMIUS_DAILY_QUOTA: "1"
  ATERMIUS_DAILY_NAMESPACE: refs/atermius-ci/daily-build
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CMAKE_BUILD_PARALLEL: "2"
  MAKEFLAGS: "-j2"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  gate:
    name: Gate (UTC quota, inputs, claim)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the quota claim ref; no build or third-party code runs here
    outputs:
      build: ${{ steps.gate.outputs.build }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      quota_date: ${{ steps.gate.outputs.quota_date }}
      quota_slot: ${{ steps.gate.outputs.quota_slot }}
      claim_record: ${{ steps.gate.outputs.claim_record }}
      claim_run_attempt: ${{ steps.gate.outputs.claim_run_attempt }}
      baseline_record: ${{ steps.gate.outputs.baseline_record }}
      version_code: ${{ steps.gate.outputs.version_code }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true # git push of refs/atermius-ci/daily-build/quota/*
      - name: Check quota and inputs; claim today's build
        id: gate
        env:
          ATERMIUS_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ATERMIUS_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          # Runner clock decides the UTC day; a fresh (cache-busted) GitHub Date must agree
          # within 120 s and on the same date, else the gate exits 3 and nothing is claimed.
          for attempt in 1 2 3 4; do
            server_date="$(curl -fsS --max-time 20 -o /dev/null -D - -H 'Cache-Control: no-cache' \
              "$GITHUB_API_URL/rate_limit?daily_gate=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.$attempt" \
              | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -n 1)" || server_date=""
            if [ -n "$server_date" ]; then
              status=0
              python3 -I .github/daily-build/daily_gate.py gate \
                --branch "$ATERMIUS_RELEASE_BRANCH" --namespace "$ATERMIUS_DAILY_NAMESPACE" \
                --daily-quota "$ATERMIUS_DAILY_QUOTA" --ref "$GITHUB_REF" --run-sha "$GITHUB_SHA" \
                --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
                --workflow "$GITHUB_WORKFLOW_REF" --repository "$GITHUB_REPOSITORY" \
                --server-date "$server_date" \
                --require-env ATERMIUS_ANDROID_SIGNING_CERT_SHA256 || status=$?
              [ "$status" -eq 3 ] || exit "$status"
            fi
            sleep 30
          done
          echo "::error::no consistent GitHub server Date after 4 attempts; nothing was claimed"
          exit 1

  build:
    name: Build APK (arm64-v8a + x86_64, RDP engine)
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.claim_run_attempt == github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      ATERMIUS_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      ATERMIUS_QUOTA_DATE: ${{ needs.gate.outputs.quota_date }}
      ATERMIUS_RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
      ATERMIUS_VERSION_CODE: ${{ needs.gate.outputs.version_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Work paths and NDK pin (from build_engine.sh)
        run: |
          {
            echo "ATERMIUS_OUT=$RUNNER_TEMP/out"
            echo "ATERMIUS_ENGINE_DEPS=$RUNNER_TEMP/rdp-engine-deps"
            echo "ATERMIUS_ENGINE_WORK=$RUNNER_TEMP/rdp-engine-work"
            echo "PUB_CACHE=$RUNNER_TEMP/pub-cache"
            sed -n 's/^NDK_PIN=\([0-9][0-9.]*\).*/ATERMIUS_NDK_PIN=\1/p' apps/client/native/desktop/android/build_engine.sh
          } >> "$GITHUB_ENV"
      - name: Reserve disk space for native and Gradle builds
        run: |
          # This cleanup is only for disposable GitHub-hosted Linux runners.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h "$RUNNER_TEMP"
          sudo rm -rf -- /usr/share/dotnet /opt/ghc /usr/local/.ghcup "${AGENT_TOOLSDIRECTORY:?}/CodeQL"
          df -h "$RUNNER_TEMP"
      - name: Shared NDK cache path
        run: echo "ATERMIUS_NDK_PATH=$ANDROID_HOME/ndk/$ATERMIUS_NDK_PIN" >> "$GITHUB_ENV"
      - name: Cache Android NDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.ATERMIUS_NDK_PATH }}
          key: android-ndk-sdk-v2-${{ env.ATERMIUS_NDK_PIN }}-${{ runner.os }}-${{ runner.arch }}
      - name: Toolchain (JDK 17, pinned NDK, build-tools, Gradle limits)
        run: bash .github/daily-build/recipe/android_toolchain.sh
      - name: Cache Flutter SDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/aterminal-flutter-3.47.5
          key: flutter-3.47.5-2132e990f236f8d2-${{ runner.os }}-${{ runner.arch }}-android
      - name: Flutter SDK 3.47.5 (pinned archive digest)
        run: bash tools/install_flutter_linux.sh
      - name: Cache pub packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-3.47.5-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-3.47.5-
      - name: Cache Gradle dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-3.47.5-${{ hashFiles('apps/client/android/**/*.gradle*', 'apps/client/android/gradle/wrapper/gradle-wrapper.properties', 'apps/client/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-3.47.5-
      - name: Cache official engine sources (deps.lock digests)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/rdp-engine-deps
          key: android-rdp-deps-${{ hashFiles('apps/client/native/desktop/android/deps.lock') }}
      - name: Engine cache key (recipe, sources, ABIs, NDK, host tools)
        id: engine-key
        run: bash .github/daily-build/recipe/android_engine_key.sh
      - name: Cache engine work directory (exact key only)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/rdp-engine-work
          key: ${{ steps.engine-key.outputs.key }}
      - name: Build engine and release APK
        run: bash .github/daily-build/recipe/android_build.sh
      - name: Upload intermediate APK (not distributable)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-intermediate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sign:
    name: Sign APK with the stable project key
    needs: [gate, build]
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.claim_run_attempt == github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: daily-release # signing secrets live here; deployment branches: main only
    permissions:
      contents: read
    env:
      ATERMIUS_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      ATERMIUS_QUOTA_DATE: ${{ needs.gate.outputs.quota_date }}
      ATERMIUS_RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/daily-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-intermediate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intermediate
      - name: build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          echo "ATERMIUS_BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
      - name: Re-sign, verify certificate pin and alignment
        env:
          ATERMIUS_ANDROID_KEYSTORE_B64: ${{ secrets.ATERMIUS_ANDROID_KEYSTORE_B64 }}
          ATERMIUS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATERMIUS_ANDROID_KEYSTORE_PASSWORD }}
          ATERMIUS_ANDROID_KEY_ALIAS: ${{ secrets.ATERMIUS_ANDROID_KEY_ALIAS }}
          ATERMIUS_ANDROID_KEY_PASSWORD: ${{ secrets.ATERMIUS_ANDROID_KEY_PASSWORD }}
          ATERMIUS_ANDROID_SIGNING_CERT_SHA256: ${{ vars.ATERMIUS_ANDROID_SIGNING_CERT_SHA256 }}
        run: bash .github/daily-build/recipe/android_sign.sh "$RUNNER_TEMP/intermediate" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish release and advance baseline
    needs: [gate, sign]
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.claim_run_attempt == github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # GitHub release + tag, baseline ref; runs only the verified scripts below
    env:
      ATERMIUS_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      ATERMIUS_QUOTA_DATE: ${{ needs.gate.outputs.quota_date }}
      ATERMIUS_QUOTA_SLOT: ${{ needs.gate.outputs.quota_slot }}
      ATERMIUS_CLAIM_RECORD: ${{ needs.gate.outputs.claim_record }}
      ATERMIUS_BASELINE_RECORD: ${{ needs.gate.outputs.baseline_record }}
      ATERMIUS_RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
      ATERMIUS_PLATFORMS: android
      ATERMIUS_RELEASE_TITLE: Atermius Android daily ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: true # git push of the baseline ref
          sparse-checkout: .github/daily-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Verify, publish, advance baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/daily-build/publish.sh "$RUNNER_TEMP/release"
