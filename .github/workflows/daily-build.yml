# Daily desktop (Windows / Linux / macOS) release build, limited to one build attempt per UTC day.
#
# Checkpoint: cron 00:00 UTC. GitHub does not start scheduled runs to the
# second: they usually start minutes late, sometimes much later, and may be
# dropped under load; the quota day is the UTC date when the gate runs.
# A run builds only if (a) it runs for the default branch, (b) no build attempt
# was claimed yet for that UTC day, and (c) product/packaging inputs
# (.github/daily-build/inputs.txt) differ from the last build that was
# compiled AND published. Repeated schedule/dispatch/re-runs on the same day
# only check and skip. State lives in git refs (refs/atermius-ci/daily-build/*),
# never in Actions caches/artifacts. Details: .github/daily-build/README.md
name: Daily build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: daily-build-${{ github.repository }}
  cancel-in-progress: false

env:
  ATERMIUS_RELEASE_BRANCH: main
  ATERMIUS_DAILY_QUOTA: "1"
  ATERMIUS_DAILY_NAMESPACE: refs/atermius-ci/daily-build
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CMAKE_BUILD_PARALLEL: "2"
  MAKEFLAGS: "-j2"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  gate:
    name: Gate (UTC quota, inputs, claim)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the quota claim ref; no build or third-party code runs here
    outputs:
      build: ${{ steps.gate.outputs.build }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      quota_date: ${{ steps.gate.outputs.quota_date }}
      quota_slot: ${{ steps.gate.outputs.quota_slot }}
      claim_record: ${{ steps.gate.outputs.claim_record }}
      claim_run_attempt: ${{ steps.gate.outputs.claim_run_attempt }}
      baseline_record: ${{ steps.gate.outputs.baseline_record }}
      version_code: ${{ steps.gate.outputs.version_code }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: true # git push of refs/atermius-ci/daily-build/quota/*
      - name: Check quota and inputs; claim today's build
        id: gate
        run: |
          # Runner clock decides the UTC day; a fresh (cache-busted) GitHub Date must agree
          # within 120 s and on the same date, else the gate exits 3 and nothing is claimed.
          for attempt in 1 2 3 4; do
            server_date="$(curl -fsS --max-time 20 -o /dev/null -D - -H 'Cache-Control: no-cache' \
              "$GITHUB_API_URL/rate_limit?daily_gate=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.$attempt" \
              | tr -d '\r' | sed -n 's/^[Dd]ate: //p' | head -n 1)" || server_date=""
            if [ -n "$server_date" ]; then
              status=0
              python3 -I .github/daily-build/daily_gate.py gate \
                --branch "$ATERMIUS_RELEASE_BRANCH" --namespace "$ATERMIUS_DAILY_NAMESPACE" \
                --daily-quota "$ATERMIUS_DAILY_QUOTA" --ref "$GITHUB_REF" --run-sha "$GITHUB_SHA" \
                --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME" \
                --workflow "$GITHUB_WORKFLOW_REF" --repository "$GITHUB_REPOSITORY" \
                --server-date "$server_date" || status=$?
              [ "$status" -eq 3 ] || exit "$status"
            fi
            sleep 30
          done
          echo "::error::no consistent GitHub server Date after 4 attempts; nothing was claimed"
          exit 1

  build:
    name: Build ${{ matrix.platform }}
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.claim_run_attempt == github.run_attempt
    strategy:
      fail-fast: false # one failed platform already fails the day; finish the others for diagnostics
      max-parallel: 2
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022 # build_rdp_windows.ps1 generates for Visual Studio 2022
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      ATERMIUS_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      ATERMIUS_QUOTA_DATE: ${{ needs.gate.outputs.quota_date }}
      ATERMIUS_RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Work paths
        run: |
          {
            echo "ATERMIUS_OUT=$RUNNER_TEMP/out"
            echo "PUB_CACHE=$RUNNER_TEMP/pub-cache"
            echo "ATERMIUS_VCPKG_CACHE=$RUNNER_TEMP/vcpkg-bincache"
            echo "ATERMIUS_FIREBASE_CACHE=$RUNNER_TEMP/firebase-sdk"
          } >> "$GITHUB_ENV"
      - name: Cache Flutter SDK (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/aterminal-flutter-3.47.5
          key: flutter-3.47.5-2132e990f236f8d2-${{ runner.os }}-${{ runner.arch }}-desktop
      - name: Flutter SDK 3.47.5 (Linux, pinned archive digest)
        if: runner.os == 'Linux'
        run: bash tools/install_flutter_linux.sh
      - name: Cache Flutter SDK (macOS / Windows)
        if: runner.os != 'Linux'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/flutter-sdk
          key: flutter-3.47.5-6a19cca56475-${{ runner.os }}-${{ runner.arch }}
      - name: Flutter SDK 3.47.5 (macOS, verified archive)
        if: runner.os == 'macOS'
        run: python3 -I .github/daily-build/recipe/flutter_sdk.py install --dest "$RUNNER_TEMP/flutter-sdk"
      - name: Flutter SDK 3.47.5 (Windows, pinned archive digest)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -I .github/daily-build/recipe/flutter_sdk.py install --dest "$env:RUNNER_TEMP/flutter-sdk"
      - name: Cache pub packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-3.47.5-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-3.47.5-
      - name: vcpkg revision (Windows)
        id: vcpkg
        if: runner.os == 'Windows'
        run: echo "commit=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache vcpkg binary packages (Windows; ABI-hash addressed)
        if: runner.os == 'Windows'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-${{ steps.vcpkg.outputs.commit }}-x64-windows-static-md
          restore-keys: vcpkg-${{ steps.vcpkg.outputs.commit }}-
      - name: Cache Firebase C++ SDK (Windows; digest-checked)
        if: runner.os == 'Windows'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/firebase-sdk
          key: firebase-cpp-sdk-windows-${{ hashFiles('apps/client/pubspec.lock') }}
          restore-keys: firebase-cpp-sdk-windows-
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./.github/daily-build/recipe/desktop_windows.ps1'
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash .github/daily-build/recipe/desktop_linux.sh
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash .github/daily-build/recipe/desktop_macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish release and advance baseline
    needs: [gate, build]
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.claim_run_attempt == github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # GitHub release + tag, baseline ref; runs only the verified scripts below
    env:
      ATERMIUS_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      ATERMIUS_QUOTA_DATE: ${{ needs.gate.outputs.quota_date }}
      ATERMIUS_QUOTA_SLOT: ${{ needs.gate.outputs.quota_slot }}
      ATERMIUS_CLAIM_RECORD: ${{ needs.gate.outputs.claim_record }}
      ATERMIUS_BASELINE_RECORD: ${{ needs.gate.outputs.baseline_record }}
      ATERMIUS_RELEASE_TAG: ${{ needs.gate.outputs.release_tag }}
      ATERMIUS_PLATFORMS: linux-x64,macos,windows-x64
      ATERMIUS_RELEASE_TITLE: Atermius desktop daily ${{ needs.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: true # git push of the baseline ref
          sparse-checkout: .github/daily-build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Verify, publish, advance baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/daily-build/publish.sh "$RUNNER_TEMP/release"
