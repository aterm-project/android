name: Client checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CMAKE_BUILD_PARALLEL: "2"
  MAKEFLAGS: "-j2"
  CARGO_BUILD_JOBS: "2"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I .github/daily-build/tests/test_android_toolchain.py
      - run: bash tools/install_flutter_linux.sh
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter test --concurrency=2 test/session_workspace_actions_test.dart test/workspace_tab_drag_test.dart test/terminal_keybar_test.dart test/android_desktop_route_test.dart test/android_direct_desktop_test.dart test/rdp_certificate_test.dart test/desktop_host_editor_test.dart test/terminal_tools_sidebar_test.dart test/cloud_access_client_test.dart test/cloud_access_interop_test.dart test/mcp_access_policy_test.dart test/mcp_app_workspace_policy_test.dart test/mcp_protocol_test.dart test/mcp_listener_lifecycle_test.dart test/mcp_listener_transport_test.dart test/mcp_settings_panel_test.dart test/fullscreen_test.dart test/desktop_keyboard_mode_test.dart test/direct_desktop_test.dart test/desktop_resolution_test.dart test/desktop_mobile_controls_test.dart test/desktop_protocol_test.dart
        working-directory: apps/client
      - run: flutter test --concurrency=2 test/session_recovery_test.dart test/desktop_reconnect_test.dart test/telnet_app_controller_test.dart test/terminal_tabs_controller_test.dart test/telnet_local_profile_widget_test.dart test/terminal_tabs_widget_test.dart
        working-directory: apps/client
      - run: python3 -I integration/native/android_apk_abi_check.py --self-test
