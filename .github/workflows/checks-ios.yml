# iOS client checks: focused Flutter tests (as the pre-monorepo
# aterm-project/ios repository's checks.yml).
#
# Path filters: shared client code (apps/client/lib, test, pubspec.*, l10n.yaml,
# packages/, protocol/, the Flutter installer) runs every client's checks; the
# iOS runner and engine directories run only these. Tag pushes ignore path
# filters (GitHub), so every tag push still runs all checks as before. Keep the
# push and pull_request lists identical (lint_workflows.py enforces it).
name: iOS checks
on:
  push:
    paths:
      - apps/client/lib/**
      - apps/client/test/**
      - apps/client/pubspec.*
      - apps/client/l10n.yaml
      - packages/**
      - protocol/**
      - tools/install_flutter_linux.sh
      - apps/client/ios/**
      - apps/client/native/desktop/*
      - apps/client/native/desktop/apple/**
      - scripts/build_ios.sh
      - .github/workflows/checks-ios.yml
  pull_request:
    paths:
      - apps/client/lib/**
      - apps/client/test/**
      - apps/client/pubspec.*
      - apps/client/l10n.yaml
      - packages/**
      - protocol/**
      - tools/install_flutter_linux.sh
      - apps/client/ios/**
      - apps/client/native/desktop/*
      - apps/client/native/desktop/apple/**
      - scripts/build_ios.sh
      - .github/workflows/checks-ios.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CMAKE_BUILD_PARALLEL: "2"
  MAKEFLAGS: "-j2"
  CARGO_BUILD_JOBS: "2"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash tools/install_flutter_linux.sh
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter test --concurrency=2 test/apple_platform_engineering_test.dart test/terminal_touch_selection_test.dart test/fullscreen_tabs_peek_test.dart test/ssh_background_keepalive_test.dart
        working-directory: apps/client
      - run: flutter test --concurrency=2 test/session_workspace_actions_test.dart test/workspace_tab_drag_test.dart test/terminal_tools_sidebar_test.dart test/cloud_access_client_test.dart test/cloud_access_interop_test.dart test/fullscreen_test.dart test/desktop_keyboard_mode_test.dart test/direct_desktop_test.dart test/desktop_resolution_test.dart test/desktop_mobile_controls_test.dart test/desktop_protocol_test.dart
        working-directory: apps/client
      - run: flutter test --concurrency=2 test/session_recovery_test.dart test/desktop_reconnect_test.dart test/telnet_app_controller_test.dart test/terminal_tabs_controller_test.dart test/telnet_local_profile_widget_test.dart test/terminal_tabs_widget_test.dart
        working-directory: apps/client
