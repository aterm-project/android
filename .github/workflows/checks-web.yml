# Web client checks: focused Flutter tests and the pinned-nginx runtime check of deploy/nginx.conf (as the pre-monorepo
# aterm-project/web repository's checks.yml).
#
# Path filters: shared client code (apps/client/lib, test, pubspec.*, l10n.yaml,
# packages/, protocol/, the Flutter installer) runs every client's checks; the
# Web runner and engine directories run only these. Tag pushes ignore path
# filters (GitHub), so every tag push still runs all checks as before. Keep the
# push and pull_request lists identical (lint_workflows.py enforces it).
name: Web checks
on:
  push:
    paths:
      - apps/client/lib/**
      - apps/client/test/**
      - apps/client/pubspec.*
      - apps/client/l10n.yaml
      - packages/**
      - protocol/**
      - tools/install_flutter_linux.sh
      - apps/client/web/**
      - deploy/nginx.conf
      - tools/verify_cloud_proxy.py
      - Dockerfile
      - .dockerignore
      - .github/workflows/checks-web.yml
  pull_request:
    paths:
      - apps/client/lib/**
      - apps/client/test/**
      - apps/client/pubspec.*
      - apps/client/l10n.yaml
      - packages/**
      - protocol/**
      - tools/install_flutter_linux.sh
      - apps/client/web/**
      - deploy/nginx.conf
      - tools/verify_cloud_proxy.py
      - Dockerfile
      - .dockerignore
      - .github/workflows/checks-web.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CMAKE_BUILD_PARALLEL: "2"
  MAKEFLAGS: "-j2"
  CARGO_BUILD_JOBS: "2"
  FLUTTER_SUPPRESS_ANALYTICS: "true"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash tools/install_flutter_linux.sh
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/client
      - run: flutter test --concurrency=2 test/session_workspace_actions_test.dart test/workspace_tab_drag_test.dart test/terminal_tools_sidebar_test.dart test/cloud_access_client_test.dart test/cloud_access_interop_test.dart test/credential_escrow_crypto_test.dart test/credential_escrow_interop_test.dart test/credential_escrow_admin_test.dart test/credential_visibility_api_test.dart test/credential_visibility_service_test.dart test/credential_visibility_clipboard_test.dart test/credential_visibility_widget_test.dart test/fullscreen_test.dart test/desktop_keyboard_mode_test.dart test/direct_desktop_test.dart test/desktop_resolution_test.dart test/desktop_mobile_controls_test.dart test/desktop_protocol_test.dart
        working-directory: apps/client
      # The release `flutter build web` runs in the quota-limited daily workflow
      # (.github/workflows/daily-web.yml), which also runs this check on the
      # built bundle. Here the deployment nginx config (headers, CSP, API proxy,
      # WebSocket upgrade) is still checked on every push/PR, serving the
      # checked-in web shell (index.html, share-bootstrap.js) without compiling.
      - run: python3 tools/verify_cloud_proxy.py --web-root apps/client/web
      - run: flutter test --concurrency=2 test/session_recovery_test.dart test/desktop_reconnect_test.dart test/telnet_app_controller_test.dart test/terminal_tabs_controller_test.dart test/telnet_local_profile_widget_test.dart test/terminal_tabs_widget_test.dart
        working-directory: apps/client
