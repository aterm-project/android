services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      ATERMIUS_BIND: "0.0.0.0:8080"
      ATERMIUS_DATA_DIR: "${ATERMIUS_DATA_DIR:-/data}"
      ATERMIUS_DATABASE_URL: "${ATERMIUS_DATABASE_URL:-sqlite:///data/atermius.db?mode=rwc}"
      # SQLCipher key for the main database, kept on the separate keys volume
      # outside /data. Empty keeps a plaintext database (reported to admins as
      # database_encryption=disabled). See docs/runbooks/database-encryption.md.
      ATERMIUS_DATABASE_KEY_FILE: "${ATERMIUS_DATABASE_KEY_FILE:-}"
      ATERMIUS_REGISTRATION_OPEN: "false"
      ATERMIUS_HISTORY_RETENTION_DAYS: "${ATERMIUS_HISTORY_RETENTION_DAYS:-90}"
      ATERMIUS_VAULT_DELETION_GRACE_SECONDS: "${ATERMIUS_VAULT_DELETION_GRACE_SECONDS:-604800}"
      ATERMIUS_ACCOUNT_DELETION_GRACE_SECONDS: "${ATERMIUS_ACCOUNT_DELETION_GRACE_SECONDS:-604800}"
      ATERMIUS_AUDIT_RETENTION_DAYS: "${ATERMIUS_AUDIT_RETENTION_DAYS:-365}"
      ATERMIUS_OBJECT_GC_GRACE_SECONDS: "${ATERMIUS_OBJECT_GC_GRACE_SECONDS:-604800}"
      ATERMIUS_MAX_VAULTS_PER_USER: "${ATERMIUS_MAX_VAULTS_PER_USER:-50}"
      ATERMIUS_MAX_MEMBERS_PER_VAULT: "${ATERMIUS_MAX_MEMBERS_PER_VAULT:-100}"
      ATERMIUS_MAX_ACTIVE_RECOVERY_CHALLENGES: "${ATERMIUS_MAX_ACTIVE_RECOVERY_CHALLENGES:-10000}"
      ATERMIUS_ADMIN_USERNAMES: "${ATERMIUS_ADMIN_USERNAMES:-}"
      ATERMIUS_RELAY_ENABLED: "${ATERMIUS_RELAY_ENABLED:-false}"
      ATERMIUS_TERMINAL_COLLABORATION_ENABLED: "${ATERMIUS_TERMINAL_COLLABORATION_ENABLED:-false}"
      ATERMIUS_RELAY_ALLOW_CIDRS: "${ATERMIUS_RELAY_ALLOW_CIDRS:-}"
      ATERMIUS_RELAY_ALLOW_PORTS: "${ATERMIUS_RELAY_ALLOW_PORTS:-}"
      ATERMIUS_PUBLIC_ORIGIN: "${ATERMIUS_PUBLIC_ORIGIN:-}"
      ATERMIUS_AUTH_RATE_WINDOW_SECONDS: "${ATERMIUS_AUTH_RATE_WINDOW_SECONDS:-900}"
      ATERMIUS_AUTH_LOGIN_USER_LIMIT: "${ATERMIUS_AUTH_LOGIN_USER_LIMIT:-12}"
      ATERMIUS_AUTH_LOGIN_PAIR_LIMIT: "${ATERMIUS_AUTH_LOGIN_PAIR_LIMIT:-8}"
      ATERMIUS_AUTH_LOGIN_IP_LIMIT: "${ATERMIUS_AUTH_LOGIN_IP_LIMIT:-3000}"
      ATERMIUS_AUTH_PRELOGIN_USER_LIMIT: "${ATERMIUS_AUTH_PRELOGIN_USER_LIMIT:-30}"
      ATERMIUS_AUTH_PRELOGIN_PAIR_LIMIT: "${ATERMIUS_AUTH_PRELOGIN_PAIR_LIMIT:-20}"
      ATERMIUS_AUTH_PRELOGIN_IP_LIMIT: "${ATERMIUS_AUTH_PRELOGIN_IP_LIMIT:-6000}"
      ATERMIUS_AUTH_REGISTER_USER_LIMIT: "${ATERMIUS_AUTH_REGISTER_USER_LIMIT:-3}"
      ATERMIUS_AUTH_REGISTER_PAIR_LIMIT: "${ATERMIUS_AUTH_REGISTER_PAIR_LIMIT:-3}"
      ATERMIUS_AUTH_REGISTER_IP_LIMIT: "${ATERMIUS_AUTH_REGISTER_IP_LIMIT:-60}"
    ports:
      - "127.0.0.1:${ATERMIUS_HOST_PORT:-8080}:8080"
    volumes:
      - server-data:/data
      # Owner-only (0700, UID 10001) volume for the database key. Back it up
      # separately from the data volume; the server only reads it.
      - server-keys:/keys
    healthcheck:
      test: ["CMD", "/usr/local/bin/atermius-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  server-data:
    name: "${ATERMIUS_DATA_VOLUME_NAME:-atermius-data}"
  server-keys:
    name: "${ATERMIUS_KEYS_VOLUME_NAME:-atermius-keys}"
