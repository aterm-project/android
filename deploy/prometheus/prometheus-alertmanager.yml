global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/atermius-alerts.yml

scrape_configs:
  - job_name: atermius
    metrics_path: /api/v1/admin/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/atermius-secrets/metrics-token
    static_configs:
      - targets:
          - server:8080

