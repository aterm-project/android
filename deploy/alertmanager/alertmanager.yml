global:
  resolve_timeout: 5m

route:
  receiver: discard
  group_by:
    - alertname
  group_wait: 1s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: aterm-webhook
      matchers:
        - alertname="AtermiusMetricsScrapeUnavailable"

receivers:
  - name: discard
  - name: aterm-webhook
    webhook_configs:
      - url_file: /run/atermius-alertmanager-secrets/webhook-url
        send_resolved: true

