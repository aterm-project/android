worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_max_body_size 0; # Backend enforces per-endpoint limits.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $origin_scheme { default $scheme; https https; http http; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Every server protocol endpoint uses the same browser origin. Preserve
    # streaming uploads, WebSocket upgrades and long-lived terminal sessions.
    location ~ ^/(api/|relay/|desktop/|collaboration/|health/) {
      proxy_pass http://server:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $origin_scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }
    location ~* \.(js|wasm|json)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
