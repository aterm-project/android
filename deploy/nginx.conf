worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  client_max_body_size 0; # Backend enforces per-endpoint limits.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $origin_scheme { default $scheme; https https; http http; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Every server protocol endpoint uses the same browser origin. Preserve
    # streaming uploads, WebSocket upgrades and long-lived terminal sessions.
    location ~ ^/(api/|relay/|desktop/|collaboration/|gateway/|health/) {
      proxy_pass http://server:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $origin_scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }
    # Sharing and joining are fragment-bearing browser entry points. Serve
    # the same neutral SPA without an internal redirect losing these headers.
    location ~ ^/(s/|join/?$) {
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
      try_files /index.html =404;
    }
    location ~* \.(js|wasm|json)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
