# Optional TLS edge proxy. Apply with compose.yaml only after setting the
# public domain, ACME contact, and exact browser origin in deploy/.env.
services:
  server:
    # Compose 2.24+ resets the base loopback port mapping. The API remains
    # reachable to trusted services on the project network, but not on the
    # Docker host's published ports.
    ports: !reset []
    expose:
      - "8080"
    networks:
      - default
      - caddy-backend

  edge:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      ATERMIUS_CADDY_DOMAIN: "${ATERMIUS_CADDY_DOMAIN:?Set ATERMIUS_CADDY_DOMAIN in deploy/.env}"
      ATERMIUS_CADDY_ACME_EMAIL: "${ATERMIUS_CADDY_ACME_EMAIL:?Set ATERMIUS_CADDY_ACME_EMAIL in deploy/.env}"
    ports:
      - "${ATERMIUS_CADDY_HTTP_BIND:-0.0.0.0}:${ATERMIUS_CADDY_HTTP_HOST_PORT:-80}:80"
      - "${ATERMIUS_CADDY_HTTPS_BIND:-0.0.0.0}:${ATERMIUS_CADDY_HTTPS_HOST_PORT:-443}:443"
      - "${ATERMIUS_CADDY_HTTPS_BIND:-0.0.0.0}:${ATERMIUS_CADDY_HTTPS_HOST_PORT:-443}:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - caddy-backend
    healthcheck:
      # Probe through Caddy with the configured SNI and Host. This is the edge
      # readiness signal; the server container's healthcheck covers only the
      # origin process and database.
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --insecure --connect-timeout 2
          --max-time 5 --resolve "$${ATERMIUS_CADDY_DOMAIN}:443:127.0.0.1"
          "https://$${ATERMIUS_CADDY_DOMAIN}/health/ready" >/dev/null
      interval: 5s
      timeout: 6s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:

networks:
  caddy-backend:
    driver: bridge
