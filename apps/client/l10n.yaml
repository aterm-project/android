# Flutter gen_l10n configuration. Generated Dart files are written next to the
# ARB catalogs in lib/l10n and are checked in so builds stay offline-friendly.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
preferred-supported-locales: [en]
